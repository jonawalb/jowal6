const NW = 301, T0 = Date.parse('2020-12-28'), weekOf = d => Math.floor((Date.parse(d) - T0) / (7 * 864e5));
const SEL_W = weekOf('2022-02-24');      // week of 21 Feb 2022
// Quote: p.ex[0] of 'special military operation' (earliest use in the corpus): Address by the President of the
// Russian Federation, 24 Feb 2022, en.kremlin.ru/events/president/transcripts/67843.

// ---- Geometry ------------------------------------------------------------------------------------
const GX = 500, GW = 960, CW = GW / NW, GY = 262, RH = 14.5, CH = 22;
const X = w => GX + w * CW;
const heat = p => { const a = [0x24, 0x40, 0x31], b = [0xff, 0x6b, 0x4a]; return `rgb(${a.map((c, i) => Math.round(c + (b[i] - c) * p)).join(',')})`; };
const blurF = el('filter', { id: 'rg-blur', x: '-5%', y: '-5%', width: '110%', height: '110%' }, svg);
const blurG = el('feGaussianBlur', { stdDeviation: 0 }, blurF);
const cam = el('g', {}, svg);
const head = el('g', {}, cam);
const title = el('text', { x: GX, y: 130, class: 't-label' }, head);
const sub = el('text', { x: GX, y: 158, class: 'src' }, head);
const SEGS = [['Russia', 1180], ['Iran', 1320]].map(([n, x]) => {
  const g = el('g', {}, head), r = el('rect', { x, y: 110, width: 130, height: 38, rx: 6, class: 'seg' }, g);
  const t = el('text', { x: x + 65, y: 135, class: 'seg-t', 'text-anchor': 'middle' }, g); t.textContent = n;
  return { r, t, cx: x + 65, cy: 129 };
});

function buildGrid(cc) {
  const D = DATA[cc], g = el('g', {}, cam), cells = el('g', {}, g), labs = el('g', {}, g), evs = el('g', {}, g);
  const rowY = {};
  let y = GY;
  for (const r of D.rows) {
    if (r.c) { el('text', { x: GX - 12, y: y + 15, class: 'cat-t', 'text-anchor': 'end' }, labs).textContent = r.c; y += CH; continue; }
    const t = el('text', { x: GX - 12, y: y + RH - 3.5, class: 'row-t', 'text-anchor': 'end' }, labs); t.textContent = r.l;
    const rg = el('g', {}, cells);
    for (let w = 0; w < NW; w++) {
      const ch = r.s[w];
      el('rect', { x: (X(w) + .2).toFixed(1), y: y.toFixed(1), width: (CW - .4).toFixed(2), height: RH - 1.5, fill: ch === '.' ? '#0c1712' : ch === '0' ? '#17301f' : heat((14 + (ch.charCodeAt(0) - 97) / 19 * 86) / 100) }, rg);
    }
    rowY[r.id] = { y, t, g: rg };
    y += RH;
  }
  const H = y - GY;
  // key events above the grid
  D.ev.filter(([, n]) => SHOW_EV.includes(n)).forEach(([d, n], i) => {
    const x = X(weekOf(d)), ly = GY - 14 - (i % 2) * 16;
    el('path', { d: `M${x} ${ly + 3}V${GY - 2}`, stroke: '#8fa89a', opacity: .5 }, evs);
    el('text', { x: x + 3, y: ly, class: 'ev-t' }, evs).textContent = n;
  });
  for (let yr = 2022; yr <= 2026; yr++) el('text', { x: X(weekOf(`${yr}-01-01`)), y: GY + H + 24, class: 'yr' }, g).textContent = yr;
  el('text', { x: GX, y: GY + H + 24, class: 'yr' }, g).textContent = 2021;
  return { g, cells, rowY, H };
}
// A subset of the key events, spaced so their labels stay readable.
const SHOW_EV = ['Invasion', 'Mobilisation', 'New START suspended', 'Wagner mutiny', 'Doctrine update', 'Alaska summit',
  'Oct 7 attack', 'Nasrallah killed', 'E3 snapback', 'U.S.–Israeli war'];
const RU = buildGrid('ru'), IR = buildGrid('ir');
const clipR = el('clipPath', { id: 'rg-ru' }, svg), clipRr = el('rect', { x: 0, y: 0, width: 0, height: 1000 }, clipR);
const clipI = el('clipPath', { id: 'rg-ir' }, svg), clipIr = el('rect', { x: 0, y: 0, width: 0, height: 1000 }, clipI);
RU.cells.setAttribute('clip-path', 'url(#rg-ru)'); IR.cells.setAttribute('clip-path', 'url(#rg-ir)');
const scan = el('line', { y1: GY - 6, y2: GY + RU.H, stroke: 'var(--amber)', 'stroke-width': 2.5, filter: 'url(#kit-glow)', opacity: 0 }, cam);

// selection on the Russia grid: 'special military operation' row, week of 21 Feb 2022
const smo = RU.rowY.smo;
const rowHL = el('rect', { x: GX - 4, y: smo.y - 3, width: GW + 8, height: RH + 4, rx: 3, fill: 'none', stroke: 'var(--amber)', 'stroke-width': 1.3, opacity: 0 }, cam);
const selBox = el('rect', { x: X(SEL_W) - 3, y: smo.y - 5, width: CW + 6, height: RH + 8, rx: 2, fill: 'none', stroke: 'var(--amber)', 'stroke-width': 2.5, filter: 'url(#kit-glow)', opacity: 0 }, cam);
const card = el('g', { opacity: 0 }, cam);
const CX = 660, CY = smo.y + 40;
el('rect', { x: CX, y: CY, width: 780, height: 200, rx: 6, class: 'card' }, card);
el('text', { x: CX + 26, y: CY + 36, class: 'c-e' }, card).textContent = 'Week of 21 Feb 2022 · special military operation';
el('text', { x: CX + 26, y: CY + 86, class: 'c-q' }, card).textContent = '“…I made a decision to carry out';
const q2 = el('text', { x: CX + 26, y: CY + 126, class: 'c-q' }, card);
q2.innerHTML = 'a <tspan style="fill:var(--amber)">special military operation</tspan>.”';
el('text', { x: CX + 26, y: CY + 172, class: 'c-m' }, card).textContent = 'Address by the President · 24 Feb 2022 · en.kremlin.ru';
el('path', { d: `M${CX + 30},${CY} L${X(SEL_W) + CW / 2},${smo.y + RH + 5}`, stroke: 'var(--amber)', 'stroke-dasharray': '4 4', 'stroke-width': 1.3, fill: 'none' }, card);
// Iran highlight: 'Zionist regime'
const zr = IR.rowY.zionist;
const irHL = el('rect', { x: GX - 4, y: zr.y - 3, width: GW + 8, height: RH + 4, rx: 3, fill: 'none', stroke: 'var(--amber)', 'stroke-width': 1.3, opacity: 0 }, cam);

// Cursor.
const cur = el('g', { opacity: 0 }, cam);
const ring = el('circle', { r: 22, fill: 'none', stroke: 'var(--amber)', 'stroke-width': 3, filter: 'url(#kit-glow)' }, cur);
el('path', { d: 'M0 0l0 30l8 -7l6 13l6 -3l-6 -12l11 0z', fill: 'var(--paper)', stroke: '#0b1712', 'stroke-width': 2 }, cur);

// Hook.
const hook = el('g', {}, svg);
const h1 = el('text', { x: 800, y: 440, class: 't-hook', 'text-anchor': 'middle', style: 'font-size:84px' }, hook);
h1.innerHTML = '“<tspan class="hot">special military operation</tspan>”';
const h2 = el('text', { x: 800, y: 530, class: 't-hook', 'text-anchor': 'middle', style: 'font-size:46px;fill:var(--muted)' }, hook);
h2.textContent = 'In Kremlin transcripts since 2021, first used 24 February 2022.';
const h3 = el('text', { x: 800, y: 590, class: 't-hook', 'text-anchor': 'middle', style: 'font-size:46px' }, hook);
h3.textContent = 'Since then, Putin has used it in 377 transcripts.';

// Payoff: two War-framing formulas side by side, as their heatmap rows.
const pay = el('g', { opacity: 0 }, svg);
el('rect', { width: 1600, height: 1000, fill: '#070f0b', opacity: .84 }, pay);
const p1 = el('text', { x: 800, y: 250, class: 't-hook', 'text-anchor': 'middle' }, pay);
p1.innerHTML = 'One formula stuck. One <tspan class="hot">faded</tspan>.';
const PROWS = [['smo', 'special military operation'], ['denazi', 'denazification']].map(([id, n], i) => {
  const r = DATA.ru.rows.find(x => x.id === id), g = el('g', {}, pay), y = 380 + i * 190;
  el('text', { x: 300, y, class: 'p-l' }, g).textContent = `“${n}”`;
  const strip = el('g', {}, g), sw = 1000 / NW;
  for (let w = 0; w < NW; w++) { const ch = r.s[w]; el('rect', { x: 300 + w * sw, y: y + 26, width: sw - .3, height: 40, fill: ch === '.' ? '#0c1712' : ch === '0' ? '#17301f' : heat((14 + (ch.charCodeAt(0) - 97) / 19 * 86) / 100) }, strip); }
  const v = el('text', { x: 1300, y, class: 'p-v', 'text-anchor': 'end', style: `fill:${i ? 'var(--muted)' : 'var(--red)'}` }, g);
  el('text', { x: 1300, y: y + 92, class: 'p-s', 'text-anchor': 'end' }, g).textContent = 'Kremlin transcripts, 2021 – Sep 2026';
  return { g, v, n: r.n };
});

const cap = captions(svg, [
  [0.3, 3.2, 'Putin’s own words, from Kremlin transcripts since 2021'],
  [3.5, 6.8, 'Every row a phrase, every column a week'],
  [6.9, 9.5, 'Click a cell to read the sentence behind it'],
  [9.7, 12.4, 'Switch to Iran: “Zionist regime” in 583 statements'],
  [12.6, 15.0, '“Denazification”: 13 transcripts in all'],
]);
const end = endCard(svg, { kicker: 'Narrative Tracking', title: 'Rhetoric Heatmap: Russia and Beyond', line: 'The phrases the Kremlin and Iran’s Foreign Ministry keep repeating, week by week.' });
{ const tt = [...svg.querySelectorAll('.t-title')].pop(); tt.style.fontSize = '74px'; }

// ---- Timeline -----------------------------------------------------------------------------------
const D = 18, SW = 10.0;     // country switch
function frame(t) {
  // hook
  const a = ease.out(seg(t, 0.2, 0.9)), b = ease.out(seg(t, 1.0, 1.6)), c = ease.out(seg(t, 1.7, 2.3)), hOut = 1 - seg(t, 3.0, 3.5);
  h1.setAttribute('opacity', a * hOut); h1.setAttribute('transform', `translate(800,440) scale(${0.94 + 0.06 * a}) translate(-800,-440)`);
  h2.setAttribute('opacity', b * hOut); h3.setAttribute('opacity', c * hOut);
  h3.setAttribute('transform', `translate(0,${(1 - c) * 14})`);

  // chrome and country
  const ir = t >= SW;
  const ch = ease.out(seg(t, 3.2, 3.9));
  head.setAttribute('opacity', ch);
  title.textContent = ir ? 'Iran · Foreign Ministry · uses per 1,000 words' : 'Russia · Putin’s words · uses per 1,000 words';
  sub.textContent = ir ? 'en.mfa.ir statements, weekly, January 2021 onward' : 'en.kremlin.ru transcripts, weekly, January 2021 onward';
  SEGS.forEach((s, i) => { const on = (i === 1) === ir; s.r.style.fill = on ? 'var(--amber)' : ''; s.r.style.stroke = on ? 'var(--amber)' : ''; s.t.style.fill = on ? '#0b1712' : ''; });

  // Russia sweep in, then Iran wipes over it
  const sw1 = ease.inOut(seg(t, 3.5, 6.4)), sw2 = ease.inOut(seg(t, SW + 0.05, SW + 1.4));
  clipRr.setAttribute('x', GX - 2 + (GW + 4) * sw2); clipRr.setAttribute('width', Math.max(0, (GW + 4) * (sw1 - sw2)));
  clipIr.setAttribute('x', GX - 2); clipIr.setAttribute('width', (GW + 4) * sw2);
  const out = 1 - seg(t, 15.1, 15.5);
  RU.g.setAttribute('opacity', (t < SW ? ch : 1) * (1 - seg(t, SW + 0.1, SW + 0.5) * 0) * out);
  RU.g.querySelectorAll(':scope > g:nth-child(2), :scope > g:nth-child(3), :scope > text').forEach(n => n.setAttribute('opacity', 1 - seg(t, SW, SW + 0.5)));
  IR.g.setAttribute('opacity', out);
  IR.g.querySelectorAll(':scope > g:nth-child(2), :scope > g:nth-child(3), :scope > text').forEach(n => n.setAttribute('opacity', seg(t, SW + 0.4, SW + 1.0)));
  const sx = t < SW ? GX + GW * sw1 : GX + GW * sw2;
  scan.setAttribute('x1', sx); scan.setAttribute('x2', sx);
  scan.setAttribute('opacity', t < SW ? seg(t, 3.5, 3.7) * (1 - seg(t, 6.3, 6.6)) : seg(t, SW, SW + 0.1) * (1 - seg(t, SW + 1.3, SW + 1.5)));

  // select the row and the cell, open the card
  const f = ease.inOut(seg(t, 6.9, 7.4)) * (1 - ease.inOut(seg(t, 9.4, 9.9)));
  RU.cells.querySelectorAll(':scope > g').forEach(g => g.setAttribute('opacity', g === smo.g ? 1 : 1 - 0.6 * f));
  smo.t.style.fill = f > 0.5 ? 'var(--amber)' : '';
  rowHL.setAttribute('opacity', f);
  selBox.setAttribute('opacity', ease.out(seg(t, 7.9, 8.1)) * (1 - seg(t, 9.4, 9.8)));
  const cu = ease.out(seg(t, 8.1, 8.6)) * (1 - seg(t, 9.4, 9.8));
  card.setAttribute('opacity', cu); card.setAttribute('transform', `translate(0,${(1 - cu) * 14})`);
  // Iran: light the 'Zionist regime' row after the wipe
  const fi = ease.inOut(seg(t, SW + 1.4, SW + 1.9)) * (1 - seg(t, 14.9, 15.3));
  IR.cells.querySelectorAll(':scope > g').forEach(g => g.setAttribute('opacity', g === zr.g ? 1 : 1 - 0.55 * fi));
  zr.t.style.fill = fi > 0.5 ? 'var(--amber)' : ''; irHL.setAttribute('opacity', fi);

  // cursor: to the cell, then to the Iran button
  const cell = [X(SEL_W) + CW / 2, smo.y + RH / 2], btn = [SEGS[1].cx, SEGS[1].cy];
  let cx = lerp(1100, cell[0], ease.inOut(seg(t, 6.9, 7.85))), cy = lerp(820, cell[1], ease.inOut(seg(t, 6.9, 7.85)));
  if (t > 9.0) { const u = ease.inOut(seg(t, 9.0, 9.9)); cx = lerp(cell[0], btn[0], u); cy = lerp(cell[1], btn[1], u); }
  if (t > 10.2) { const u = ease.inOut(seg(t, 10.2, 10.9)); cx = btn[0] + 40 * u; cy = btn[1] + 130 * u; }
  cur.setAttribute('opacity', seg(t, 6.8, 7.1) * (1 - seg(t, 10.5, 10.9)));
  cur.setAttribute('transform', `translate(${cx},${cy})`);
  const press = Math.max(seg(t, 7.8, 7.95) * (1 - seg(t, 8.0, 8.3)), seg(t, 9.85, 10.0) * (1 - seg(t, 10.05, 10.35)));
  ring.setAttribute('r', lerp(28, 14, press)); ring.setAttribute('opacity', press);

  // camera
  const push = ease.inOut(seg(t, 3.2, 15)), lean = ease.inOut(seg(t, 6.9, 8.6)) * (1 - ease.inOut(seg(t, 9.4, 10.4)));
  cam.setAttribute('transform', `translate(800,500) scale(${1 + 0.03 * push + 0.04 * lean}) translate(${-800 + 60 * lean},${-500 + 30 * lean})`);

  // payoff
  const po = ease.out(seg(t, 12.5, 13.1)) * (1 - seg(t, 15.1, 15.5));
  pay.setAttribute('opacity', po);
  const bl = Math.max(po, seg(t, 15.1, 15.5));
  blurG.setAttribute('stdDeviation', (bl * 6).toFixed(2));
  cam.setAttribute('filter', bl > 0.01 ? 'url(#rg-blur)' : '');
  PROWS.forEach((p, i) => {
    const q = ease.out(seg(t, 12.8 + i * 0.3, 13.5 + i * 0.3));
    p.g.setAttribute('opacity', q); p.g.setAttribute('transform', `translate(${(1 - q) * 40},0)`);
    p.v.textContent = Math.round(p.n * ease.out(seg(t, 13.0 + i * 0.3, 13.9 + i * 0.3)));
  });

  cap(t); end(t, 15.2, D);
}
run({ duration: D, poster: 8.8, frame });
