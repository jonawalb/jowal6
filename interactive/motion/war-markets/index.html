<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trailer: War Markets</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
  .m-ax { font: 400 14px var(--mono); fill: var(--muted); font-variant-numeric: tabular-nums; }
  .m-case { font: italic 400 34px var(--display); fill: var(--paper); }
  .m-leg { font: 400 14px var(--mono); fill: var(--muted); }
  .m-date { font: 600 40px var(--mono); fill: var(--amber); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .m-ev { font: 400 16px var(--mono); fill: var(--paper); }
  .m-evd { font: 600 13px var(--mono); fill: var(--amber); letter-spacing: .08em; text-transform: uppercase; }
  .m-set { font: 600 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; }
  .m-sub { font: italic 400 30px var(--display); fill: var(--muted); }
  .m-big { font: 600 140px var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.04em; }
  .m-q { font: italic 400 30px var(--display); fill: var(--paper); }
  .m-small { font: 400 16px var(--mono); fill: var(--muted); letter-spacing: .03em; }
  .m-yes { font: 600 22px var(--mono); letter-spacing: .14em; fill: var(--green); }
</style>
</head><body>
<div class="stage"><svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Animated preview of War Markets: daily Polymarket prices for a ladder of contracts on a US or Israeli strike on Iran draw in from January to March 2026; three deadlines pass at No, then on February 28 the strikes come and two contracts settle at Yes. A week before, the February 28 contract priced them at 17 cents."><title>War Markets</title></svg></div>
<script type="module">
import { run, seg, ease, lerp, el, bg, captions, endCard } from '../kit/kit.js';
const svg = document.querySelector('svg');
bg(svg);

// ---- Real data (tools/war-markets/data/markets.js, built 2026-09-29) ------------------------------------------------
// Case 'strike', "US or Israel strikes Iran, early 2026", window 2026-01-08 to 2026-03-10. Daily YES prices in cents
// (Polymarket via the conflict-market-data archive), deadlines, outcomes and the day each outcome was known, as the
// tool stores them. Events: the tool's iran_israel event list, texts shortened. "A week before" is the tool's own
// weekBefore() (js/series.js): the price on the day seven days before the outcome was decided.
const MK = [
  { dl: '01-12', res: 'no', known: '01-12', col: '#5f8298', s: [['01-09', 14], ['01-10', 15.45], ['01-11', 9.13], ['01-12', 4.5], ['01-13', 1]] },
  { dl: '01-31', res: 'no', known: '02-01', col: '#7fb6d9', s: [['01-16', 36.35], ['01-17', 23], ['01-18', 24.25], ['01-19', 29.64], ['01-20', 22], ['01-21', 25], ['01-22', 22], ['01-23', 25], ['01-24', 29], ['01-25', 21], ['01-26', 15], ['01-27', 11], ['01-28', 11], ['01-29', 12.57], ['01-30', 9], ['01-31', 5.61], ['02-01', 0.4]] },
  { dl: '02-15', res: 'no', known: '02-11', col: '#9cc3aa', s: [['01-17', 38.29], ['01-18', 42], ['01-19', 43.81], ['01-20', 35], ['01-21', 35], ['01-22', 38], ['01-23', 46], ['01-24', 47], ['01-25', 42.87], ['01-26', 42.28], ['01-27', 33], ['01-28', 35], ['01-29', 41], ['01-30', 46], ['01-31', 45], ['02-01', 24], ['02-02', 23], ['02-03', 14], ['02-04', 15], ['02-05', 14], ['02-06', 17], ['02-07', 10.97], ['02-08', 11], ['02-09', 11.02], ['02-10', 9.53], ['02-11', 5], ['02-12', 3.5], ['02-13', 3.07], ['02-14', 1.9], ['02-15', 0.53], ['02-16', 0.1]] },
  { dl: '02-28', res: 'yes', known: '02-28', col: '#efe9dc', s: [['02-08', 23], ['02-09', 26.94], ['02-10', 24], ['02-11', 20], ['02-12', 14.04], ['02-13', 12], ['02-14', 14], ['02-15', 13], ['02-16', 17.03], ['02-17', 19], ['02-18', 30.87], ['02-19', 29], ['02-20', 26.52], ['02-21', 17], ['02-22', 19], ['02-23', 19], ['02-24', 16], ['02-25', 11], ['02-26', 11], ['02-27', 19.51], ['02-28', 99]] },
  { dl: '03-31', res: 'yes', known: '02-28', col: '#b69ad8', s: [['01-20', 35], ['01-21', 41], ['01-22', 76], ['01-23', 65], ['01-24', 60.41], ['01-25', 63.24], ['01-26', 62.47], ['01-27', 57], ['01-28', 57], ['01-29', 61], ['01-30', 64], ['01-31', 62], ['02-01', 55], ['02-02', 41], ['02-03', 38.89], ['02-04', 39], ['02-05', 39], ['02-06', 41.95], ['02-07', 40], ['02-08', 39], ['02-09', 42.14], ['02-10', 42], ['02-11', 41], ['02-12', 36.97], ['02-13', 35], ['02-14', 35], ['02-15', 36], ['02-16', 38], ['02-17', 41], ['02-18', 56], ['02-19', 60.2], ['02-20', 62], ['02-21', 61], ['02-22', 57], ['02-23', 60], ['02-24', 61], ['02-25', 55.09], ['02-26', 57.04], ['02-27', 66], ['02-28', 99.73]] },
];
const LABELS = ['Jan. 12', 'Jan. 31', 'Feb. 15', 'Feb. 28', 'Mar. 31'];
const EVENTS = [
  ['01-23', 'Trump announces a US “armada” heading toward Iran'],
  ['02-19', 'Trump appears to set a 10–15 day deadline'],
  ['02-28', 'US and Israel launch war on Iran'],
];
// Day number from Jan. 1 (2026 is not a leap year).
const MD = [0, 31, 59];
const dn = s => MD[+s.slice(0, 2) - 1] + +s.slice(3) - 1;
const MON = ['Jan.', 'Feb.', 'Mar.'];
const lab = d => { const m = d >= 59 ? 2 : d >= 31 ? 1 : 0; return `${MON[m]} ${d - MD[m] + 1}, 2026`; };
const D0 = dn('01-08'), D1 = dn('03-10');

// ---- Helpers --------------------------------------------------------------------------------------------------------
const T = (p, x, y, cls, s, a = {}) => { const n = el('text', { x, y, class: cls, ...a }, p); if (s != null) n.textContent = s; return n; };
const op = (n, v) => n.setAttribute('opacity', Math.max(0, Math.min(1, v)).toFixed(3));
const cam = el('g', {}, svg);
const scene = el('g', {}, cam);

// ---- Chart ---------------------------------------------------------------------------------------------------------------
const PL = 270, PR = 1330, PT = 330, PB = 740;
const X = d => PL + (d + .5 - D0) / (D1 - D0 + 1) * (PR - PL), Y = p => PB - p / 100 * (PB - PT);
const head = el('g', {}, scene);
T(head, PL, 170, 't-label', 'Price of a $1 “Yes” share, daily');
T(head, PL, 214, 'm-case', 'US or Israel strikes Iran, early 2026');
const legG = el('g', {}, head);
T(legG, PL, 262, 'm-leg', 'Strike by');
MK.forEach((m, i) => { const x = PL + 100 + i * 130; el('line', { x1: x, x2: x + 24, y1: 257, y2: 257, stroke: m.col, 'stroke-width': 3 }, legG); T(legG, x + 32, 262, 'm-leg', LABELS[i]); });
const dateT = T(head, PR, 214, 'm-date', '', { 'text-anchor': 'end' });

const axes = el('g', {}, scene);
[0, 25, 50, 75, 100].forEach(v => {
  el('line', { x1: PL, x2: PR, y1: Y(v), y2: Y(v), stroke: v ? '#23402f' : 'var(--muted)', 'stroke-dasharray': v ? '2 6' : '', 'stroke-width': v ? 1 : 1.5 }, axes);
  T(axes, PL - 14, Y(v) + 5, 'm-ax', v + '¢', { 'text-anchor': 'end' });
});
[['01-08', 'Jan. 8'], ['01-22', 'Jan. 22'], ['02-05', 'Feb. 5'], ['02-19', 'Feb. 19'], ['03-05', 'Mar. 5']].forEach(([d, s]) => T(axes, X(dn(d)), PB + 30, 'm-ax', s, { 'text-anchor': 'middle' }));

// Deadlines (dashed, contract colour), price lines revealed by a clip that follows the date cursor, settle dots.
const clip = el('clipPath', { id: 'm-clip' }, svg);
const clipR = el('rect', { x: PL - 10, y: 0, width: 0, height: 1000 }, clip);
const lines = el('g', { 'clip-path': 'url(#m-clip)' }, scene);
MK.forEach(m => {
  const d = dn(m.dl);
  if (d <= D1) el('line', { x1: X(d), x2: X(d), y1: PT, y2: PB, stroke: m.col, 'stroke-width': 1.5, 'stroke-dasharray': '5 6', opacity: .55 }, lines);
  let p = '', prev = null;
  m.s.forEach(([iso, v]) => { const n = dn(iso); p += `${prev != null && n - prev <= 3 ? 'L' : 'M'}${X(n).toFixed(1)} ${Y(v).toFixed(1)}`; prev = n; });
  m.path = el('path', { d: p, fill: 'none', stroke: m.col, 'stroke-width': m.res === 'yes' ? 3.5 : 2.5, 'stroke-linejoin': 'round' }, lines);
});
const dots = MK.map(m => {
  const g = el('g', {}, scene), x = X(dn(m.known)), y = Y(m.res === 'yes' ? 100 : 0);
  el('circle', { cx: x, cy: y, r: 7, fill: m.col, stroke: 'var(--ink)', 'stroke-width': 2 }, g);
  const ring = el('circle', { cx: x, cy: y, r: 7, fill: 'none', stroke: m.res === 'yes' ? 'var(--green)' : m.col, 'stroke-width': 2 }, g);
  return { g, ring, d: dn(m.known), m };
});
const yesT = T(scene, X(dn('02-28')) - 16, Y(100) - 16, 'm-set', 'Settled Yes', { 'text-anchor': 'end', style: 'fill:var(--green)' });

// Date cursor.
const cur = el('g', {}, scene);
el('line', { x1: 0, x2: 0, y1: PT - 20, y2: PB, stroke: 'var(--amber)', 'stroke-width': 10, opacity: .18 }, cur);
el('line', { x1: 0, x2: 0, y1: PT - 20, y2: PB, stroke: 'var(--amber)', 'stroke-width': 2.5 }, cur);
el('circle', { cx: 0, cy: PT - 20, r: 6, fill: 'var(--amber)' }, cur);
// Events along the top.
const evs = EVENTS.map(([d, s]) => {
  const x = X(dn(d)), g = el('g', {}, scene);
  el('path', { d: `M${x} ${PT - 8} l7 -8 l-7 -8 l-7 8 z`, fill: 'var(--paper)' }, g);
  const card = el('g', {}, g);
  const anchorEnd = x > 1000;
  T(card, x + (anchorEnd ? -16 : 16), PT + 34, 'm-evd', lab(dn(d)).replace(', 2026', ''), { 'text-anchor': anchorEnd ? 'end' : 'start' });
  T(card, x + (anchorEnd ? -16 : 16), PT + 58, 'm-ev', s, { 'text-anchor': anchorEnd ? 'end' : 'start' });
  const back = el('rect', { fill: 'rgba(11,23,18,.8)' }, card); card.insertBefore(back, card.firstChild);
  return { g, card, back, d: dn(d), anchorEnd, x };
});

// ---- Hook ------------------------------------------------------------------------------------------------------------------
const hook = el('g', {}, svg);
const h1 = T(hook, 800, 470, 't-hook', null, { 'text-anchor': 'middle', style: 'font-size:74px' });
el('tspan', {}, h1).textContent = 'Traders put real money on ';
const hot = el('tspan', { class: 'hot' }, h1); hot.textContent = 'war';
el('tspan', {}, h1).textContent = '.';
const h2 = T(hook, 800, 548, 'm-sub', 'What did they price before the strikes on Iran?', { 'text-anchor': 'middle' });

// ---- Payoff ------------------------------------------------------------------------------------------------------------------
const pay = el('g', {}, svg);
el('rect', { width: 1600, height: 1000, fill: '#0b1712', opacity: .65 }, pay);
T(pay, 800, 300, 't-label', 'Feb. 21, one week before', { 'text-anchor': 'middle' });
const pQ = T(pay, 800, 360, 'm-q', '“Will US or Israel strike Iran by February 28?”', { 'text-anchor': 'middle' });
const pBig = T(pay, 800, 520, 'm-big', '17¢', { 'text-anchor': 'middle', style: 'fill:var(--paper)' });
const pYes = el('g', {}, pay);
el('rect', { x: 800 - 118, y: 556, width: 236, height: 44, rx: 22, fill: 'none', stroke: 'var(--green)', 'stroke-width': 2 }, pYes);
T(pYes, 800, 585, 'm-yes', 'RESOLVED YES', { 'text-anchor': 'middle' });
const pS = T(pay, 800, 660, 'm-small', 'The March 31 contract: 61¢. Same strikes, later deadline.', { 'text-anchor': 'middle' });

const cap = captions(svg, [
  [3.4, 6.4, 'Each line is one contract: strike by a given date'],
  [6.5, 9.9, 'Deadlines pass at No. Then the strikes come.'],
  [10.2, 13.5, 'Priced vs happened, contract by contract'],
]);
const end = endCard(svg, { kicker: 'Interactive Deterrence', title: 'War Markets', line: 'See what prediction markets priced, and how each bet turned out.' });

// ---- Frame ------------------------------------------------------------------------------------------------------------------------
const C0 = 3.6, C1 = 9.3;              // date cursor runs Jan. 8 to Mar. 3
function frame(t) {
  op(h1, ease.out(seg(t, .2, .8)) * (1 - seg(t, 2.6, 3.1)));
  h1.setAttribute('transform', `translate(800,450) scale(${lerp(.93, 1, ease.back(seg(t, .2, 1))).toFixed(3)}) translate(-800,-450)`);
  op(h2, ease.out(seg(t, .9, 1.5)) * (1 - seg(t, 2.6, 3.1)));
  h2.setAttribute('transform', `translate(0,${((1 - ease.out(seg(t, .9, 1.6))) * 16).toFixed(1)})`);
  hot.setAttribute('filter', t > .9 && t < 2.7 ? 'url(#kit-glow)' : '');
  const dim = lerp(1, .04, ease.inOut(seg(t, 10.0, 10.7)));
  op(scene, lerp(.1 * seg(t, 0, 1), 1, ease.inOut(seg(t, 2.7, 3.5))) * dim * (1 - seg(t, 13.4, 13.9)));
  cam.setAttribute('transform', `translate(800,500) scale(${lerp(1, 1.05, ease.inOut(seg(t, 2.8, 10.4))).toFixed(4)}) translate(-800,-500)`);

  // The cursor slows into Feb. 28.
  const u = seg(t, C0, C1), day = D0 + (dn('03-03') - D0) * (u < .85 ? ease.inOut(u / .85) * .93 : .93 + .07 * ease.out((u - .85) / .15));
  const cx = X(Math.floor(day)) + (X(1) - X(0)) * (day % 1 - .5);
  cur.setAttribute('transform', `translate(${cx.toFixed(1)},0)`);
  op(cur, seg(t, C0 - .3, C0) * (1 - seg(t, 9.8, 10.2)));
  clipR.setAttribute('width', Math.max(0, cx - PL + 10).toFixed(1));
  dateT.textContent = lab(Math.min(Math.floor(day), dn('03-03')));
  op(dateT, seg(t, C0 - .3, C0));

  dots.forEach(D => {
    const on = day >= D.d + .5;
    op(D.g, on ? 1 : 0);
    const since = on ? (day - D.d - .5) : 0;
    const k = Math.min(1, since / 3);
    D.ring.setAttribute('r', (7 + ease.out(k) * 26).toFixed(1)); op(D.ring, on && k < 1 ? 1 - k : 0);
    D.g.setAttribute('filter', D.m.res === 'yes' && on && t < 10 ? 'url(#kit-glow)' : '');
  });
  op(yesT, day >= dn('02-28') + .6 ? ease.out(Math.min(1, (day - dn('02-28') - .6) / 1.5)) : 0);

  // Event cards: show while the cursor is near.
  evs.forEach(E => {
    const on = day >= E.d + .3;
    op(E.g, on ? 1 : 0);
    const near = on ? (E.d === dn('02-28') ? 1 : Math.max(0, 1 - Math.max(0, day - E.d - 5) / 2)) : 0;
    op(E.card, near);
    E.back.setAttribute('x', E.anchorEnd ? E.x - 16 - 470 : E.x + 8); E.back.setAttribute('y', PT + 12); E.back.setAttribute('width', 480); E.back.setAttribute('height', 58);
  });

  // Payoff.
  op(pay, ease.out(seg(t, 10.3, 10.9)) * (1 - seg(t, 13.3, 13.8)));
  op(pQ, ease.out(seg(t, 10.4, 10.9)));
  const pb = ease.back(seg(t, 10.6, 11.3));
  pBig.setAttribute('transform', `translate(800,480) scale(${lerp(.75, 1, pb).toFixed(3)}) translate(-800,-480)`);
  const st = ease.back(seg(t, 11.4, 11.9));
  op(pYes, seg(t, 11.4, 11.6));
  pYes.setAttribute('transform', `translate(800,578) scale(${lerp(1.4, 1, st).toFixed(3)}) translate(-800,-578)`);
  pYes.setAttribute('filter', t > 11.4 && t < 12.4 ? 'url(#kit-glow)' : '');
  op(pS, ease.out(seg(t, 12.0, 12.5)));

  cap(t); end(t, 13.6, 17);
}
run({ duration: 17, poster: 9.2, frame });
</script>
</body></html>
