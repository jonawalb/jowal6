476,15,0,0,0,0],[1080,577,69,2,0,0,0],[1712,292,12,4,0,0,0],[1142,316,4,2,0,0,0],[2095,404,46,4,0,0,0],[1014,381,2,1,0,0,0],[1285,243,12,0,0,0,0]];
const GROUPS = ['shahed', 'drone', 'cruise', 'ballistic', 'sam', 'mixed', 'other'];
// Chip names from data/groups.js (GROUP_INFO[g].n). Colours are the trailer's: red family = drones.
const NAME = ['Shahed-type drones', 'Other drones', 'Cruise missiles', 'Ballistic missiles', 'S-300/S-400 at ground targets', 'Mixed missile reports', 'Guided bombs'];
const COL = ['#e0533d', '#9c4a3d', '#e3dccb', '#b9a47c', '#8fa89a', '#6f8a7c', '#5d7367'];
const TOTAL = 145503;                 // totals(): whole war, all groups, launched
const YEAR_IDX = [[14, '2023'], [66, '2024'], [119, '2025'], [171, '2026']];   // first week of each year
const HIDE_IDX = 202;                 // week of 10 Aug 2026: Air Force stopped publishing some missile counts
const SEL = 189;                      // week of 11 May 2026, the tallest bar
// Detail panel for that week, as renderDetail() prints it: launched 3,606, reported stopped 3,384 (94%).
const SEL_L = 3606, SEL_X = 3384;
// Payoff: yearly Shahed-type launches from totals() per calendar year (2023: 3,123; 2025: 54,796).
const fmt = v => Math.round(v).toLocaleString('en-US');
const niceMax = v => { if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; };   // charts.js

// ---- Geometry ------------------------------------------------------------------------------------
const PL = 200, PR = 1420, PT = 300, PB = 770, N = W.length, BW = (PR - PL) / N;
const X = i => PL + i * BW;
const MAX_ALL = niceMax(Math.max(...W.map(r => r.reduce((a, b) => a + b, 0))));   // 5,000
const MAX_MIS = niceMax(Math.max(...W.map(r => r.slice(2).reduce((a, b) => a + b, 0))));  // 200
const blurF = el('filter', { id: 'uaw-blur', x: '-5%', y: '-5%', width: '110%', height: '110%' }, svg);
const blurG = el('feGaussianBlur', { stdDeviation: 0 }, blurF);
const cam = el('g', {}, svg);

const head = el('g', {}, cam);
el('text', { x: PL, y: 150, class: 't-label' }, head).textContent = 'Launched per week · whole war';
el('text', { x: PR, y: 150, class: 'src', 'text-anchor': 'end' }, head).textContent = 'Ukrainian Air Force reports, via Kaggle v212';

// Chips (weapon groups), laid out as one row.
const chips = [];
{
  let x = PL, y = 172;
  NAME.forEach((n, i) => {
    if (i === 4) { x = PL; y += 44; }
    const w = n.length * 9.9 + 40, g = el('g', {}, head);
    const r = el('rect', { x, y, width: w, height: 34, rx: 17, class: 'chip' }, g);
    const sw = el('rect', { x: x + 13, y: y + 11.5, width: 11, height: 11, rx: 2, fill: COL[i] }, g);
    const tx = el('text', { x: x + 31, y: y + 22, class: 'chip-t' }, g); tx.textContent = n;
    chips.push({ g, r, sw, tx, cx: x + w / 2, cy: y + 17 });
    x += w + 10;
  });
}

// Axes and gridlines (two label sets so the rescale can crossfade).
const axes = el('g', {}, cam);
const grid = [0, 1, 2, 3, 4].map(k => {
  const y = PB - (PB - PT) * k / 4;
  el('line', { x1: PL, x2: PR, y1: y, y2: y, stroke: '#27493a', 'stroke-dasharray': '2 6' }, axes);
  const a = el('text', { x: PL - 12, y: y + 5, class: 'ax', 'text-anchor': 'end' }, axes);
  const b = el('text', { x: PL - 12, y: y + 5, class: 'ax', 'text-anchor': 'end', opacity: 0 }, axes);
  const lab = v => v >= 1000 ? (v / 1000) + 'k' : fmt(v);
  a.textContent = lab(MAX_ALL * k / 4); b.textContent = lab(MAX_MIS * k / 4);
  return { a, b };
});
el('rect', { x: X(HIDE_IDX), y: PT, width: PR - X(HIDE_IDX), height: PB - PT, fill: '#e3dccb', opacity: .05 }, axes);
el('text', { x: PR - 6, y: PT + 18, class: 'band-t', 'text-anchor': 'end' }, axes).textContent = 'Some counts withheld';
el('line', { x1: PL, x2: PR, y1: PB, y2: PB, stroke: 'var(--muted)', 'stroke-width': 1.5 }, axes);
el('text', { x: PL + 3, y: PB + 26, class: 'yr' }, axes).textContent = '2022';
YEAR_IDX.forEach(([i, y]) => {
  el('line', { x1: X(i), x2: X(i), y1: PT, y2: PB + 6, stroke: '#2b4a3b' }, axes);

const cols = W.map((r, i) => GROUPS.map((_, k) => el('rect', { x: (X(i) + .5).toFixed(1), width: (BW - 1).toFixed(2), fill: COL[k], y: PB, height: 0 }, bars)));

// Year annotations shown while drones are off (tour step 2: about 1,400 / 2,200 / 2,000 a year).

[[14, 66, 'about 1,400'], [66, 119, 'about 2,200'], [119, 171, 'about 2,000']].forEach(([a, b, s]) => {
  const cx = (X(a) + X(b)) / 2;
  el('text', { x: cx, y: PT + 44, class: 'ann', 'text-anchor': 'middle' }, ann).textContent = s;

const panel = el('g', { opacity: 0 }, cam);

el('path', { d: `M${PX + PW},${PY + 60} L${X(SEL) - 8},${PY + 60}`, stroke: 'var(--amber)', 'stroke-width': 1.3, 'stroke-dasharray': '4 4' }, panel);

const offAt = [7.0, 7.6], onAt = 9.9;
function frame(t) {

  hook.setAttribute('transform', `translate(800,480) scale(${hs}) translate(-800,-480)`);
  h2.setAttribute('opacity', ease.out(seg(t, 0.9, 1.5)) * hOut);

  // chart chrome
  const out = 1 - seg(t, 15.0, 15.5);
  const chrome = ease.out(seg(t, 3.0, 3.8));
  axes.setAttribute('opacity', chrome * out); head.setAttribute('opacity', chrome * out);
  head.setAttribute('transform', `translate(0,${(1 - chrome) * -12})`);

  // chip states
  const on = [1, 1, 1, 1, 1, 1, 1];
  offAt.forEach((a, k) => { on[k] = 1 - ease.inOut(seg(t, a, a + 0.5)) + ease.inOut(seg(t, onAt + k * 0.25, onAt + k * 0.25 + 0.6)); });
  chips.forEach((c, k) => {
    const lit = on[k] > 0.5;
    c.sw.setAttribute('opacity', 0.35 + 0.65 * on[k]);
    c.tx.style.fill = lit ? 'var(--paper)' : 'var(--muted)';
    c.r.style.stroke = lit ? '#5b7d6c' : '#2b4a3b';
    const pulse = offAt.map(a => seg(t, a - 0.1, a) * (1 - seg(t, a + 0.1, a + 0.5)))[k] || 0;
    c.r.style.stroke = pulse > 0.2 ? 'var(--amber)' : c.r.style.stroke;
    c.g.setAttribute('opacity', ease.out(seg(t, 3.3 + k * 0.08, 3.8 + k * 0.08)));
  });
  // scale: 5k while drones show, 200 while they are off
  const zoom = ease.inOut(seg(t, 8.1, 8.9)) * (1 - ease.inOut(seg(t, 9.9, 10.6)));
  const M = MAX_ALL * Math.pow(MAX_MIS / MAX_ALL, zoom);     // log-space tween keeps the motion smooth
  grid.forEach(g => { g.a.setAttribute('opacity', 1 - zoom); g.b.setAttribute('opacity', zoom); });
  ann.setAttribute('opacity', seg(t, 8.8, 9.2) * (1 - seg(t, 9.8, 10.1)) * out);
  ann.setAttribute('transform', `translate(0,${(1 - ease.out(seg(t, 8.8, 9.3))) * 10})`);

  // bars: sweep in left to right, then react to chips and scale
  const sweep = ease.inOut(seg(t, 3.3, 6.4)) * (N + 12);
  const H = PB - PT;
  W.forEach((r, i) => {
    const grow = ease.out(seg(sweep - i, 0, 12));
    let acc = 0;
    r.forEach((v, k) => {
      const h = Math.min(H * 1.02, v * on[k] * grow / M * H);
      const rc = cols[i][k];
      rc.setAttribute('y', (PB - acc - h).toFixed(1)); rc.setAttribute('height', Math.max(0, h).toFixed(1));
      acc += h;
    });
  });
  bars.setAttribute('opacity', out);
  const dim = seg(t, 11.0, 11.4) * (1 - seg(t, 14.8, 15.2));
  cols.forEach((c, i) => { const o = i === SEL ? 1 : 1 - 0.45 * dim; if (c._o !== o) { c.forEach(r => r.setAttribute('opacity', o)); c._o = o; } });

  // selection + panel
  selG.setAttribute('opacity', ease.out(seg(t, 11.0, 11.3)) * out);
  const pu = ease.out(seg(t, 11.3, 11.9));
  panel.setAttribute('opacity', pu * out);
  panel.setAttribute('transform', `translate(${(1 - pu) * 30},0)`);
  pL.textContent = fmt(SEL_L * ease.out(seg(t, 11.4, 12.3)));
  const xs = SEL_X * ease.out(seg(t, 11.6, 12.5));
  pX.textContent = `${fmt(xs)} (${Math.round(SEL_X / SEL_L * 100)}%)`;

  // cursor: to Shahed chip, to Other drones chip, back on, then down to the tallest bar
  const P = [[1000, 560], [chips[0].cx, chips[0].cy], [chips[1].cx, chips[1].cy], [chips[1].cx + 40, chips[1].cy + 60], [X(SEL) + BW / 2, PT + 160], [X(SEL) + 60, PT + 330]];
  const K = [[6.3, 6.95], [7.25, 7.55], [8.0, 8.6], [10.3, 10.95], [11.6, 12.3]];
  let cx = P[0][0], cy = P[0][1];
  K.forEach(([a, b], k) => { const u = ease.inOut(seg(t, a, b)); if (t >= a) { cx = lerp(P[k][0], P[k + 1][0], u); cy = lerp(P[k][1], P[k + 1][1], u); } });
  cur.setAttribute('opacity', seg(t, 6.2, 6.5) * (1 - seg(t, 12.0, 12.4)));
  cur.setAttribute('transform', `translate(${cx.toFixed(1)},${cy.toFixed(1)})`);
  const press = Math.max(...[7.0, 7.6, 9.9, 11.0].map(a => seg(t, a - 0.12, a) * (1 - seg(t, a + 0.05, a + 0.35))));
  ring.setAttribute('r', lerp(28, 14, press)); ring.setAttribute('opacity', press);

  // camera: slow push, then lean toward the selected week
  const push = ease.inOut(seg(t, 3.0, 11.0)), lean = ease.inOut(seg(t, 10.6, 12.6)) * (1 - ease.inOut(seg(t, 14.6, 15.4)));
  cam.setAttribute('transform', `translate(800,500) scale(${1 + 0.025 * push + 0.05 * lean}) translate(${-800 - 70 * lean},${-500 + 10 * lean})`);

  // payoff
  const po = ease.out(seg(t, 12.9, 13.5)) * (1 - seg(t, 15.2, 15.6));
  pay.setAttribute('opacity', po);
  const bl = Math.max(po, seg(t, 15.2, 15.6));
  blurG.setAttribute('stdDeviation', (bl * 6).toFixed(2));
  cam.setAttribute('filter', bl > 0.01 ? 'url(#uaw-blur)' : '');
  ROWS.forEach((r, i) => {
    const u = ease.out(seg(t, 13.2 + i * 0.22, 13.9 + i * 0.22));
    r.g.setAttribute('opacity', u); r.g.setAttribute('transform', `translate(${(1 - u) * 40},0)`);
    r.bv.textContent = fmt(lerp(r.a, r.b, ease.out(seg(t, 13.4 + i * 0.2, 14.3 + i * 0.2))));
    r.bv.setAttribute('filter', i === 0 && t > 14.3 && t < 15.2 ? 'url(#kit-glow)' : '');
  });

  cap(t); end(t, 15.3, D);
}
run({ duration: D, poster: 12.5, frame });
</script>
