const colBand = el('rect', { x: CX, y: CY - 4, width: CW, height: 26 + 6 * CHh + 10, rx: 4, fill: 'var(--amber)', 'fill-opacity': .08, stroke: 'var(--amber)', 'stroke-opacity': .5 }, side);
const cells = CRT.map((row, r) => row.map((code, c) => {
  T(CX - 22, CY + 30 + r * CHh + 26, 'pg-crth', r + 1, {}, side);
  return T(CX + c * CW + CW / 2, CY + 30 + r * CHh + 26, 'pg-crt', code, {}, side);
}));
const hitCell = el('rect', { width: CW - 8, height: CHh - 6, rx: 5, fill: 'var(--amber)', filter: 'url(#kit-glow)' }, side);
side.insertBefore(hitCell, cells[0][0]);
const resT = T(984, 882, 'pg-res', '', { style: 'font-size:17px' }, side);
// The die.
const die = el('g', {}, svg);
el('rect', { x: -34, y: -34, width: 68, height: 68, rx: 12, fill: 'var(--paper)' }, die);
const PIPS = { 1: [[0, 0]], 2: [[-14, -14], [14, 14]], 3: [[-15, -15], [0, 0], [15, 15]], 4: [[-14, -14], [14, -14], [-14, 14], [14, 14]], 5: [[-15, -15], [15, -15], [0, 0], [-15, 15], [15, 15]], 6: [[-14, -16], [14, -16], [-14, 0], [14, 0], [-14, 16], [14, 16]] };
const pips = Array.from({ length: 6 }, () => el('circle', { r: 6, fill: 'var(--ink)' }, die));
const face = n => pips.forEach((p, i) => { const q = PIPS[n][i]; p.setAttribute('opacity', q ? 1 : 0); if (q) { p.setAttribute('cx', q[0]); p.setAttribute('cy', q[1]); } });
// Ledger of the fight ashore, one line per turn (turns 2-8), and the end of the game.
const ledger = el('g', {}, side);
const LED = FIGHT.map((f, i) => {
  const g = el('g', { transform: `translate(984,${226 + i * 30})` }, ledger);
  T(0, 0, 'pg-ph', `Turn ${i + 2}`, { style: 'font-size:13px' }, g);
  T(84, 0, 'pg-ev', `die ${f.die} · ${CRT_COLS[f.col]} · ${RES[CRT[f.die - 1][f.col]]}`, {}, g);
  T(532, 0, 'pg-pc', `PLA ${f.ashore.toFixed(2)}`, { 'text-anchor': 'end' }, g);
  return g;
});
const outG = el('g', {}, side);
T(984, 470, 'pg-out', 'Stalemate after 8 turns', { style: 'font-size:40px' }, outG);
T(986, 500, 'pg-note', 'The PLA holds a lodgment but not Magong', {}, outG);

// ---- HUD: the setup chips ------------------------------------------------------------------------------------
const hud = el('g', {}, svg);
T(72, 78, 't-kicker', 'PLA plan', {}, hud);
const chips = PLAN.map(s => { const g = el('g', {}, hud), w = s.length * 11.2 + 34; el('rect', { width: w, height: 38, rx: 19, fill: 'none', stroke: 'var(--amber)', 'stroke-width': 1.6 }, g); T(w / 2, 25, 'pg-chip', s, { 'text-anchor': 'middle' }, g); return { g, w }; });
{ let x = 72; for (const c of chips) { c.x = x; x += c.w + 10; } }

// ---- Hook and payoff ------------------------------------------------------------------------------------------
const hook = el('g', {}, svg);
const H1 = T(800, 440, 't-hook', 'Penghu sits in the middle of the Strait.', { 'text-anchor': 'middle' }, hook);
const H2 = el('text', { x: 800, y: 540, 'text-anchor': 'middle', class: 't-hook', style: 'font-size:74px' }, hook);
const hot = el('tspan', { class: 'hot' }, H2); hot.textContent = 'What would it take to seize it?';
const pay = el('g', {}, svg);
T(800, 250, 't-kicker', '1,000 games per setup', { 'text-anchor': 'middle' }, pay);
T(800, 300, 'pg-rowt', 'How often the PLA holds Magong', { 'text-anchor': 'middle', style: 'font-size:32px' }, pay);
const BX0 = 470, BW = 760;
const MB = MC.map(([lab, pla, st, roc], i) => {
  const g = el('g', { transform: `translate(0,${400 + i * 130})` }, pay);
  T(BX0, -20, 'pg-rowt', lab, {}, g);
  const segs = [['var(--red)', pla], ['var(--muted)', st], ['var(--teal)', roc]].map(([c, v]) => el('rect', { y: 0, height: 36, fill: c, opacity: c === 'var(--muted)' ? .35 : 1 }, g));
  const num = T(BX0 - 26, 34, 'pg-pct', `${pla}%`, { 'text-anchor': 'end' }, g);
  return { g, segs, vals: [pla, st, roc], num };
});
const legend = el('g', { transform: 'translate(0,790)' }, pay);
[['PLA holds Magong', 'var(--red)'], ['Stalemate', 'var(--muted)'], ['Defense holds', 'var(--teal)']].forEach(([s, c], i) => {
  el('rect', { x: BX0 + i * 260, y: -12, width: 14, height: 14, fill: c }, legend);
  T(BX0 + 24 + i * 260, 0, 'pg-note', s, {}, legend);
});
T(800, 830, 'pg-note', 'Notional model · every probability can be changed', { 'text-anchor': 'middle' }, pay);

const cap = captions(svg, [
  [3.3, 5.5, 'Set Taiwan’s defenses, then plan the PLA’s assault'],
  [5.6, 8.9, 'Every chance and every die roll is on the table'],
  [9.0, 11.8, 'Twelve-hour turns until Magong falls or time runs out'],
  [12.0, 14.5, 'Replay it 1,000 times: move the beach, the odds jump'],
]);
const end = endCard(svg, { kicker: 'Interactive Deterrence', title: 'Penghu Gambit', line: 'Set Taiwan’s defenses, roll every die, then run 1,000 games.' });

// ---- Timeline ---------------------------------------------------------------------------------------------------
// Turn k (1..8) starts at TK[k-1]; turn 2 (the landing) gets the most time.
const TK = [4.9, 5.7, 9.05, 9.37, 9.69, 10.01, 10.33, 10.65, 10.97];
const turnAt = t => { let k = 0; for (let i = 0; i < 8; i++) if (t >= TK[i]) k = i + 1; return k; };
const DIE2 = 8.05; // the landing turn's die settles here
const along = (path, u) => { // point along a polyline at fraction u
  const L = []; let tot = 0; for (let i = 1; i < path.length; i++) { const d = Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]); L.push(d); tot += d; }
  let s = u * tot; for (let i = 1; i < path.length; i++) { if (s <= L[i - 1]) { const v = s / L[i - 1]; return [lerp(path[i - 1][0], path[i][0], v), lerp(path[i - 1][1], path[i][1], v)]; } s -= L[i - 1]; }
  return path[path.length - 1];
};
function setRow(R, row, t0, t) {
  if (!row) { op(R.g, 0); return; }
  const [ph, ev, pc, rolls, res, p] = row;
  op(R.g, ease.out(seg(t, t0, t0 + .3)));
  R.g.setAttribute('transform', `translate(${(984 + (1 - ease.out(seg(t, t0, t0 + .4))) * 16).toFixed(1)},${R.y})`);
  R.ph.textContent = ph; R.ev.textContent = ev; R.pc.textContent = pc ? `chance ${pc}` : '';
  const x0 = pc ? 150 : 0;
  R.rolls.forEach((q, j) => {
    const v = rolls[j];
    if (v == null) { op(q.r, 0); return; }
    const shown = seg(t, t0 + .15 + j * .12, t0 + .3 + j * .12), hit = v < p;
    q.r.setAttribute('transform', `translate(${x0 + j * 58},0)`);
    q.t.textContent = shown < 1 ? (Math.abs(Math.sin((t + j) * 37)) * .99).toFixed(2) : v.toFixed(2);
    q.b.setAttribute('stroke', hit ? 'var(--amber)' : 'var(--line)');
    q.b.setAttribute('fill', hit && shown >= 1 ? 'var(--amber)' : 'none');
    q.t.style.fill = hit && shown >= 1 ? 'var(--ink)' : '';
    op(q.r, seg(t, t0 + .1 + j * .12, t0 + .2 + j * .12));
  });
  R.res.textContent = res;
  op(R.res, ease.out(seg(t, t0 + .35 + rolls.length * .12, t0 + .6 + rolls.length * .12)));
}


function frame(t) {
  const z = lerp(1, 1.06, ease.inOut(seg(t, 3, 11)));
  cam.setAttribute('transform', `translate(540,470) scale(${z.toFixed(4)}) translate(-540,-470)`);
  const vis = lerp(.25 * ease.out(seg(t, 0, 1)), 1, ease.inOut(seg(t, 2.8, 3.6)));
  op(scene, vis * lerp(1, .07, ease.inOut(seg(t, 11.6, 12.1))) * (1 - seg(t, 14.5, 15.2)));
  const panelV = ease.out(seg(t, 4.6, 5.1)) * (1 - ease.inOut(seg(t, 11.6, 12.0)));
  op(side, panelV);
  side.setAttribute('transform', `translate(${((1 - ease.out(seg(t, 4.6, 5.2))) * 40).toFixed(1)},0)`);
  op(hud, ease.out(seg(t, 3.9, 4.3)) * (1 - ease.inOut(seg(t, 11.6, 12.0))));

  // Hook.
  const h1 = ease.out(seg(t, .25, .95));
  op(H1, h1 * (1 - seg(t, 2.6, 3.1)));
  H1.setAttribute('transform', `translate(0,${((1 - h1) * 22 - seg(t, 2.6, 3.2) * 18).toFixed(1)})`);
  op(H2, ease.out(seg(t, .9, 1.6)) * (1 - seg(t, 2.7, 3.2)));
  H2.setAttribute('transform', `translate(800,520) scale(${lerp(.93, 1, ease.back(seg(t, .9, 1.7))).toFixed(3)}) translate(-800,-520) translate(0,${(-seg(t, 2.7, 3.3) * 18).toFixed(1)})`);
  hot.setAttribute('filter', t > 1.5 && t < 3 ? 'url(#kit-glow)' : '');

  // Setup: Taiwan's assets appear in the notional zone, mines go down on the east coast, then the PLA plan.
  op(zone, ease.out(seg(t, 3.2, 3.6)));
  toks.forEach((k, j) => { const u = ease.back(seg(t, 3.35 + j * .09, 3.7 + j * .09)); k.g.setAttribute('transform', `translate(${k.x},${k.y}) scale(${Math.max(0, u).toFixed(3)})`); });
  const mineEff = t < TK[0] + .5 ? 1 : lerp(1, .7, ease.inOut(seg(t, TK[0] + .5, TK[0] + .8)));
  op(mines, ease.out(seg(t, 3.7, 4.1)) * (.25 + .75 * mineEff));
  mines.setAttribute('filter', t > 3.7 && t < 4.4 ? 'url(#kit-glow)' : '');
  chips.forEach((c, i) => { const u = ease.back(seg(t, 3.95 + i * .16, 4.35 + i * .16)); c.g.setAttribute('transform', `translate(${c.x},${100 + (1 - u) * 14})`); op(c.g, seg(t, 3.95 + i * .16, 4.2 + i * .16)); });
  const on = t > 4.3;
  E.beach.setAttribute('class', on ? 'pg-beach on' : 'pg-beach');
  E.route.setAttribute('stroke', on ? 'var(--red)' : ''); E.route.style.stroke = on ? 'var(--red)' : '';
  E.sub.textContent = on ? 'PLA landing sector' : 'notional sector';

  // Turn clock.
  const k = turnAt(t);
  turnT.textContent = k ? `Turn ${k} of 8` : 'Setup';
  hoursT.textContent = k ? `Hours ${(k - 1) * 12}–${k * 12}` : '';
  phaseT.textContent = k === 1 ? 'Preparatory strikes' : k === 2 ? 'Landing' : k > 2 ? 'Fight ashore' : '';

  // Turn 1: strikes at the notional zone (reticles), all survive.
  toks.forEach((q, j) => {
    const a = TK[0] + .1 + j * .08, u = seg(t, a, a + .35);
    op(q.ret, u > 0 && u < 1 ? 1 - u : 0);
    q.ret.setAttribute('r', (26 - 12 * ease.out(u)).toFixed(1));
    // Turn 3: one air defense unit destroyed; turn 5: the drone team.
    const dead = (q.k === 'circ' && q.i === 1 && t >= TK[2] + .1) || (q.k === 'dia' && t >= TK[4] + .1);
    op(q.x2, dead ? 1 : 0);
    q.g.firstChild.setAttribute('opacity', dead ? .3 : 1);
  });
  const st = k >= 2 ? FIGHT[Math.min(k, 8) - 2] : null;
  garT.textContent = `Garrison ${st ? st.gar.toFixed(1) : '8.0'} pts`;

  // Log rows: turn 1 then turn 2 in full, later turns show their ground result only.
  let rows = [], t0 = 0;
  if (k === 1) { rows = T1; t0 = TK[0]; }
  else if (k === 2) { rows = T2; t0 = TK[1]; }
  const gap = k === 2 ? [0, .45, .95, 1.5, 1.95] : [0, .18, .36, .54, .72];
  LOGR.forEach((R, i) => setRow(R, rows[i], t0 + gap[i], t));
  logTitle.textContent = k > 2 ? 'Every turn: the fight ashore' : 'This turn: every roll';
  LED.forEach((g, i) => { const a = i === 0 ? TK[2] : TK[i + 1] + .18; op(g, k > 2 ? ease.out(seg(t, a, a + .2)) : 0); g.setAttribute('font-weight', ''); g.style.opacity = ''; });
  LED.forEach((g, i) => g.lastChild.style.fill = k - 2 === i ? 'var(--amber)' : '');

  // Ships sail on turn 2 for the east beach, through two salvos (both miss) and the mines (none stopped).
  const beach = E.b, start = [940, 430];
  ships.forEach((s, i) => {
    const u = ease.inOut(seg(t, TK[1] + i * .06, TK[1] + 1.2 + i * .06));
    const lane = (i - 1.5) * 16;
    const x = lerp(start[0], beach[0] + 30, u), y = lerp(start[1] + lane * 1.5, beach[1] + lane, u);
    s.n.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})`);
    // Turn 3 wave: one group sunk and one stopped by mines; two left afloat afterwards.
    const lostOn3 = i >= 2 && t >= TK[2] + .15;
    op(s.n, seg(t, TK[1] - .1, TK[1] + .1) * (1 - ease.in(seg(t, TK[1] + 1.25, TK[1] + 1.5))) + (t >= TK[2] && !lostOn3 ? .9 * (1 - seg(t, TK[2] + .2, TK[2] + .3)) : 0));
  });
  // The two salvos from the notional zone, missing (puffs).
  salvos.forEach((s, j) => {
    const th = TK[1] + .7 + j * .28, tf = th - .38, v = seg(t, tf, th);
    const from = [ZX + 30 + j * 40, ZY], tgt = [lerp(start[0], beach[0] + 30, .6) - 20 + j * 30, lerp(start[1], beach[1], .6) - 40 + j * 18];
    const mid = [(from[0] + tgt[0]) / 2 + 30, Math.min(from[1], tgt[1]) - 80];
    const bz = w => { const q = 1 - w; return [q * q * from[0] + 2 * q * w * mid[0] + w * w * tgt[0], q * q * from[1] + 2 * q * w * mid[1] + w * w * tgt[1]]; };
    if (t >= tf && t < th) { const pts = []; for (let n = 0; n <= 8; n++) pts.push(bz(Math.max(0, v - .25 + .25 * n / 8))); s.p.setAttribute('d', 'M' + pts.map(p => p.map(q => q.toFixed(1)).join(',')).join(' L')); op(s.p, 1); } else op(s.p, 0);
    const b = seg(t, th, th + .5);
    s.puff.setAttribute('cx', tgt[0]); s.puff.setAttribute('cy', tgt[1]);
    s.puff.setAttribute('r', (ease.out(b) * 16).toFixed(1)); op(s.puff, b > 0 && b < 1 ? 1 - b : 0);
  });
  // Helicopters come in from the north-east and land at the beach.
  helis.forEach((h, j) => {
    const u = ease.inOut(seg(t, TK[1] + 1.3 + j * .12, TK[1] + 2.1 + j * .12));
    h.setAttribute('transform', `translate(${lerp(860 + j * 30, beach[0] + 10 + j * 20, u).toFixed(1)},${lerp(180, beach[1] - 30, u).toFixed(1)})`);
    op(h, seg(t, TK[1] + 1.2, TK[1] + 1.4) * (1 - seg(t, TK[1] + 2.1, TK[1] + 2.3)));
  });
  // The drone hits the lodgment (roll 0.20 under 40%).
  { const th = TK[1] + 2.2, u = ease.in(seg(t, th - .5, th));
    drone.setAttribute('transform', `translate(${lerp(ZX + 210, beach[0], u).toFixed(1)},${lerp(ZY + 142, beach[1], u).toFixed(1)})`);
    op(drone, seg(t, th - .55, th - .4) * (1 - seg(t, th, th + .05)));
    const b = seg(t, th, th + .5); hitFx.setAttribute('cx', beach[0]); hitFx.setAttribute('cy', beach[1]);
    hitFx.setAttribute('r', (ease.out(b) * 34).toFixed(1)); op(hitFx, b > 0 && b < 1 ? 1 - b : 0); }
  // The lodgment: strength ashore after each turn, at the beach (objective 0 all game).
  const ashore = k < 2 ? 0 : t < TK[1] + 1.4 ? 0 : k === 2 ? (t < TK[1] + 2.2 ? 4.5 : t < DIE2 ? 4.1 : 2.87) : FIGHT[k - 2].ashore;
  lodge.setAttribute('transform', `translate(${beach[0] - 6},${beach[1]})`);
  lodgeC.setAttribute('r', (14 + Math.sqrt(ashore) * 7).toFixed(1));
  lodgeT.textContent = ashore.toFixed(1);
  op(lodge, ease.out(seg(t, TK[1] + 1.35, TK[1] + 1.6)));

  // Combat results table and die.
  const f = k >= 2 ? FIGHT[k - 2] : null;
  const dieT = k === 2 ? DIE2 : k > 2 ? TK[k - 1] + .18 : 99;
  const showCrt = k >= 2 && t > TK[1] + 2.3;
  op(colBand, showCrt ? 1 : 0);
  if (f) colBand.setAttribute('x', CX + f.col * CW);
  colHead.forEach((h, c) => { h.style.fill = f && c === f.col && showCrt ? 'var(--amber)' : ''; });
  const settled = f && t >= dieT;
  cells.forEach((row, r) => row.forEach((n, c) => { n.style.fill = settled && f.col === c && f.die === r + 1 ? 'var(--ink)' : ''; }));
  if (settled) { hitCell.setAttribute('x', CX + f.col * CW + 4); hitCell.setAttribute('y', CY + 30 + (f.die - 1) * CHh + 3); }
  op(hitCell, settled ? ease.out(seg(t, dieT, dieT + .15)) : 0);
  resT.textContent = settled ? `die ${f.die} · ${RES[CRT[f.die - 1][f.col]]}` : '';
  // The die: tumbles in, settles on the turn's roll.
  const rollA = k === 2 ? DIE2 - .7 : dieT - .25;
  const du = seg(t, rollA, dieT);
  const dv = k >= 2 && t > rollA - .05 && (k > 2 || t > TK[1] + 2.3);
  op(die, dv ? panelV : 0);
  if (dv) {
    const dx = 1488, dy = CY + 30 + (f.die - .5) * CHh;
    face(du < 1 ? 1 + Math.floor(Math.abs(Math.sin(t * 23)) * 6) % 6 : f.die);
    const sc = (du < 1 ? .62 + .1 * Math.abs(Math.sin(du * 9)) : .66 + .06 * (1 - seg(t, dieT, dieT + .3)));
    die.setAttribute('transform', `translate(${dx},${(dy - Math.abs(Math.sin(du * 7)) * (1 - du) * 60).toFixed(1)}) rotate(${((1 - ease.out(du)) * 540).toFixed(1)}) scale(${sc.toFixed(3)})`);
    die.setAttribute('filter', du < 1 ? 'url(#kit-glow)' : '');
  }
  op(resT, settled ? 1 : 0);
  op(outG, ease.out(seg(t, 10.95, 11.2)));
  outG.setAttribute('transform', `translate(0,${((1 - ease.out(seg(t, 10.95, 11.3))) * 12).toFixed(1)})`);

  // Payoff: 1,000 games for each of the walkthrough's three setups.
  const p = ease.out(seg(t, 11.95, 12.4));
  op(pay, p * (1 - seg(t, 14.5, 15.0)));
  MB.forEach((b, i) => {
    const u = ease.inOut(seg(t, 12.25 + i * .5, 13.0 + i * .5));
    let x = BX0;
    b.segs.forEach((r, j) => { const w = BW * b.vals[j] / 100 * u; r.setAttribute('x', x.toFixed(1)); r.setAttribute('width', Math.max(0, w).toFixed(1)); x += w; });
    b.segs[0].setAttribute('filter', i === 2 && u > .9 ? 'url(#kit-glow)' : '');
    b.num.textContent = `${Math.round(b.vals[0] * u)}%`;
    op(b.g, seg(t, 12.15 + i * .5, 12.45 + i * .5));
  });

  cap(t); end(t, 14.6, 17.6);
}
run({ duration: 17.6, poster: 8.3, frame });
