// geo.js: great-circle distance, destination point and point-along-route, copied unchanged.
const RE = 6371, rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
function distKm(a, b) {
  const dp = rad(b[1] - a[1]), dl = rad(b[0] - a[0]);
  const h = Math.sin(dp / 2) ** 2 + Math.cos(rad(a[1])) * Math.cos(rad(b[1])) * Math.sin(dl / 2) ** 2;
  return 2 * RE * Math.asin(Math.min(1, Math.sqrt(h)));
}
function destination([lon, lat], bearing, km) {
  const d = km / RE, t = rad(bearing), p1 = rad(lat), l1 = rad(lon);
  const p2 = Math.asin(Math.sin(p1) * Math.cos(d) + Math.cos(p1) * Math.sin(d) * Math.cos(t));
  const l2 = l1 + Math.atan2(Math.sin(t) * Math.sin(d) * Math.cos(p1), Math.cos(d) - Math.sin(p1) * Math.sin(p2));
  return [deg(l2), deg(p2)];
}
function along(pts, t) {
  const L = [0];
  for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + distKm(pts[i - 1], pts[i]));
  const d = Math.max(0, Math.min(1, t)) * L[L.length - 1];
  for (let i = 1; i < pts.length; i++) if (d <= L[i]) {
    const f = (d - L[i - 1]) / (L[i] - L[i - 1] || 1);

  const src = { find: [], fix: [], track: [] };

  if (sig) src.find.push('signals intercept');
  if (sat) { src.find.push('satellites'); src.fix.push('satellites'); }

function statusOf(r) {

el('circle', { cx: P(L.df21.c)[0], cy: P(L.df21.c)[1], r: 4, fill: 'var(--red)' }, rings);

// Route and the U.S. surface group.
const routeD = 'M' + Array.from({ length: 41 }, (_, i) => P(along(ROUTE, i / 40)).map(v => v.toFixed(1)).join(' ')).join('L');
const route = el('path', { d: routeD, class: 'sl-route' }, scene);
const wake = el('path', { class: 'sl-wake' }, scene);
const grp = el('g', {}, scene);
const halo = el('circle', { r: 30, fill: 'none', stroke: 'var(--blue)', 'stroke-width': 1.5 }, grp);
el('circle', { r: 11, fill: 'var(--blue)', stroke: '#0b1712', 'stroke-width': 3, filter: 'url(#kit-glow)' }, grp);
txt(0, 52, 't-label', 'U.S. surface group', { 'text-anchor': 'middle', style: 'fill:var(--blue);font-size:14px' }, grp);
const ret = el('g', { fill: 'none', stroke: 'var(--red)', 'stroke-width': 2.6 }, grp);
[0, 90, 180, 270].forEach(a => el('path', { d: 'M-30,-18 v-12 h12', transform: `rotate(${a})` }, ret));

// ---- HUD: the kill chain strip (top) and the side panel (status, Blue actions) -------------------------
const hud = el('g', {}, svg);
const CH = ['Find', 'Fix', 'Track', 'Target', 'Engage', 'Assess'];
el('rect', { x: 300, y: 36, width: 1000, height: 142, rx: 6, class: 'sl-hud' }, hud);
txt(318, 64, 't-label', 'PLA kill chain · F2T2EA', { style: 'font-size:13px' }, hud);
const chips = CH.map((s, i) => {
  const x = 318 + i * 163, g = el('g', {}, hud);
  const box = el('rect', { x, y: 78, width: 150, height: 48, rx: 4, fill: 'none', stroke: 'var(--line)', 'stroke-width': 1.5 }, g);
  const tx = txt(x + 75, 109, 'sl-chip', s.toUpperCase(), {}, g);
  if (i < 5) el('path', { d: `M${x + 152},102 h9`, stroke: 'var(--line)', 'stroke-width': 2 }, g);
  return { g, box, tx, x };
});
const why = txt(800, 158, 'sl-src', '', {}, hud);

const pan = el('g', {}, svg);
el('rect', { x: 1180, y: 214, width: 360, height: 384, rx: 6, class: 'sl-hud' }, pan);
txt(1200, 244, 't-label', 'Status', { style: 'font-size:13px' }, pan);
const stB = txt(1200, 280, 'sl-st', '', {}, pan);
const stT1 = txt(1200, 308, 'sl-sub', '', {}, pan), stT2 = txt(1200, 330, 'sl-sub', '', {}, pan);
el('line', { x1: 1200, x2: 1520, y1: 352, y2: 352, stroke: 'var(--line)', 'stroke-width': 1.5 }, pan);
txt(1200, 382, 't-label', 'Blue actions', { style: 'font-size:13px' }, pan);
const acts = ACTIONS.map((s, i) => {
  const y = 414 + i * 38, g = el('g', {}, pan);
  const box = el('rect', { x: 1200, y: y - 15, width: 20, height: 20, rx: 3, fill: 'none', stroke: 'var(--muted)', 'stroke-width': 1.6 }, g);
  const tick = el('path', { d: `M1204,${y - 5} l5,5 l8,-10`, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 2.6, 'stroke-linecap': 'round', opacity: 0 }, g);
  const tx = txt(1234, y + 1, 'sl-act', s, {}, g);
  return { g, box, tick, tx, y };
});
const ptr = el('path', { d: 'M0,0 L0,24 L6,18 L11,29 L15,27 L10,16 L18,16 Z', fill: 'var(--paper)', stroke: '#0b1712', 'stroke-width': 1.5, opacity: 0 }, svg);
const click = el('circle', { r: 0, fill: 'none', stroke: 'var(--amber)', 'stroke-width': 2, opacity: 0 }, svg);

// ---- Hook and payoff type ---------------------------------------------------------------------------
const hook = el('g', {}, svg);
const h1 = txt(800, 452, 't-hook', 'Range rings show reach,', { 'text-anchor': 'middle', style: 'font-size:70px' }, hook);
const h2 = el('text', { x: 800, y: 540, class: 't-hook', 'text-anchor': 'middle', style: 'font-size:70px' }, hook);
h2.innerHTML = 'not <tspan class="hot">threat.</tspan>';
const pay = el('g', { opacity: 0 }, svg);
el('rect', { width: 1600, height: 1000, fill: '#070f0b', opacity: .74 }, pay);
const p0 = txt(800, 330, 't-label', 'Same position · still in range of DF-26 and DF-21D', { 'text-anchor': 'middle' }, pay);
const p1 = txt(800, 440, 'sl-big', 'Detected, but', {}, pay);
const p2 = el('text', { x: 800, y: 530, class: 'sl-big' }, pay);
p2.innerHTML = '<tspan fill="var(--amber)" style="fill:var(--amber)">no firing track.</tspan>';
const p3 = txt(800, 610, 't-cap', 'Out here, defending the ship starts with denying the sensors.', { 'text-anchor': 'middle', style: 'fill:var(--muted)' }, pay);
const p4 = txt(800, 668, 'sl-fine', 'Simplified model · * notional ranges · missile ranges per CSIS', { 'text-anchor': 'middle' }, pay);

const cap = captions(svg, [
  [3.5, 7.2, 'Sail a U.S. group into the PLA rings'],
  [7.4, 9.0, 'Jam the skywave radar: signals intercept still finds it'],
  [9.1, 10.9, 'Blind the satellites and the kill chain breaks'],
  [11.0, 13.2, 'Five counter-targeting moves, four scenario tabs'],
]);
const end = endCard(svg, { kicker: 'Interactive Deterrence', title: 'Strait Layers', line: 'Move a surface group through the rings. Watch the kill chain close or break.' });

// ---- Timeline ---------------------------------------------------------------------------------------
const D = 16;
const JAM = 7.9, BLIND = 9.1;                        // clicks on the two Blue actions
const tAt = t => lerp(T0, T1, ease.inOut(seg(t, 3.3, 7.5)));
const cmAt = t => ({ emcon: false, jam: t >= JAM, blind: t >= BLIND, aew: false, c2: false });
const pWrap = (s, n) => { const w = s.split(' '), a = []; let cur = ''; for (const x of w) { if ((cur + ' ' + x).trim().length > n) { a.push(cur); cur = x; } else cur = (cur + ' ' + x).trim(); } a.push(cur); return a; };
const op = (n, v) => n.setAttribute('opacity', Math.max(0, Math.min(1, v)).toFixed(3));

function frame(t) {
  const out = 1 - seg(t, 12.9, 13.5);
  // Hook
  [h1, h2].forEach((h, i) => {
    const u = ease.out(seg(t, 0.25 + i * 0.35, 1.0 + i * 0.35)), o = 1 - seg(t, 2.6 + i * 0.1, 3.2 + i * 0.1);
    op(h, u * o); h.setAttribute('transform', `translate(0,${((1 - u) * 24 - seg(t, 2.6, 3.3) * 18).toFixed(1)})`);
  });
  // Scene: dim under the hook, full for the mechanic.
  op(scene, lerp(0.28 * ease.out(seg(t, 0, 1)), 1, ease.inOut(seg(t, 2.6, 3.5))) * lerp(1, 0.45, ease.inOut(seg(t, 10.6, 11.2))) * out);
  const push = ease.inOut(seg(t, 2.8, 12.5));
  cam.setAttribute('transform', `translate(930,560) scale(${(1 + 0.12 * push).toFixed(4)}) translate(${(-930 - 30 * push).toFixed(1)},-560)`);

  // Rings draw in.
  RING.forEach(([r, d]) => { const u = ease.inOut(seg(t, 2.7 + d, 4.1 + d)); r.setAttribute('stroke-dasharray', `${u.toFixed(4)} 1`); });
  op(sigR, ease.out(seg(t, 3.1, 3.9))); op(labs, ease.out(seg(t, 3.6, 4.3)));
  const skyOff = ease.inOut(seg(t, JAM + 0.1, JAM + 0.7));
  op(skyG, ease.out(seg(t, 3.3, 4.2)) * (1 - 0.85 * skyOff)); op(skyLab, 1 - 0.8 * skyOff);

  // Group along the route.
  const tt = tAt(t), p = along(ROUTE, tt), [gx, gy] = P(p);
  grp.setAttribute('transform', `translate(${gx.toFixed(1)},${gy.toFixed(1)})`);
  op(grp, ease.out(seg(t, 3.0, 3.6)));
  wake.setAttribute('d', 'M' + Array.from({ length: 21 }, (_, i) => P(along(ROUTE, lerp(T0 - 0.04, tt, i / 20))).map(v => v.toFixed(1)).join(' ')).join('L'));
  op(wake, ease.out(seg(t, 3.3, 3.8)) * 0.55);
  op(route, ease.out(seg(t, 2.9, 3.6)) * 0.8);
  halo.setAttribute('r', (22 + 10 * ((t * 1.1) % 1)).toFixed(1)); op(halo, 0.7 * (1 - ((t * 1.1) % 1)));

  // Model at this moment.
  const r = assessBlue(p, cmAt(t)), st = statusOf(r);
  const litU = k => ease.out(seg(t, 3.9 + k * 0.16, 4.3 + k * 0.16));
  chips.forEach((c, k) => {
    const on = r.chain[k] ? litU(k) : 0;
    const drop = !r.chain[k] && t >= BLIND ? 1 - ease.out(seg(t, BLIND + 0.05 + (k - 1) * 0.12, BLIND + 0.35 + (k - 1) * 0.12)) : 0;
    const v = Math.max(on, drop);
    c.box.setAttribute('fill', v > 0.02 ? 'var(--red)' : 'none');
    c.box.setAttribute('fill-opacity', (0.9 * v).toFixed(3));
    c.box.setAttribute('stroke', v > 0.5 ? 'var(--red)' : 'var(--line)');
    c.box.setAttribute('filter', v > 0.6 ? 'url(#kit-glow)' : '');
    c.tx.style.fill = v > 0.5 ? '#0b1712' : (r.chain[k] ? 'var(--paper)' : 'var(--muted)');
    c.g.setAttribute('transform', `translate(0,${(-(1 - litU(k)) * 8 * (t < 4.8 ? 1 : 0)).toFixed(1)})`);
  });
  why.textContent = t < 3.9 ? '' : whyText(r);
  op(why, ease.out(seg(t, 3.9, 4.4)));
  const hot = st.s === 'hot';
  stB.textContent = st.b; stB.style.fill = hot ? 'var(--red)' : 'var(--amber)';
  const lines = pWrap(st.t, 33); stT1.textContent = lines[0] || ''; stT2.textContent = lines[1] || '';
  // Pulse when the status changes (entering DF-21D range; the chain breaking).
  const flips = [];
  for (let s = 3.4; s < Math.min(t, 12); s += 0.05) { const a = statusOf(assessBlue(along(ROUTE, tAt(s)), cmAt(s))).b, b = statusOf(assessBlue(along(ROUTE, tAt(s + 0.05)), cmAt(s + 0.05))).b; if (a !== b) flips.push(s + 0.05); }
  const lastFlip = flips.length ? flips[flips.length - 1] : -9, pulse = 1 - seg(t, lastFlip, lastFlip + 0.7);
  stB.setAttribute('filter', pulse > 0.3 ? 'url(#kit-glow)' : '');
  stB.setAttribute('transform', `translate(${(pulse * -6).toFixed(1)},0)`);
  op(ret, hot ? ease.out(seg(t, 4.6, 5.0)) * (0.75 + 0.25 * Math.sin(t * 9)) : 1 - seg(t, BLIND, BLIND + 0.4));
  ret.setAttribute('transform', `scale(${(hot ? 1 : 1 + 0.6 * seg(t, BLIND, BLIND + 0.4)).toFixed(3)})`);

  op(hud, ease.out(seg(t, 3.2, 3.8)) * lerp(1, 0.2, ease.inOut(seg(t, 10.6, 11.2))) * out);
  op(pan, ease.out(seg(t, 3.4, 4.0)) * lerp(1, 0.2, ease.inOut(seg(t, 10.6, 11.2))) * out);
  pan.setAttribute('transform', `translate(${((1 - ease.out(seg(t, 3.4, 4.1))) * 30).toFixed(1)},0)`);

  // Blue actions: the pointer clicks "Jam skywave radar", then "Blind satellites".
  acts.forEach((a, i) => {
    const tc = i === 1 ? JAM : i === 2 ? BLIND : null, on = tc != null && t >= tc;
    const b = on ? ease.back(seg(t, tc, tc + 0.3)) : 0;
    a.box.setAttribute('fill', on ? 'var(--amber)' : 'none'); a.box.setAttribute('stroke', on ? 'var(--amber)' : 'var(--muted)');
    a.box.setAttribute('filter', on && t < tc + 0.8 ? 'url(#kit-glow)' : '');
    op(a.tick, b); a.tx.style.fill = on ? 'var(--amber)' : 'var(--paper)';
  });
  const target = tc => [1206, acts[tc === JAM ? 1 : 2].y - 4];
  const [ax, ay] = target(JAM), [bx, by] = target(BLIND);
  let px = 1440, py = 700;
  if (t < JAM) { const u = ease.inOut(seg(t, JAM - 1.0, JAM - 0.1)); px = lerp(1440, ax, u); py = lerp(700, ay, u); }
  else if (t < BLIND) { const u = ease.inOut(seg(t, BLIND - 0.8, BLIND - 0.1)); px = lerp(ax, bx, u); py = lerp(ay, by, u); }
  else { const u = ease.inOut(seg(t, BLIND + 0.4, BLIND + 1.3)); px = lerp(bx, 1460, u); py = lerp(by, 720, u); }
  const press = Math.max(1 - Math.abs(t - JAM) / 0.12, 1 - Math.abs(t - BLIND) / 0.12, 0);
  ptr.setAttribute('transform', `translate(${px.toFixed(1)},${py.toFixed(1)}) scale(${(1 - 0.12 * press).toFixed(3)})`);
  op(ptr, ease.out(seg(t, JAM - 1.1, JAM - 0.8)) * (1 - seg(t, BLIND + 1.1, BLIND + 1.5)));
  const lc = t >= BLIND ? BLIND : JAM, cu = seg(t, lc, lc + 0.5), [cx, cy] = lc === JAM ? [ax, ay] : [bx, by];
  click.setAttribute('cx', cx); click.setAttribute('cy', cy); click.setAttribute('r', (6 + 26 * ease.out(cu)).toFixed(1));
  op(click, t >= JAM && cu < 1 ? 1 - cu : 0);

  // Payoff.
  const pu = ease.out(seg(t, 10.7, 11.4)) * (1 - seg(t, 12.9, 13.4));
  op(pay, pu);
  [p0, p1, p2, p3, p4].forEach((n, i) => { const u = ease.out(seg(t, 10.8 + i * 0.16, 11.5 + i * 0.16)); op(n, u); n.setAttribute('transform', `translate(0,${((1 - u) * 16).toFixed(1)})`); });

  cap(t); end(t, 13.2, D);
}
run({ duration: D, poster: 9.9, frame });
</script>
</body></html>
