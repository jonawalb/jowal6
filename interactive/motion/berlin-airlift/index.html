  const last7 = i > 0 ? D.tons.slice(Math.max(0, i - 6), i + 1).reduce((a, b) => a + b, 0) / Math.min(7, i + 1) : 0;
  K[0].v.textContent = t < 4.4 ? '–' : fmt(last7);
  K[0].v.style.fill = t >= 4.4 && last7 >= reqOn(i) ? 'var(--green)' : '';
  K[1].v.textContent = fmt(reqOn(i));
  K[2].v.textContent = t < 4.4 ? '0' : fmt(cumYou[i]); K[2].sub.textContent = 'tons';
  K[3].v.textContent = t < 4.4 ? '0' : fmt(histCum[i]); K[3].sub.textContent = 'tons';
  op(card, ease.out(seg(t, 3.2, 3.7)));
  card.setAttribute('transform', `translate(${((1 - ease.out(seg(t, 3.2, 3.8))) * 30).toFixed(1)},0)`);
  op(chart, ease.out(seg(t, 3.4, 3.9)));

  // Cursor: clicks "Fly 1 week", then switches on Autopilot.
  const c1 = ease.inOut(seg(t, 3.6, 4.2)), c2 = ease.inOut(seg(t, 4.6, 5.25));
  const cxp = lerp(lerp(1400, 1100, c1), 1234, c2), cyp = lerp(lerp(700, 512, c1), 512, c2);
  const press = Math.sin(Math.PI * seg(t, 4.2, 4.38)) + Math.sin(Math.PI * seg(t, 5.3, 5.48));
  cursor.setAttribute('transform', `translate(${cxp.toFixed(1)},${cyp.toFixed(1)}) scale(${(1 - .12 * press).toFixed(3)})`);
  op(cursor, seg(t, 3.5, 3.7) * (1 - seg(t, 5.9, 6.2)) * (1 - seg(t, 10.9, 11)));
  flyBg.setAttribute('filter', t > 4.2 && t < 5.1 ? 'url(#kit-glow)' : '');
  const on = ease.out(seg(t, 5.3, 5.5));
  swBg.setAttribute('fill', on > .5 ? 'var(--amber)' : 'var(--line)');
  swK.setAttribute('cx', (13 + 22 * on).toFixed(1));

  // Map: landings against slots at each airfield, the day's weather in Berlin, aircraft flow.
  for (const f of fields) {
    const [land, slots] = D[f.k][i];
    f.use.setAttribute('width', (slots ? 64 * Math.min(1, land / slots) : 0).toFixed(1));
    f.use.setAttribute('filter', slots && land / slots > .97 ? 'url(#kit-glow)' : '');
    f.txt.textContent = slots ? `${fmt(land)} / ${fmt(slots)}` : (f.k === 'teg' ? (i < dayOf('1948-08-05') ? 'not yet begun' : 'under construction') : '');
    op(f.g, f.k === 'teg' && !slots ? .5 : 1);
  }
  wxT.textContent = t < 4.4 ? '' : `Berlin: ${['Good', 'Cloud', 'Fog'][D.wx[i]]}`;
  wxT.style.fill = D.wx[i] === 2 && t >= 4.4 ? 'var(--red)' : '';
  const flights = t < 4.3 ? 0 : D.flights[i];
  const shown = Math.min(16, Math.round(flights / 70));
  for (const pl of planes) {
    const L = lines[pl.k].getTotalLength(), u = ((t * (pl.k === 'ret' ? .16 : .22) + pl.i / 16) % 1);
    const pt = lines[pl.k].getPointAtLength(u * L);
    pl.n.setAttribute('cx', pt.x.toFixed(1)); pl.n.setAttribute('cy', pt.y.toFixed(1));
    const vis2 = pl.i < (pl.k === 'ret' ? shown : Math.ceil(shown * (pl.k === 'south' ? .75 : .6)));
    op(pl.n, vis2 ? Math.min(1, u * 8, (1 - u) * 8) : 0);
  }

  // Chart: requirement and history up to the current day, your line drawn day by day.
  if (t >= 4.3) {
    youL.setAttribute('d', pathTo(D.tons, i));
    histL.setAttribute('d', pathTo(HIST, i));
    reqL.setAttribute('d', pathTo(HIST, i, (_, j) => reqOn(j)));
  } else { youL.setAttribute('d', ''); histL.setAttribute('d', ''); reqL.setAttribute('d', ''); }
  anc.forEach(a => op(a.g, t >= 4.3 && i >= a.i ? 1 : 0));
  anc[6].g.setAttribute('filter', t > 9.9 && t < 10.9 ? 'url(#kit-glow)' : '');

  // Payoff: season total against history, and the millionth ton.
  const p = ease.out(seg(t, 11.1, 11.6));
  op(pay, p * (1 - seg(t, 14.1, 14.6)));
  PB.forEach((b, j) => {
    const u = ease.out(seg(t, 11.3 + j * .35, 12.2 + j * .35));
    b.bar.setAttribute('width', (560 * b.v / 1.6e6 * u).toFixed(1));
    b.num.textContent = fmt(b.v * u);
    op(b.g, seg(t, 11.2 + j * .35, 11.5 + j * .35));
  });
  op(payNote, ease.out(seg(t, 12.6, 13.1)));

  cap(t); end(t, 14.2, 17.4);
}
run({ duration: 17.4, poster: 9.95, frame });
</script>
