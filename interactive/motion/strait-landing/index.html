  race.setAttribute('transform', `translate(${((1 - rv) * 60).toFixed(1)},0)`);
  const tf = clamp(k === 0 ? 0 : (k - 1) + seg(t, TT[k] - Math.min(.45, TT[k] - TT[k - 1]), TT[k]), 0, 8);
  const ptsOf = arr => { const p = []; for (let i = 0; i <= Math.floor(tf); i++) p.push([i, arr[i]]); if (tf % 1 > 0) p.push([tf, lerp(arr[Math.floor(tf)], arr[Math.ceil(tf)], tf % 1)]); return p; };
  const pa = ptsOf(A), pd = ptsOf(D), pf = ptsOf(F);
  lineA.setAttribute('points', pa.map(([i, v]) => `${cx(i).toFixed(1)},${cy(v).toFixed(1)}`).join(' '));
  lineD.setAttribute('points', pd.map(([i, v]) => `${cx(i).toFixed(1)},${cy(v).toFixed(1)}`).join(' '));
  afloat.setAttribute('points', [...pa.map(([i, v], j) => `${cx(i).toFixed(1)},${cy(v + pf[j][1]).toFixed(1)}`), ...pa.slice().reverse().map(([i, v]) => `${cx(i).toFixed(1)},${cy(v).toFixed(1)}`)].join(' '));
  const la = pa[pa.length - 1], ld = pd[pd.length - 1];
  dotA.setAttribute('cx', cx(la[0]).toFixed(1)); dotA.setAttribute('cy', cy(la[1]).toFixed(1));
  dotD.setAttribute('cx', cx(ld[0]).toFixed(1)); dotD.setAttribute('cy', cy(ld[1]).toFixed(1));
  legA.setAttribute('x', (cx(la[0]) - 12).toFixed(1)); legA.setAttribute('y', (cy(la[1]) + (la[1] < ld[1] ? 26 : -14)).toFixed(1));
  legD.setAttribute('x', (cx(ld[0]) - 12).toFixed(1)); legD.setAttribute('y', (cy(ld[1]) + (la[1] < ld[1] ? -14 : 26)).toFixed(1));
  cells.forEach((c, i) => op(c, ease.out(seg(t, TT[i], TT[i] + .3))));
  const ou = ease.out(seg(t, 11.0, 11.4));
  op(outG, ou);
  outG.setAttribute('transform', `translate(0,${((1 - ou) * 12).toFixed(1)})`);

  // Payoff: the same doctrine over 1,000 weeks, by month and waiting rule.
  const p = ease.out(seg(t, 11.8, 12.4));
  op(pay, p * (1 - seg(t, 14.3, 14.8)));
  pay.setAttribute('transform', `translate(0,${((1 - p) * 20).toFixed(1)})`);
  PB.forEach((q, i) => {
    const u = ease.out(seg(t, 12.3 + i * .3, 13.1 + i * .3));
    q.bar.setAttribute('width', (600 * q.v / 100 * u).toFixed(1));
    q.num.textContent = `${Math.round(q.v * u)}%`;
    q.num.setAttribute('x', (590 + 600 * q.v / 100 * u + 18).toFixed(1));
    op(q.g, seg(t, 12.2 + i * .3, 12.5 + i * .3));
  });
  op(payNote, ease.out(seg(t, 13.4, 13.9)));

  cap(t); end(t, 14.4, 17.5);
}
run({ duration: 17.5, poster: 6.3, frame });
