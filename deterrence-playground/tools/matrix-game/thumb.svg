<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#f2f2ee"/>
  <!-- crisis board tracks -->
  <rect x="32" y="36" width="228" height="328" rx="8" fill="#fbfbf8" stroke="#d3d6cd" stroke-width="2"/>
  <g>
    <rect x="52" y="64" width="188" height="16" rx="3" fill="#e7e9e1"/><rect x="52" y="64" width="120" height="16" rx="3" fill="#b3261e"/>
    <rect x="52" y="134" width="188" height="16" rx="3" fill="#e7e9e1"/><rect x="52" y="134" width="150" height="16" rx="3" fill="#1b4fd4"/>
    <rect x="52" y="204" width="188" height="16" rx="3" fill="#e7e9e1"/><rect x="52" y="204" width="92" height="16" rx="3" fill="#0c8474"/>
    <rect x="52" y="274" width="188" height="16" rx="3" fill="#e7e9e1"/><rect x="52" y="274" width="68" height="16" rx="3" fill="#e8753a"/>
    <polyline points="52,330 90,322 128,326 166,310 204,316 240,300" fill="none" stroke="#14201a" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <!-- argument card with three reasons -->
  <rect x="290" y="36" width="318" height="186" rx="8" fill="#fbfbf8" stroke="#033303" stroke-width="3"/>
  <text x="312" y="76" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#14201a">Action</text>
  <g font-family="Menlo, monospace" font-size="20" font-weight="700">
    <rect x="312" y="96" width="36" height="28" rx="4" fill="#0c8474"/><text x="330" y="117" text-anchor="middle" fill="#fbfbf8">+1</text>
    <rect x="360" y="104" width="226" height="12" rx="6" fill="#d6e1e1"/>
    <rect x="312" y="136" width="36" height="28" rx="4" fill="#0c8474"/><text x="330" y="157" text-anchor="middle" fill="#fbfbf8">+1</text>
    <rect x="360" y="144" width="190" height="12" rx="6" fill="#d6e1e1"/>
    <rect x="312" y="176" width="36" height="28" rx="4" fill="#b3261e"/><text x="330" y="197" text-anchor="middle" fill="#fbfbf8">−1</text>
    <rect x="360" y="184" width="208" height="12" rx="6" fill="#e9e4d4"/>
  </g>
  <!-- two dice -->
  <g transform="translate(330 250)">
    <rect width="104" height="104" rx="16" fill="#fbfbf8" stroke="#14201a" stroke-width="4"/>
    <circle cx="28" cy="28" r="10" fill="#14201a"/><circle cx="52" cy="52" r="10" fill="#14201a"/><circle cx="76" cy="76" r="10" fill="#14201a"/>
  </g>
  <g transform="translate(460 262) rotate(12)">
    <rect width="104" height="104" rx="16" fill="#fbfbf8" stroke="#14201a" stroke-width="4"/>
    <circle cx="28" cy="28" r="10" fill="#14201a"/><circle cx="76" cy="28" r="10" fill="#14201a"/><circle cx="52" cy="52" r="10" fill="#14201a"/>
    <circle cx="28" cy="76" r="10" fill="#14201a"/><circle cx="76" cy="76" r="10" fill="#14201a"/>
  </g>
</svg>
