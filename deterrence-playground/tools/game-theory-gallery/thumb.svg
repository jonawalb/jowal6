<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#f2f2ee"/>
  <!-- payoff matrix with one equilibrium cell outlined -->
  <g stroke="#14201a" stroke-width="3">
    <rect x="40" y="40" width="110" height="90" rx="6" fill="#fbfbf8"/>
    <rect x="160" y="40" width="110" height="90" rx="6" fill="#fbfbf8"/>
    <rect x="40" y="140" width="110" height="90" rx="6" fill="#fbfbf8"/>
    <rect x="160" y="140" width="110" height="90" rx="6" fill="#0c8474" fill-opacity=".3"/>
  </g>
  <rect x="34" y="34" width="122" height="102" rx="9" fill="none" stroke="#1b4fd4" stroke-width="6"/>
  <!-- bargaining range bar -->
  <rect x="320" y="60" width="280" height="36" rx="5" fill="#e9e4d4" stroke="#14201a" stroke-width="3"/>
  <rect x="400" y="60" width="110" height="36" fill="#0c8474" fill-opacity=".6"/>
  <path d="M400 46v64M510 46v64" stroke="#14201a" stroke-width="4"/>
  <!-- escalation ladder -->
  <g fill-opacity=".75">
    <rect x="320" y="196" width="60" height="22" fill="#b0306e"/>
    <rect x="460" y="170" width="90" height="22" fill="#1b4fd4"/>
    <rect x="320" y="144" width="120" height="22" fill="#b0306e"/>
    <rect x="460" y="118" width="140" height="22" fill="#e8753a" fill-opacity="1"/>
  </g>
  <path d="M450 112v112" stroke="#14201a" stroke-width="3"/>
  <!-- curve -->
  <path d="M40 330 C 150 250, 260 270, 600 250" fill="none" stroke="#b3261e" stroke-width="6"/>
  <circle cx="330" cy="262" r="12" fill="#fbfbf8" stroke="#14201a" stroke-width="5"/>
  <text x="40" y="380" font-family="Georgia, serif" font-weight="700" font-size="34" fill="#033303">Game Theory Gallery</text>
</svg>
