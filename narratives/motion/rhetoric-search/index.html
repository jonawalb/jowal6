<div class="stage"><svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Animated preview of Rhetoric Search: the word sovereignty is typed into a search box, bars show how many official and state-media documents from Russia, China, Iran, the United States, Belarus, Pakistan and India use it, four results appear (quoted official sentences from the Kremlin, China's Foreign Ministry and India's Foreign Ministry, and a TASS headline), then a line chart shows Russia's share of official texts using the word rising from 2021 to 2022."><title>Rhetoric Search</title></svg></div>
<script type="module">
import { run, seg, ease, lerp, el, bg, captions, endCard } from '../kit/kit.js';
const svg = document.querySelector('svg');
bg(svg);

// ---- Real data (~/Projects/rhetoric-corpus/index/corpus.sqlite, opened read-only) ---------------------------------
// Run 2026-10-03 against the index built 2026-10-03 17:59:12 (meta table). Query: FTS5 table fts_words (title + text,
// unicode61, so the token "sovereignty" exactly; "sovereign" is not counted), MATCH 'sovereignty', joined to docs on
// rowid. Countries are the eight in the Rhetoric Search registry blurb (RU CN IR KP BY US PK IN); KP has no documents.
// c = matching documents per country: [official (docs.outlet = 'official'), state media (outlet = 'state_media')].
// The match is on the stored text, which for these items is the source's own English-language edition (the India item
// is MEA's published English translation of the PM's statement); nothing here is our translation.
// Totals: 7,027 documents = 4,266 official + 2,761 state media.
// share = official English-language documents (docs.lang = 'en', outlet = 'official', date >= 2021-01-01) per calendar
// quarter, 2021 Q1 to 2026 Q3: h = documents matching 'sovereignty', n = all such documents. RU = kremlin_en + mid_en,
// US = whitehouse + state_dept. Russia 2021: 54 / 420 = 12.9 %; 2022: 132 / 467 = 28.3 %. US 2021: 130 / 2,620; 2022: 298 / 2,921.
// Results: sentences (table sentences, each <= 300 chars) quoted verbatim from official documents; the media item is
// headline + outlet + date only (docs.title), no body text.
//   1. kremlin_en:80896, sentence 34. Putin, "First meeting of the 9th State Duma", 2026-09-30,
//      http://en.kremlin.ru/events/president/transcripts/80896
//   2. tass_com:c40f6d9ec95f786d (state media; headline only). TASS, 2026-09-30, https://tass.com/politics/2195077
//   3. mfa_cn:2a4718736de4c16e:en, sentence 5. Guo Jiakun, MFA regular press conference, 2026-06-26,
//      https://www.fmprc.gov.cn/eng/xw/fyrbt/lxjzh/202606/t20260626_11953253.html
//   4. in_mea:41726, sentence 42. "English Translation of Prime Minister's Statement at the 26th SCO Summit
//      (September 1, 2026)", 2026-09-01, https://www.mea.gov.in/speeches-statements?dtl/41726/English_Translation_of_Prime_Ministers_Statement_at_the_26th_SCO_Summit_September_1_2026
const DATA = {
  term: 'sovereignty',
  c: [['Russia', 715, 1191], ['China', 1234, 454], ['Iran', 342, 821], ['United States', 1077, 0], ['Belarus', 374, 295], ['Pakistan', 315, 0], ['India', 209, 0]],

    q0: '2021Q1',
    RU: { h: [10, 8, 12, 24, 36, 27, 33, 36, 28, 33, 36, 41, 35, 45, 31, 42, 36, 35, 26, 39, 33, 34, 33], n: [78, 94, 109, 139, 116, 112, 117, 122, 104, 126, 144, 155, 126, 148, 133, 145, 106, 150, 127, 154, 101, 146, 161] },

  },
  ru21: [54, 420], ru22: [132, 467],
  results: [
    { kind: 'official', meta: ['30 Sep 2026', 'Russia · Kremlin · Putin'], foot: 'First meeting of the 9th State Duma · en.kremlin.ru',
      lines: ['“The cohesion of our society is the surest guarantee that, together, we will achieve our goals and secure', 'reliable guarantees for Russia’s safety and sovereignty for generations to come.”'] },
    { kind: 'media', meta: ['30 Sep 2026', 'Russia · TASS'], foot: 'Headline and link only · tass.com',

    { kind: 'official', meta: ['26 Jun 2026', 'China · Foreign Ministry · Guo Jiakun'], foot: 'Regular press conference · fmprc.gov.cn',

    { kind: 'official', meta: ['1 Sep 2026', 'India · Ministry of External Affairs'], foot: 'Prime Minister’s statement at the 26th SCO Summit, English translation · mea.gov.in',

  ],

const fmt = n => n.toLocaleString('en-US');
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

const OFF = DATA.c.reduce((a, r) => a + r[1], 0), MED = DATA.c.reduce((a, r) => a + r[2], 0);   // 4,266 and 2,761

// ---- Scene -------------------------------------------------------------------------------------------------------
const blurF = el('filter', { id: 'rs-blur', x: '-5%', y: '-5%', width: '110%', height: '110%' }, svg);

{ let x = BX; ['All', ...DATA.c.map(r => r[0])].forEach((n, i) => {

el('text', { x: LX + 22, y: RY + 7 * RH + 22, class: 'key-t' }, key).textContent = 'OFFICIAL TEXTS';
el('rect', { x: LX + 200, y: RY + 7 * RH + 10, width: 14, height: 14, fill: '#4d6b5c' }, key);

  }

  const ul = off ? null : el('line', { x1: CX + 30, x2: CX + 30, y1: y + 70, y2: y + 70, stroke: 'var(--blue)', 'stroke-width': 1, opacity: .45 }, g);

});

// cursor
const cur = el('g', { opacity: 0 }, cam);
const ring = el('circle', { r: 22, fill: 'none', stroke: 'var(--amber)', 'stroke-width': 3, filter: 'url(#kit-glow)' }, cur);
el('path', { d: 'M0 0l0 30l8 -7l6 13l6 -3l-6 -12l11 0z', fill: 'var(--paper)', stroke: '#0b1712', 'stroke-width': 2 }, cur);

// hook
const hook = el('g', {}, svg);
const h1 = el('text', { x: 800, y: 430, class: 't-hook', 'text-anchor': 'middle', style: 'font-size:64px' }, hook);
h1.innerHTML = 'Seven governments say <tspan class="hot">“sovereignty”</tspan>.';
const h2 = el('text', { x: 800, y: 515, class: 't-hook', 'text-anchor': 'middle', style: 'font-size:64px' }, hook);
h2.textContent = 'Read exactly how, in one search.';
const h3 = el('text', { x: 800, y: 600, class: 't-label', 'text-anchor': 'middle' }, hook);
h3.textContent = 'Official statements quoted · state media listed by headline';

// payoff: Russia vs U.S., share of official English texts using the word, by quarter
const pay = el('g', { opacity: 0 }, svg);
el('rect', { width: 1600, height: 1000, fill: '#070f0b', opacity: .84 }, pay);
const p1 = el('text', { x: 800, y: 220, class: 't-hook', 'text-anchor': 'middle' }, pay);
p1.innerHTML = 'In 2022, Russia’s share <tspan class="hot">more than doubled</tspan>.';
el('text', { x: 800, y: 272, class: 't-label', 'text-anchor': 'middle' }, pay).textContent = 'Share of official English-language texts using “sovereignty”, by quarter';
const PX = 480, PW = 640, PY = 660, PH = 300, PMAX = 35, NQ = DATA.share.RU.h.length;
const px = i => PX + i * PW / (NQ - 1), py = v => PY - v / PMAX * PH;
[10, 20, 30].forEach(v => {
  el('line', { x1: PX, x2: PX + PW, y1: py(v), y2: py(v), stroke: '#1f3a2d' }, pay);
  el('text', { x: PX - 10, y: py(v) + 4, 'text-anchor': 'end', class: 'ax' }, pay).textContent = v + '%';
});
el('line', { x1: PX, x2: PX + PW, y1: PY, y2: PY, stroke: 'var(--muted)' }, pay);
[2021, 2022, 2023, 2024, 2025, 2026].forEach((y, k) => el('text', { x: px(k * 4), y: PY + 26, class: 'yr', 'text-anchor': k ? 'middle' : 'start' }, pay).textContent = y);
const band = el('rect', { x: px(3.5), y: PY - PH, width: px(7.5) - px(3.5), height: PH, fill: 'var(--red)', opacity: 0 }, pay);
const line = (s, col) => {
  const d = s.h.map((h, i) => `${i ? 'L' : 'M'}${px(i).toFixed(1)} ${py(100 * h / s.n[i]).toFixed(1)}`).join('');
  return el('path', { d, fill: 'none', stroke: col, 'stroke-width': 3, 'stroke-linejoin': 'round' }, pay);
};
const lUS = line(DATA.share.US, 'var(--blue)'), lRU = line(DATA.share.RU, 'var(--red)');
const lk = el('g', {}, pay);
el('line', { x1: PX, x2: PX + 26, y1: PY + 62, y2: PY + 62, stroke: 'var(--red)', 'stroke-width': 3 }, lk);
el('text', { x: PX + 36, y: PY + 67, class: 'ax' }, lk).textContent = 'Russia (Kremlin, Foreign Ministry)';
el('line', { x1: PX + 360, x2: PX + 386, y1: PY + 62, y2: PY + 62, stroke: 'var(--blue)', 'stroke-width': 3 }, lk);
el('text', { x: PX + 396, y: PY + 67, class: 'ax' }, lk).textContent = 'U.S. (White House, State)';
const nB = el('text', { x: 270, y: 520, class: 'cmp-v', 'text-anchor': 'middle', style: 'fill:var(--muted)' }, pay);
el('text', { x: 270, y: 560, class: 'cmp-h', 'text-anchor': 'middle' }, pay).textContent = 'Russia, 2021';
el('text', { x: 270, y: 584, class: 'ax', 'text-anchor': 'middle' }, pay).textContent = `${DATA.ru21[0]} of ${DATA.ru21[1]} texts`;
const nA = el('text', { x: 1330, y: 520, class: 'cmp-v', 'text-anchor': 'middle', style: 'fill:var(--red)' }, pay);
el('text', { x: 1330, y: 560, class: 'cmp-h', 'text-anchor': 'middle' }, pay).textContent = 'Russia, 2022';
el('text', { x: 1330, y: 584, class: 'ax', 'text-anchor': 'middle' }, pay).textContent = `${DATA.ru22[0]} of ${DATA.ru22[1]} texts`;
const R21 = 100 * DATA.ru21[0] / DATA.ru21[1], R22 = 100 * DATA.ru22[0] / DATA.ru22[1];   // 12.9, 28.3

const cap = captions(svg, [
  [0.3, 3.2, 'Russia, China, Iran, Belarus, the U.S., Pakistan and India'],
  [3.5, 5.1, 'Type a word or phrase'],
  [5.3, 8.5, 'Who uses it: official texts and state media, by country'],
  [8.7, 12.3, 'Official sentences quoted. State media: headline and link only'],
  [12.6, 15.0, 'Russia: 13% of its official English texts in 2021, 28% in 2022'],
]);
const end = endCard(svg, { kicker: 'Narrative Tracking', title: 'Rhetoric Search', line: 'Seven governments and their state media, searchable sentence by sentence.' });

// ---- Timeline -----------------------------------------------------------------------------------------------------
const D = 17.5;
function frame(t) {

  const a = ease.out(seg(t, 0.2, 0.9)), b = ease.out(seg(t, 0.8, 1.5)), c = ease.out(seg(t, 1.5, 2.0)), hOut = 1 - seg(t, 2.9, 3.4);

  h3.setAttribute('opacity', c * hOut);

  ui.setAttribute('opacity', ch); ui.setAttribute('transform', `translate(0,${(1 - ch) * 14})`);
  const nc = Math.round(DATA.term.length * seg(t, 3.7, 4.6));

  // payoff
  const po = ease.out(seg(t, 12.4, 13.0)) * (1 - seg(t, 14.6, 15.0));

}
