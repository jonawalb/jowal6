<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#f2f2ee"/>
  <!-- type grid: capability x intent -->
  <g stroke="#14201a" stroke-width="3">
    <rect x="40" y="40" width="130" height="120" rx="6" fill="#e8753a" fill-opacity=".85"/>
    <rect x="180" y="40" width="130" height="120" rx="6" fill="#0c8474" fill-opacity=".85"/>
    <rect x="40" y="170" width="130" height="120" rx="6" fill="#e8753a" fill-opacity=".55"/>
    <rect x="180" y="170" width="130" height="120" rx="6" fill="#0c8474" fill-opacity=".55"/>
  </g>
  <!-- eye open (reveal) / eye closed (conceal) -->
  <g fill="none" stroke="#fbfbf8" stroke-width="6" stroke-linecap="round">
    <path d="M70 100 Q105 65 140 100 Q105 135 70 100Z"/>
    <path d="M210 100 Q245 128 280 100"/>
    <path d="M70 230 Q105 195 140 230 Q105 265 70 230Z"/>
    <path d="M210 230 Q245 258 280 230"/>
  </g>
  <circle cx="105" cy="100" r="11" fill="#fbfbf8"/>
  <circle cx="105" cy="230" r="11" fill="#fbfbf8"/>
  <!-- region map -->
  <rect x="350" y="40" width="250" height="250" fill="#fbfbf8" stroke="#d3d6cd"/>
  <polygon points="350,290 350,190 450,40 600,40 600,290" fill="#0c8474" fill-opacity=".18"/>
  <polygon points="430,290 430,160 520,40 600,40 600,290" fill="#1b4fd4" fill-opacity=".28"/>
  <path d="M350 190 L450 40" stroke="#14201a" stroke-width="3" stroke-dasharray="9 7"/>
  <path d="M430 160 L430 290" stroke="#14201a" stroke-width="3" stroke-dasharray="9 7"/>
  <circle cx="500" cy="200" r="11" fill="#fbfbf8" stroke="#14201a" stroke-width="4"/>
  <text x="40" y="360" font-family="Georgia, serif" font-weight="700" font-size="34" fill="#033303">Conceal or Reveal?</text>
</svg>
