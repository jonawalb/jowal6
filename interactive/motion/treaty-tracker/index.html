  return { ...r, g, b, t };
});
const dateT = el('text', { x: 800, y: 700, class: 'dt', 'text-anchor': 'middle' }, pay);
const kW = el('text', { x: 560, y: 800, class: 'kc', 'text-anchor': 'middle', style: 'fill:#e0533d' }, pay);
el('text', { x: 560, y: 832, class: 'kl', 'text-anchor': 'middle' }, pay).textContent = 'withdrew';
const kS = el('text', { x: 800, y: 800, class: 'kc', 'text-anchor': 'middle', style: 'fill:#d0763f' }, pay);
el('text', { x: 800, y: 832, class: 'kl', 'text-anchor': 'middle' }, pay).textContent = 'suspended';
const kP = el('text', { x: 1040, y: 800, class: 'kc', 'text-anchor': 'middle', style: 'fill:#6aab82' }, pay);
el('text', { x: 1040, y: 832, class: 'kl', 'text-anchor': 'middle' }, pay).textContent = 'still a party';
el('text', { x: 800, y: 880, class: 'src', 'text-anchor': 'middle' }, pay).textContent = 'CFE Treaty status by depositary record, Nov. 2023 to 29 Sept 2026';

// Hook
const hook = el('g', {}, svg);
const h1 = el('text', { x: 800, y: 430, class: 't-hook', 'text-anchor': 'middle', style: 'font-size:74px' }, hook);
h1.textContent = 'Six decades of arms control.';
const h2 = el('text', { x: 800, y: 560, class: 't-hook', 'text-anchor': 'middle', style: 'font-size:96px' }, hook);
h2.innerHTML = 'Watch who <tspan class="hot">walked away</tspan>.';

const cap = captions(svg, [
  [0.3, 3.2, 'Who signed, joined, suspended or left, year by year'],
  [3.5, 6.6, 'Move the year: the matrix fills in from 1963'],
  [6.8, 10.4, 'From 2019 the U.S.–Russian treaties fall away'],
  [10.7, 13.8, 'CFE: 26 of the 29 remaining parties suspended it'],
]);
const end = endCard(svg, { kicker: 'Interactive Deterrence', title: 'Treaty Tracker', line: 'Six decades of arms control: who signed, joined, suspended or walked away.' });

// ---- Timeline -------------------------------------------------------------------------------------------
const D = 17;
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function yearAt(t) {
  if (t < 3.9) return 1963;
  if (t < 6.5) return lerp(1963, 2018.99, ease.inOut(seg(t, 3.9, 6.5)));
  if (t < 6.8) return 2018.99;
  return lerp(2018.99, 2026.5, seg(t, 6.8, 10.2));
}
const dnum = d => Date.parse(d + 'T00:00:00Z') / 864e5;   // days
function frame(t) {
  const hu = ease.out(seg(t, 0.2, 0.9)), h2u = ease.out(seg(t, 0.8, 1.5)), ho = 1 - seg(t, 2.9, 3.3);
  h1.setAttribute('opacity', hu * ho); h1.setAttribute('transform', `translate(0,${(1 - hu) * 20})`);
  h2.setAttribute('opacity', h2u * ho); h2.setAttribute('transform', `translate(0,${(1 - h2u) * 24})`);

  const out = 1 - seg(t, 15.0, 15.6), inn = ease.out(seg(t, 3.2, 3.9));
  const y = yearAt(t), yi = Math.min(2026, Math.floor(y));
  paint(y);
  yrT.textContent = yi;
  whenT.textContent = yi >= 2026 ? 'on 29 September 2026' : `at the end of ${yi}`;
  knob.setAttribute('cx', sx(Math.min(2026, y))); slFill.setAttribute('x2', sx(Math.min(2026, y)));
  top.setAttribute('opacity', inn * out); heads.setAttribute('opacity', inn * out);
  rows.forEach((r, i) => { const u = ease.out(seg(t, 3.4 + i * .07, 3.9 + i * .07)); r.g.setAttribute('opacity', u * out); r.g.setAttribute('transform', `translate(${(1 - u) * -20},0)`); });
  usRus.setAttribute('opacity', seg(t, 6.6, 7.0) * (1 - seg(t, 10.3, 10.7)));
  // toast: latest event passed
  // the latest event in the year the matrix shows (it reads status at the end of that year)
  const ev = [...EV].reverse().find(e => yi >= Math.floor(e[0]));
  const show = t > 6.8 && t < 10.6 && ev;
  toast.setAttribute('opacity', show ? Math.min(1, (y - Math.floor(ev[0])) * 5) * (1 - seg(t, 10.3, 10.6)) : 0);
  if (ev) {
    const list = EV.filter(e => Math.floor(e[0]) === Math.floor(ev[0])), h = 22 + list.length * 26, y0 = 902 - h;
    toastBg.setAttribute('y', y0); toastBg.setAttribute('height', h);
    evL.forEach((l, i) => { const e = list[i]; l.d.textContent = e ? e[1] : ''; l.tx.textContent = e ? e[2] : ''; l.d.setAttribute('y', y0 + 30 + i * 26); l.tx.setAttribute('y', y0 + 30 + i * 26); });
  }
  const push = ease.inOut(seg(t, 3.4, 10.4));
  cam.setAttribute('transform', `translate(800,420) scale(${1 + 0.05 * push}) translate(-800,-420)`);

  // CFE payoff: a date sweep from Oct 2023 to Dec 2025 flips each tile on its depositary date
  const pu = ease.out(seg(t, 10.6, 11.2)) * (1 - seg(t, 13.9, 14.3));
  pay.setAttribute('opacity', pu);
  const d0 = dnum('2023-10-20'), d1 = dnum('2025-12-20');
  const dn = lerp(d0, d1, ease.inOut(seg(t, 11.2, 13.1)));
  // Every tile starts as a party, except Russia (suspended since 12 Dec 2007); each flips on its record date.
  let w = 0, s = 0, p = 0;
  tiles.forEach(r => {
    const on = r.st !== 'party' && dn >= dnum(r.d), half = r.part && dn >= dnum(r.part) && !on;
    const k = r.iso === 'RUS' ? (on ? 'w' : 'u') : on ? 'u' : half ? 'h' : 'p';
    r.b.setAttribute('fill', k === 'h' ? 'url(#tt-h)' : SCOL[k]);
    r.b.setAttribute('stroke', SCOL[k]);
    r.t.style.fill = k === 'h' ? 'var(--paper)' : '#0b1712';
    r.b.setAttribute('filter', on && dn - dnum(r.d) < 60 ? 'url(#kit-glow)' : '');
    if (k === 'w') w++; else if (k === 'u') s++; else if (k === 'p') p++;
  });
  kW.textContent = w; kS.textContent = s; kP.textContent = p;
  const dd = new Date(dn * 864e5);
  dateT.textContent = `${MON[dd.getUTCMonth()]} ${dd.getUTCFullYear()}`;
  tiles.forEach((r, i) => { const u = ease.out(seg(t, 10.8 + i * .012, 11.2 + i * .012)); r.g.setAttribute('opacity', u); });
  const bl = Math.max(pu, seg(t, 13.9, 14.3));
  blurG.setAttribute('stdDeviation', (bl * 6).toFixed(2));
  cam.setAttribute('filter', bl > 0.01 ? 'url(#tt-blur)' : '');

  cap(t); end(t, 14.0, D);
}
run({ duration: D, poster: 9.4, frame });
</script>
