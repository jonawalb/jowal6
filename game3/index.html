<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Carrier Gauntlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#050b16;overflow:hidden;overscroll-behavior:none}
canvas{display:block;touch-action:none;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
// ============================================================ core
const W = 1600, H = 900, STEP = 1 / 60;
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const gs = () => (Math.random() + Math.random() + Math.random() - 1.5) * 2; // ~N(0,1)
const MONO = '"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace';
const SANS = 'Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const C = { cy: '#4fe3ff', red: '#ff4d4d', amb: '#ffb02e', txt: '#cfe3f5', dim: '#6f8aa8', ok: '#6dff9c' };

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let DPR = 1, scale = 1, offX = 0, offY = 0, vw = 0, vh = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  vw = window.innerWidth; vh = window.innerHeight;
  cv.width = Math.floor(vw * DPR); cv.height = Math.floor(vh * DPR);
  cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
  scale = Math.min(vw / W, vh / H);
  offX = (vw - W * scale) / 2; offY = (vh - H * scale) / 2;
}
window.addEventListener('resize', resize); resize();

const S = {
  scene: 'title', mode: 'A', time: 0, shake: 0, msgs: [], banner: null,
  mouse: { x: W / 2, y: H / 2 }, keys: {}, best: { A: 0, B: 0 }, over: null, newBest: false
};
const BEST_KEY = 'carrierGauntlet.best.v1';
try { const b = JSON.parse(localStorage.getItem(BEST_KEY) || 'null'); if (b) { S.best.A = +b.A || 0; S.best.B = +b.B || 0; } } catch (e) { /* storage blocked */ }
function saveBest() { try { localStorage.setItem(BEST_KEY, JSON.stringify(S.best)); } catch (e) { /* ignore */ } }

// ============================================================ audio
let AC = null, master = null, muted = false, noiseBuf = null;
const lastSfx = {};
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.45; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!AC || muted) return;
  const t = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol || .15, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .03);
}
function noise(dur, vol, fc, delay) {
  if (!AC || muted) return;
  const t = AC.currentTime + (delay || 0);
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fc || 1000;
  const g = AC.createGain(); g.gain.setValueAtTime(vol || .2, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + .03);
}
const SFX = {
  launch() { noise(.4, .13, 1400); tone(160, 60, .35, 'sawtooth', .06); },
  boom() { noise(.7, .28, 600); tone(100, 28, .55, 'sine', .25); },
  small() { noise(.25, .12, 1800); tone(220, 90, .15, 'triangle', .07); },
  sam() { noise(.25, .09, 2600); tone(500, 1100, .22, 'sawtooth', .04); },
  kill() { noise(.3, .14, 2400); tone(700, 200, .18, 'square', .06); },
  ping() { tone(1400, 1400, .5, 'sine', .12); tone(2100, 2100, .4, 'sine', .05, .02); },
  sat() { tone(600, 900, .25, 'sine', .07); },
  alarm() { tone(900, 900, .12, 'square', .07); tone(900, 900, .12, 'square', .07, .2); },
  hit() { noise(.9, .35, 380); tone(70, 25, .8, 'sawtooth', .22); },
  gun() { noise(.06, .05, 4000); },
  chaff() { noise(.8, .1, 5000); tone(300, 120, .6, 'triangle', .05); },
  click() { tone(800, 600, .05, 'square', .05); },
  deny() { tone(180, 140, .12, 'square', .07); },
  clear() { tone(520, 520, .12, 'triangle', .1); tone(780, 780, .12, 'triangle', .1, .12); tone(1040, 1040, .25, 'triangle', .1, .24); },
  over() { tone(300, 60, 1.2, 'sawtooth', .15); noise(1, .2, 500); }
};
function sfx(n) {
  const now = performance.now();
  if (lastSfx[n] && now - lastSfx[n] < 45) return;
  lastSfx[n] = now; SFX[n]();
}

// ============================================================ particles / messages
const parts = [];
function burst(x, y, n, col, sp, life, size) {
  for (let i = 0; i < n && parts.length < 1100; i++) {
    const a = rnd(0, TAU), s = rnd(.15, 1) * sp;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: rnd(.5, 1) * life, m: life, s: size * rnd(.6, 1.3), c: col });
  }
}
function updParts(dt) {
  const k = Math.pow(.04, dt);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.l -= dt;
    if (p.l <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= k; p.vy *= k;
  }
}
function msg(t, col) { S.msgs.push({ t, col: col || C.txt, l: 6 }); if (S.msgs.length > 5) S.msgs.shift(); }
function banner(t, sub, col) { S.banner = { t, sub: sub || '', col: col || C.cy, l: 2.6 }; }
function shake(v) { S.shake = Math.min(24, S.shake + v); }

// ============================================================ drawing helpers
function T(s, x, y, col, size, al, font, w) {
  ctx.font = (w || '400') + ' ' + (size || 13) + 'px ' + (font || MONO);
  ctx.fillStyle = col || C.txt; ctx.textAlign = al || 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(s, x, y);
}
function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(7,16,30,.8)'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(79,227,255,.3)'; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, w, h);
  ctx.fillStyle = C.cy; ctx.fillRect(x, y, 8, 2); ctx.fillRect(x, y, 2, 8);
}
function bar(x, y, w, h, f, col, bg) {
  ctx.fillStyle = bg || 'rgba(255,255,255,.08)'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = col; ctx.fillRect(x, y, w * clamp(f, 0, 1), h);
}
function circ(x, y, r, col, lw, dash) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.strokeStyle = col; ctx.lineWidth = lw || 1;
  if (dash) ctx.setLineDash(dash); ctx.stroke(); if (dash) ctx.setLineDash([]);
}
function drawTrail(tr, col) {
  if (tr.length < 2) return;
  ctx.lineWidth = 2;
  for (let i = 1; i < tr.length; i++) {
    ctx.globalAlpha = i / tr.length * .6; ctx.strokeStyle = col;
    ctx.beginPath(); ctx.moveTo(tr[i - 1][0], tr[i - 1][1]); ctx.lineTo(tr[i][0], tr[i][1]); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function pushTrail(tr, x, y, n) { tr.push([x, y]); if (tr.length > (n || 18)) tr.shift(); }

function coastY(x) { return 78 + Math.sin(x * .011) * 16 + Math.sin(x * .037) * 8; }
function drawBackdrop() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b1c30'); g.addColorStop(1, '#050c18');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(90,150,210,.09)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = 0; x <= W; x += 100) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); }
  for (let y = 0; y <= H; y += 100) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W, 0);
  for (let x = W; x >= 0; x -= 20) ctx.lineTo(x, coastY(x));
  ctx.closePath(); ctx.fillStyle = '#0e1b1d'; ctx.fill();
  ctx.beginPath(); for (let x = 0; x <= W; x += 20) { const y = coastY(x); x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.strokeStyle = 'rgba(255,176,46,.4)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = 'rgba(111,138,168,.55)'; ctx.font = '400 11px ' + MONO; ctx.textAlign = 'left';
  for (let i = 0; i < 16; i++) ctx.fillText(String.fromCharCode(65 + i), i * 100 + 4, H - 5);
  for (let j = 1; j < 9; j++) ctx.fillText(String(j), W - 12, j * 100 - 4);
}

// ============================================================ MODE A : ATTACK
let A = null;
const WP = {
  b: { n: 'ASBM', spd: 270, seek: 48, col: '#ff7a4d', dmg: 34, pk: .40 },
  c: { n: 'CRUISE', spd: 125, seek: 85, col: C.amb, dmg: 24, pk: .55 },
  d: { n: 'DECOY', spd: 190, seek: 0, col: '#9db4cc', dmg: 0, pk: .85 }
};
const FORM = [[0, 0], [-95, -45], [95, -45], [0, -125], [-105, 80], [105, 80]];
const STRIKE_Y = 205;

function startA() {
  A = {
    round: 0, score: 0, time: 0, phase: 'fight', clearT: 0, sel: 'b',
    stock: { b: 7, c: 7, d: 8 }, drones: 2,
    bat: { x: W / 2, y: 100, integ: 3, expo: 0, moving: false, dest: W / 2, cells: [0, 0, 0, 0, 0, 0], pingCd: 0 },
    missiles: [], dronesL: [], strikes: [], fx: [], track: null, vis: 0,
    sat: { t: 3, win: 0, fixT: 0 }, sunk: 0, group: null, hintT: 0, shots: 0, hitsLanded: 0
  };
  nextRoundA(true);
}
function nextRoundA(first) {
  A.round++;
  const r = A.round;
  if (!first) {
    A.stock.b = Math.min(10, A.stock.b + 5); A.stock.c = Math.min(10, A.stock.c + 5); A.stock.d = Math.min(12, A.stock.d + 6);
    A.drones = Math.min(4, A.drones + 2); A.bat.integ = Math.min(3, A.bat.integ + 1);
  }
  A.bat.cells.fill(0); A.bat.expo = Math.min(A.bat.expo, 30);
  const ships = [{ ox: 0, oy: 0, cv: true, alive: true, hp: 100 }];
  const ne = Math.min(5, 1 + Math.floor((r - 1) / 2));
  for (let i = 1; i <= ne; i++) ships.push({ ox: FORM[i][0], oy: FORM[i][1], cv: false, alive: true, hp: 2, ammo: 3 + Math.ceil(.8 * r), cd: rnd(0, .6) });
  A.group = { x: rnd(450, 1150), y: 835, hd: 0, tgtHd: 0, turnT: 7, spd: Math.min(32, 11 + 1.2 * r), ships, hp: 100, trail: [] };
  A.track = null; A.vis = 0; A.phase = 'fight'; A.missiles = []; A.dronesL = []; A.strikes = []; A.fx = [];
  A.sat.t = 3; A.sat.win = 0;
  banner('STAGE ' + r, ne + ' escort' + (ne > 1 ? 's' : '') + ' screening the carrier', C.amb);
  msg('Stage ' + r + ': strike group at sea. Find it, cue the track, saturate the screen.', C.amb);
}
function shipPos(s) {
  const g = A.group, c = Math.cos(g.hd), sn = Math.sin(g.hd);
  return { x: g.x + s.ox * c - s.oy * sn, y: g.y + s.ox * sn + s.oy * c };
}
function trackPos(t) {
  if (!A.track) return null;
  const k = t - A.track.t;
  return { x: A.track.x + A.track.vx * k, y: A.track.y + A.track.vy * k };
}
function fixA(sig, visT) {
  const g = A.group;
  A.track = {
    x: g.x + gs() * sig, y: g.y + gs() * sig,
    vx: Math.sin(g.hd) * g.spd * (1 + gs() * .08), vy: -Math.cos(g.hd) * g.spd * (1 + gs() * .08),
    t: A.time, sig
  };
  A.vis = Math.max(A.vis, visT);
}
function freeCells() { return A.bat.cells.reduce((n, t) => n + (t <= 0 ? 1 : 0), 0); }
function flightT(type, tx, ty) { const b = A.bat; return dist(b.x, b.y + 10, tx, ty) / WP[type].spd; }
function launchA(type, ax, ay, delay, spread) {
  const b = A.bat, ci = b.cells.findIndex(t => t <= 0);
  if (ci < 0 || A.stock[type] <= 0) return false;
  b.cells[ci] = Math.max(4.5, 7.5 - .15 * A.round);
  A.stock[type]--;
  ax += gs() * (spread || 0); ay += gs() * (spread || 0);
  ay = clamp(ay, 140, H - 10); ax = clamp(ax, 5, W - 5);
  const sx = b.x, sy = b.y + 10;
  A.missiles.push({ type, sx, sy, x: sx, y: sy, ax, ay, T: dist(sx, sy, ax, ay) / WP[type].spd, t: -(delay || 0), trail: [], dead: false, pend: 0 });
  A.shots++;
  b.expo = Math.min(100, b.expo + 3.5);
  return true;
}
function fireA() {
  const b = A.bat, m = S.mouse;
  if (b.moving) { sfx('deny'); msg('Launchers locked while relocating.', C.dim); return; }
  if (A.sel === 'x') { fireSalvoA(m.x, m.y); return; }
  if (launchA(A.sel, m.x, m.y, 0, A.sel === 'd' ? 28 : 5)) { sfx('launch'); }
  else { sfx('deny'); msg(A.stock[A.sel] <= 0 ? 'Out of ' + WP[A.sel].n + '.' : 'No launcher cell ready.', C.dim); }
}
function fireSalvoA(ax, ay) {
  const plan = ['b', 'c', 'b', 'c', 'd', 'd'], list = [];
  const st = { b: A.stock.b, c: A.stock.c, d: A.stock.d };
  let cells = freeCells();
  for (const t of plan) { if (cells > 0 && st[t] > 0) { st[t]--; cells--; list.push(t); } }
  if (!list.length) { sfx('deny'); msg('Nothing to launch.', C.dim); return; }
  // time-on-target: delay faster rounds so the whole package lands together
  const times = list.map(t => flightT(t, ax, ay)), tmax = Math.max.apply(null, times);
  list.forEach((t, i) => launchA(t, ax, ay, tmax - times[i] + i * .12, t === 'd' ? 32 : 9));
  sfx('launch'); msg('SALVO away: ' + list.length + ' rounds, time-on-target.', C.cy);
}
function relocateA(x) {
  const b = A.bat;
  if (b.moving) return;
  let d = clamp(x, 100, W - 100);
  if (Math.abs(d - b.x) < 160) d = clamp(b.x + (d >= b.x ? 1 : -1) * 220, 100, W - 100);
  if (Math.abs(d - b.x) < 60) d = clamp(b.x < W / 2 ? b.x + 300 : b.x - 300, 100, W - 100);
  b.dest = d; b.moving = true; sfx('click'); msg('Shoot-and-scoot: relocating.', C.cy);
}
function droneA() {
  if (A.drones <= 0) { sfx('deny'); msg('No drones left this stage.', C.dim); return; }
  A.drones--;
  const m = S.mouse;
  A.dronesL.push({ x: A.bat.x, y: A.bat.y + 15, tx: m.x, ty: clamp(m.y, 160, H - 20), life: 22, expo: 0, fixT: 0, a: 0, trail: [], dead: false });
  sfx('launch'); msg('Drone sortie away.', C.cy);
}
function pingA() {
  const b = A.bat;
  if (b.pingCd > 0 || b.moving) { sfx('deny'); return; }
  b.pingCd = 4; b.expo = Math.min(100, b.expo + 24);
  fixA(6, 2.2); A.sat.fixT = 0; sfx('ping'); msg('Radar ping: precise fix, but you lit up.', C.amb);
}
function updA(dt) {
  const a = A, b = a.bat, g = a.group;
  a.time += dt; a.hintT += dt;
  if (a.phase === 'clear') { a.clearT -= dt; if (a.clearT <= 0) nextRoundA(false); }
  // --- group movement
  if (a.phase === 'fight') {
    g.turnT -= dt;
    if (g.turnT <= 0) {
      g.turnT = rnd(5, 9);
      const mt = Math.min(.8, .15 + .06 * a.round);
      g.tgtHd = rnd(-mt, mt);
      if (g.x < 300) g.tgtHd = Math.abs(g.tgtHd);
      if (g.x > 1300) g.tgtHd = -Math.abs(g.tgtHd);
    }
    g.hd += clamp(g.tgtHd - g.hd, -.3 * dt, .3 * dt);
    g.x += Math.sin(g.hd) * g.spd * dt; g.y -= Math.cos(g.hd) * g.spd * dt;
    g.x = clamp(g.x, 120, W - 120);
    pushTrail(g.trail, g.x, g.y, 40);
    if (g.y <= STRIKE_Y) return endA('STRIKE GROUP IN RANGE OF THE COAST');
  }
  // --- satellite pass cycle
  const sat = a.sat;
  if (sat.win > 0) {
    sat.win -= dt; sat.fixT -= dt;
    if (sat.fixT <= 0 && a.phase === 'fight') { sat.fixT = .6; fixA(32, .9); sfx('sat'); }
  } else {
    sat.t -= dt;
    if (sat.t <= 0) { sat.win = 3; sat.fixT = 0; sat.t = Math.min(24, 15 + .5 * a.round); msg('Satellite pass overhead.', C.cy); }
  }
  a.vis = Math.max(0, a.vis - dt);
  b.pingCd = Math.max(0, b.pingCd - dt);
  // --- battery
  for (let i = 0; i < b.cells.length; i++) b.cells[i] = Math.max(0, b.cells[i] - dt);
  if (b.moving) {
    const d = b.dest - b.x, s = 260 * dt;
    if (Math.abs(d) <= s) { b.x = b.dest; b.moving = false; msg('Relocated. Ready.', C.ok); } else b.x += Math.sign(d) * s;
    b.expo = Math.max(0, b.expo - 30 * dt);
  } else {
    b.expo = Math.min(100, b.expo + (1.5 + .12 * a.round) * dt);
  }
  if (b.expo >= 100) {
    a.strikes.push({ x: b.x, y: b.y, t: 0, T: 5 }); b.expo = 25;
    msg('COUNTER-FIRE INBOUND. Scoot now.', C.red); sfx('alarm');
  }
  for (let i = a.strikes.length - 1; i >= 0; i--) {
    const s = a.strikes[i]; s.t += dt;
    if (s.t >= s.T) {
      a.strikes.splice(i, 1);
      if (Math.abs(b.x - s.x) < 75) {
        b.integ--; shake(18); sfx('hit'); burst(s.x, s.y, 50, C.red, 300, 1, 3);
        msg('Battery hit. Integrity ' + b.integ + '/3.', C.red);
        if (b.integ <= 0) return endA('BATTERY DESTROYED');
      } else { burst(s.x, s.y, 20, C.amb, 160, .8, 2); sfx('small'); msg('Counter-fire landed on an empty site.', C.ok); }
    }
  }
  // --- drones
  for (let i = a.dronesL.length - 1; i >= 0; i--) {
    const d = a.dronesL[i]; d.life -= dt;
    const dx = d.tx - d.x, dy = d.ty - d.y, dd = Math.hypot(dx, dy);
    if (dd > 8) { d.x += dx / dd * 150 * dt; d.y += dy / dd * 150 * dt; }
    else { d.a += dt * 2; d.x = d.tx + Math.cos(d.a) * 3; d.y = d.ty + Math.sin(d.a) * 3; }
    pushTrail(d.trail, d.x, d.y, 14);
    d.fixT -= dt;
    if (a.phase === 'fight' && d.fixT <= 0 && dist(d.x, d.y, g.x, g.y) < 150) { d.fixT = .8; fixA(12, 1.1); }
    let near = false;
    for (const s of g.ships) if (s.alive && !s.cv) { const p = shipPos(s); if (dist(d.x, d.y, p.x, p.y) < 300) near = true; }
    if (near && a.phase === 'fight') d.expo += dt;
    if (d.expo >= Math.max(2, 5 - .3 * a.round)) {
      burst(d.x, d.y, 25, C.cy, 180, .7, 2); sfx('kill'); msg('Drone shot down.', C.amb); a.dronesL.splice(i, 1);
    } else if (d.life <= 0) a.dronesL.splice(i, 1);
  }
  // --- missiles
  for (let i = a.missiles.length - 1; i >= 0; i--) {
    const m = a.missiles[i];
    if (m.dead) { a.missiles.splice(i, 1); continue; }
    m.t += dt;
    if (m.t < 0) continue;
    const u = Math.min(1, m.t / m.T);
    m.x = m.sx + (m.ax - m.sx) * u; m.y = m.sy + (m.ay - m.sy) * u;
    pushTrail(m.trail, m.x, m.y, m.type === 'b' ? 22 : 30);
    if (u >= 1) { a.missiles.splice(i, 1); impactA(m); }
  }
  // --- escort defences
  if (a.phase === 'fight') {
    const idP = Math.min(.5, .05 * a.round);
    for (const s of g.ships) {
      if (!s.alive || s.cv) continue;
      s.cd -= dt;
      if (s.cd > 0 || s.ammo <= 0) continue;
      const p = shipPos(s);
      let best = null, bt = 1e9;
      for (const m of a.missiles) {
        if (m.t < 0 || m.dead || m.pend >= 2) continue;
        if (dist(m.x, m.y, p.x, p.y) > 260) continue;

  if (e.mag < e.magMax) { e.reload += dt; if (e.reload >= Math.max(2.2, 3.1 - .04 * b.wave)) { e.reload = 0; e.mag++; } } else e.reload = 0;
  // AEW
  const aew = b.aew;
  if (aew.alive) { aew.a += .45 * dt; aew.x = car.x + Math.cos(aew.a) * 190; aew.y = car.y + Math.sin(aew.a) * 120 - 40; }
  else { aew.respawn -= dt; if (aew.respawn <= 0) { aew.alive = true; msg('AEW back on station.', C.ok); } }
  // gun
  let firing = false;
  const gunR = 175, gunHalf = .45;
  for (const t of b.th) {
    if (t.dead || e.over) continue;
    const d = dist(t.x, t.y, e.x, e.y); if (d > gunR) continue;
    let da = Math.atan2(t.y - e.y, t.x - e.x) - e.ang; da = Math.atan2(Math.sin(da), Math.cos(da));
    if (Math.abs(da) > gunHalf) continue;
    firing = true;
    t.hp -= (t.look === 'h' ? 1.0 : 2.6) * dt;
    if (Math.random() < .5) parts.push({ x: e.x + Math.cos(e.ang) * 20, y: e.y + Math.sin(e.ang) * 20, vx: (t.x - e.x) / d * 900, vy: (t.y - e.y) / d * 900, l: d / 900, m: d / 900, s: 1.5, c: '#fff6c0' });
    if (t.hp <= 0) killTh(t, 'gun');
  }
  if (firing && !e.over) { e.heat = Math.min(1, e.heat + .5 * dt); sfx('gun'); if (e.heat >= 1) { e.over = true; msg('GUN OVERHEAT', C.amb); } }
  else { e.heat = Math.max(0, e.heat - .45 * dt); if (e.over && e.heat < .35) e.over = false; }
  if (e.chaff < 3) { e.chaffRegen = (e.chaffRegen || 0) + dt; if (e.chaffRegen > 20) { e.chaffRegen = 0; e.chaff++; } }
  // clouds
  for (let i = b.clouds.length - 1; i >= 0; i--) { b.clouds[i].l -= dt; if (b.clouds[i].l <= 0) b.clouds.splice(i, 1); }
  // threats
  for (const t of b.th) {
    if (t.dead) continue;
    t.age += dt;
    const tg = thTarget(t), dx = tg.x - t.x, dy = tg.y - t.y, d = Math.hypot(dx, dy) || 1;
    t.vx = dx / d * t.spd; t.vy = dy / d * t.spd;
    t.x += t.vx * dt; t.y += t.vy * dt;
    pushTrail(t.trail, t.x, t.y, t.look === 'h' ? 26 : 20);
    // chaff seduction
    if (t.tg !== 'cloud') for (const c of b.clouds) {
      if (t.seen[c.l]) continue;
      const inCl = dist(t.x, t.y, c.x, c.y) < c.r;
      const tgIn = dist(tg.x, tg.y, c.x, c.y) < c.r + 30 && d < 230;
      if (inCl || tgIn) {
        t.seen[c.l] = 1;
        if (Math.random() < { c: .7, b: .45, h: .2, d: 1 }[t.type]) { t.tg = 'cloud'; t.cloud = { x: c.x + rnd(-30, 30), y: c.y + rnd(-30, 30) }; burst(t.x, t.y, 6, '#9db4cc', 60, .5, 2); }
      }
    }
    // detection + track quality
    const det = detects(t);
    if (det) {
      if (!t.det) { t.det = true; if (t.look === 'h') { sfx('alarm'); } }
      const de = dist(t.x, t.y, e.x, e.y);
      const cued = aew.alive && dist(t.x, t.y, aew.x, aew.y) < 950;
      t.q = Math.min(1, t.q + (.2 + (cued ? .3 : 0) + (de < 260 ? .35 : 0)) * dt);
    } else t.det = false;
    if (d < (t.tg === 'car' ? 30 : t.tg === 'cloud' ? 12 : 18)) impactB(t);
  }
  // interceptors
  for (let i = b.sams.length - 1; i >= 0; i--) {
    const s = b.sams[i]; s.life -= dt;
    const t = s.t;
    if (t && !t.dead) {
      const rx = t.x - s.x, ry = t.y - s.y, vv = t.vx * t.vx + t.vy * t.vy - s.spd * s.spd;
      const bb = 2 * (rx * t.vx + ry * t.vy), cc = rx * rx + ry * ry;
      let tt = Math.sqrt(cc) / s.spd;
      const disc = bb * bb - 4 * vv * cc;
      if (disc >= 0 && Math.abs(vv) > 1e-3) {
        const t1 = (-bb - Math.sqrt(disc)) / (2 * vv), t2 = (-bb + Math.sqrt(disc)) / (2 * vv);
        const c = [t1, t2].filter(x => x > 0); if (c.length) tt = Math.min.apply(null, c);
      }
      tt = Math.min(tt, 3);
      const want = Math.atan2(t.y + t.vy * tt - s.y, t.x + t.vx * tt - s.x);
      let da = want - s.ang; da = Math.atan2(Math.sin(da), Math.cos(da));
      s.ang += clamp(da, -6 * dt, 6 * dt);
      if (dist(s.x, s.y, t.x, t.y) < 17) {
        s.life = 0; t.asg = Math.max(0, t.asg - 1);
        if (Math.random() < TH[t.type].pk) killTh(t, 'sam');
        else { burst(s.x, s.y, 10, '#fff', 120, .4, 2); sfx('small'); }
        b.sams.splice(i, 1); continue;
      }
    } else if (t && t.dead) s.t = null;
    s.x += Math.cos(s.ang) * s.spd * dt; s.y += Math.sin(s.ang) * s.spd * dt;
    pushTrail(s.trail, s.x, s.y, 14);
    if (s.life <= 0 || s.x < -50 || s.x > W + 50 || s.y < -80 || s.y > H + 50) { if (s.t) s.t.asg = Math.max(0, s.t.asg - 1); b.sams.splice(i, 1); }
  }
  b.th = b.th.filter(t => !t.dead);
  // wave logic
  if (b.phase === 'break') {
    b.breakT -= dt;
    if (b.breakT <= 0) {
      b.wave++; b.queue = genWave(b.wave); b.waveT = 0; b.phase = 'wave';
      banner('WAVE ' + b.wave, b.queue.length + ' tracks expected', C.amb); msg('Wave ' + b.wave + ' inbound.', C.amb);
    }
  } else {
    b.waveT += dt;
    while (b.queue.length && b.queue[0].t <= b.waveT) spawnTh(b.queue.shift());
    if (!b.queue.length && !b.th.length) {
      const bonus = 200 * b.wave + Math.round(car.hp) * 3 + e.mag * 10;
      b.score += bonus; b.phase = 'break'; b.breakT = 4.5;
      car.hp = Math.min(100, car.hp + 10); e.hp = Math.min(100, e.hp + 10); e.mag = Math.min(e.magMax, e.mag + 5);
      if (e.chaff < 3 && b.wave % 2 === 0) e.chaff++;

    }
  }
}

  if (S.banner) { S.banner.l -= dt; if (S.banner.l <= 0) S.banner = null; }
  if (S.scene === 'play') { if (S.mode === 'A') updA(dt); else updB(dt); }
  if (S.scene !== 'paused') updParts(dt);
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#050b16'; ctx.fillRect(0, 0, vw, vh);
  ctx.save();
  const sh = S.shake;
  ctx.translate(offX + (sh ? rnd(-sh, sh) : 0), offY + (sh ? rnd(-sh, sh) : 0)); ctx.scale(scale, scale);
  ctx.beginPath(); ctx.rect(-30, -30, W + 60, H + 60); ctx.clip();
  if (S.scene === 'title') drawTitle();
  else {
    drawBackdrop();
    if (S.mode === 'A') drawA(); else drawB();
    for (const p of parts) { ctx.globalAlpha = clamp(p.l / p.m, 0, 1); ctx.fillStyle = p.c; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
    ctx.globalAlpha = 1;
    if (S.banner) {
      const bn = S.banner, al = Math.min(1, bn.l * 2);
      ctx.globalAlpha = al;
      T(bn.t, W / 2, 400, bn.col, 56, 'center', SANS, '800'); T(bn.sub, W / 2, 436, C.txt, 16, 'center');
      ctx.globalAlpha = 1;
    }
    if (S.scene === 'paused') {
      ctx.fillStyle = 'rgba(3,8,16,.7)'; ctx.fillRect(0, 0, W, H);
      T('PAUSED', W / 2, 410, C.cy, 56, 'center', SANS, '800');
      T('P / ESC resume   ·   R restart   ·   T title   ·   M mute', W / 2, 450, C.dim, 15, 'center');
    }
    if (S.scene === 'over') drawOver();
  }
  ctx.restore();
}
let last = 0, acc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) last = ts;
  const dt = Math.min(.1, (ts - last) / 1000); last = ts;
  if (document.hidden) return;
  acc += dt; let n = 0;
  while (acc >= STEP && n < 6) { tick(STEP); acc -= STEP; n++; }
  if (n >= 6) acc = 0;
  draw();
}

// ============================================================ input
const GAME_KEYS = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab', 'Escape', 'Enter']);
function toWorld(e) {
  const r = cv.getBoundingClientRect();
  S.mouse.x = (e.clientX - r.left - offX) / scale; S.mouse.y = (e.clientY - r.top - offY) / scale;
}
function onKey(code) {
  if (S.scene === 'title') {
    if (code === 'KeyA' || code === 'Digit1') startMode('A');
    else if (code === 'KeyB' || code === 'Digit2') startMode('B');
    return;
  }
  if (S.scene === 'over') {
    if (code === 'KeyR' || code === 'Enter') startMode(S.mode);
    else if (code === 'KeyX' || code === 'Tab') startMode(S.mode === 'A' ? 'B' : 'A');
    else if (code === 'KeyT' || code === 'Escape') S.scene = 'title';
    return;
  }
  if (code === 'KeyP' || code === 'Escape') { togglePause(); return; }
  if (S.scene === 'paused') {
    if (code === 'KeyR') startMode(S.mode); else if (code === 'KeyT') S.scene = 'title';
    return;
  }
  if (code === 'KeyR') { startMode(S.mode); return; }
  if (S.mode === 'A') {
    if (code === 'Digit1') A.sel = 'b'; else if (code === 'Digit2') A.sel = 'c'; else if (code === 'Digit3') A.sel = 'd'; else if (code === 'Digit4') A.sel = 'x';
    else if (code === 'KeyS') relocateA(S.mouse.x);
    else if (code === 'KeyD') droneA();
    else if (code === 'Space' || code === 'KeyE') pingA();
    else if (code === 'Enter') fireA();
  } else {
    if (code === 'Space') chaffB(); else if (code === 'KeyQ') autoEngage();
  }
}
window.addEventListener('keydown', e => {
  initAudio();
  if (GAME_KEYS.has(e.code)) e.preventDefault();
  if (e.code === 'KeyM') { muted = !muted; if (!muted) { initAudio(); sfx('click'); } return; }
  S.keys[e.code] = true;
  if (!e.repeat) onKey(e.code);
});
window.addEventListener('keyup', e => { S.keys[e.code] = false; });
cv.addEventListener('pointermove', e => toWorld(e));
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  initAudio(); toWorld(e); e.preventDefault();
  const m = S.mouse;
  if (S.scene === 'title') {
    for (const c of CARDS) if (m.x > c.x && m.x < c.x + c.w && m.y > c.y && m.y < c.y + c.h) startMode(c.mode);
  } else if (S.scene === 'over') {
    for (const b of overButtons()) if (m.x > b.x && m.x < b.x + b.w && m.y > b.y && m.y < b.y + b.h) { b.act(); break; }
  } else if (S.scene === 'paused') {
    togglePause();
  } else if (S.scene === 'play') {
    if (S.mode === 'A') { if (e.button === 2) relocateA(m.x); else clickA(); }
    else clickB();
  }
});
window.addEventListener('blur', () => { S.keys = {}; if (S.scene === 'play') S.scene = 'paused'; });
document.addEventListener('visibilitychange', () => {
  last = 0; acc = 0; S.keys = {};
  if (document.hidden && S.scene === 'play') S.scene = 'paused';
});

// debug / test hook (used by the headless bot; harmless in play)
window.__cg = {
  S, tick, draw, startMode, onKey, click: clickA, clickB, fireA, relocateA, droneA, pingA, fireSam, autoEngage, chaffB,
  get A() { return A; }, get B() { return B; }, WP, flightT, trackPos, readOf, etaOf, setMouse(x, y) { S.mouse.x = x; S.mouse.y = y; }
};
requestAnimationFrame(frame);
})();
</script>
