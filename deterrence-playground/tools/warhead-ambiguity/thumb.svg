<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#f2f2ee"/>
  <!-- radar scope with an incoming track -->
  <circle cx="160" cy="165" r="120" fill="#d6e1e1" stroke="#14201a" stroke-width="3"/>
  <circle cx="160" cy="165" r="80" fill="none" stroke="#fbfbf8" stroke-width="3"/>
  <circle cx="160" cy="165" r="40" fill="none" stroke="#fbfbf8" stroke-width="3"/>
  <path d="M160 165 L250 85 A120 120 0 0 1 280 165 Z" fill="#0c8474" fill-opacity=".35"/>
  <path d="M70 250 Q120 60 222 118" fill="none" stroke="#14201a" stroke-width="5" stroke-dasharray="12 9" stroke-linecap="round"/>
  <circle cx="222" cy="118" r="11" fill="#e8753a" stroke="#14201a" stroke-width="3"/>
  <!-- belief bars: no attack / conventional / nuclear -->
  <g stroke="#fbfbf8" stroke-width="3">
    <rect x="330" y="60" width="40" height="44" fill="#1b4fd4" fill-opacity=".7"/><rect x="370" y="60" width="180" height="44" fill="#e8753a" fill-opacity=".85"/><rect x="550" y="60" width="50" height="44" fill="#b3261e"/>
    <rect x="330" y="120" width="20" height="44" fill="#1b4fd4" fill-opacity=".7"/><rect x="350" y="120" width="160" height="44" fill="#e8753a" fill-opacity=".85"/><rect x="510" y="120" width="90" height="44" fill="#b3261e"/>
    <rect x="330" y="180" width="10" height="44" fill="#1b4fd4" fill-opacity=".7"/><rect x="340" y="180" width="110" height="44" fill="#e8753a" fill-opacity=".85"/><rect x="450" y="180" width="150" height="44" fill="#b3261e"/>
  </g>
  <rect x="330" y="244" width="270" height="26" fill="#0c8474" fill-opacity=".6"/>
  <rect x="470" y="244" width="130" height="26" fill="#b3261e" fill-opacity=".7"/>
  <path d="M470 236 l-10 -14 h20 z" fill="#14201a"/>
  <text x="40" y="360" font-family="Georgia, serif" font-weight="700" font-size="40" fill="#033303">Is It a Nuke?</text>
</svg>
