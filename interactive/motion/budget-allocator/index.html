<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trailer: Defense Budget Allocator</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
  .seg-t { font: 600 17px var(--mono); fill: #0b1712; font-variant-numeric: tabular-nums; }
  .hd { font: 400 14px var(--mono); fill: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
  .row-t { font: 400 19px var(--mono); fill: var(--paper); }
  .row-v { font: 600 19px var(--mono); fill: var(--paper); font-variant-numeric: tabular-nums; }
  .row-u { font: 400 18px var(--mono); fill: var(--paper); font-variant-numeric: tabular-nums; }
  .row-w { font: 600 16px var(--mono); fill: var(--paper); font-variant-numeric: tabular-nums; }
  .tag { font: 400 12px var(--mono); fill: var(--amber); letter-spacing: .06em; }
  .small { font: 400 15px var(--mono); fill: var(--muted); letter-spacing: .04em; }
  .tr-h { font: 400 15px var(--mono); fill: var(--muted); letter-spacing: .14em; text-transform: uppercase; }
  .tr-big { font: 600 64px var(--mono); fill: var(--paper); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .tr-what { font: italic 500 34px var(--display); fill: var(--paper); }
  .tr-move { font: 400 40px var(--display); fill: var(--paper); }
  .tr-move tspan.hot { fill: var(--amber); font-style: italic; }
  .rg-n { font: italic 500 32px var(--display); fill: var(--paper); }
  .rg-v { font: 600 34px var(--mono); fill: var(--paper); font-variant-numeric: tabular-nums; }
  .rg-tick { font: 400 14px var(--mono); fill: var(--muted); text-anchor: middle; font-variant-numeric: tabular-nums; }
  .dv-t { font: 400 19px var(--mono); fill: var(--paper); }
  .dv-v { font: 600 22px var(--mono); fill: var(--paper); font-variant-numeric: tabular-nums; }
</style>
</head><body>
<div class="stage"><svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Animated preview of the Defense Budget Allocator: Taiwan's NT$145.7 billion defense line is split into categories, a table shows what each line buys and how long the matching U.S. arms sale has taken, NT$14.6 billion moves from F-16s to Harpoon coastal launchers, and a notional range model shows overlapping bands rather than a single answer."><title>Defense Budget Allocator</title></svg></div>
<script type="module">
import { run, seg, ease, lerp, el, bg, captions, endCard } from '../kit/kit.js';
const svg = document.querySelector('svg');
bg(svg);

// ---- Numbers as the live tool shows them (tools/budget-allocator, Taiwan, budget 's145') -----------------------
// Budget: data/budget.js, NT$145.7bn, FY2026 supplementary defense line, cabinet proposal Sept. 3, 2026.
// Mixes: data/categories.js PRESETS.legacy and .porcupine. Unit costs and units: data/categories.js, via js/buys.js units().
// Wait column: data/taiwan_fms.js reference cases, via js/buys.js waitText() (as of Aug. 2026).
// Trade-off: the tool's default trade (10% = NT$14.6bn, Big-ticket platforms -> Coastal anti-ship missiles) on the legacy mix.
// Range model: js/range.js ranges()/drivers()/midValue(), 200 fixed draws, middle 80% and full spread, read off the page.
const TOTAL = 145.7;
const CATS = [
  { id: 'ascm', t: 'Coastal anti-ship missiles', col: '#4fb39c', cost: 0.753144351464435, u: 'Harpoon coastal launcher', src: 1, wait: [3.9, 'first'] },
  { id: 'drones', t: 'Drones and USVs', col: '#7fb6d9', cost: 1.3734643734643734, u: '1,000 drones or boats', src: 1, wait: [1.8, 'done'] },
  { id: 'mines', t: 'Sea mines and minelayers', col: '#a8c87c', cost: 0.4, u: 'lot of 100 mines', src: 0, wait: [3.7, 'open'] },
  { id: 'strike', t: 'HIMARS and long-range strike', col: '#b69ad8', cost: 1.5695351566486377, u: 'HIMARS launcher', src: 1, wait: [3.7, 'open'] },
  { id: 'airdef', t: 'Air and missile defense', col: '#6d8fcc', cost: 12.287587168758717, u: 'NASAMS fire unit', src: 1, wait: [1.8, 'open'] },
  { id: 'c4isr', t: 'C4ISR and resilience', col: '#9cb3a6', cost: 0.5, u: 'resilience package', src: 0, wait: [5.2, 'first'] },
  { id: 'ammo', t: 'Ammunition stocks', col: '#d2c4a0', cost: 2, u: 'day of wartime stock', src: 0, wait: [1.6, 'done'] },
  { id: 'platforms', t: 'Big-ticket platforms', col: '#8d8373', cost: 3.8519082033726386, u: 'F-16 Block 70', src: 1, wait: [7.0, 'open'] },
];
const LEGACY = { ascm: 0.05, drones: 0.03, mines: 0.02, strike: 0.05, airdef: 0.15, c4isr: 0.04, ammo: 0.06, platforms: 0.6 };
const MOVE = 0.10;                                    // NT$14.6bn
const after = { ...LEGACY, platforms: LEGACY.platforms - MOVE, ascm: LEGACY.ascm + MOVE };
// buys.js units(): two decimals under 1, one decimal under 10, whole numbers above.
const fmtN = n => n < 1 ? n.toFixed(2) : n < 10 ? n.toFixed(1) : Math.floor(n).toLocaleString('en-US');
const money = bn => bn >= 100 ? `NT$${bn.toFixed(0)}bn` : bn >= 10 ? `NT$${bn.toFixed(1)}bn` : `NT$${bn.toFixed(2)}bn`;
const RANGE = {   // force engaged, % of the attacking force: [full min, 10th pct, 90th pct, full max]
  legacy: [8.5, 14.7, 33.9, 47.6], porcupine: [19.1, 26.5, 58.2, 76.7],
};
const DRIVERS = [['How much capability the money buys', 28], ['How much of the force each layer can reach', 27], ['Strength of the opening strikes', 13]];
const MIX_SWING = 18;   // porcupine vs legacy, every assumption at mid-range (the page's "For scale" line)

// ---- Helpers -----------------------------------------------------------------------------------------------
const T = (p, x, y, cls, s, a = {}) => { const n = el('text', { x, y, class: cls, ...a }, p); if (s != null) n.textContent = s; return n; };
const op = (n, v) => n.setAttribute('opacity', Math.max(0, Math.min(1, v)).toFixed(3));
const fade = (t, a, b, d = .4) => Math.min(ease.out(seg(t, a, a + d)), 1 - seg(t, b - d, b));
const L = 150, R = 1450, BW = R - L;

const blurF = el('filter', { id: 'camblur', x: '-5%', y: '-5%', width: '110%', height: '110%' }, svg);
const blurG = el('feGaussianBlur', { stdDeviation: 0 }, blurF);
const cam = el('g', {}, svg);

// Hook
const kick = T(cam, L + 100, 330, 't-kicker', 'Taiwan · FY2026 supplementary defense line');
const hookNum = el('text', { x: L + 100, y: 470, class: 't-hook', style: 'font-size:112px' }, cam);
hookNum.innerHTML = '<tspan class="hot">NT$145.7 billion.</tspan>';
const hookQ = T(cam, L + 100, 570, 't-hook', 'What does it buy?', { style: 'font-size:72px' });

// Allocation bar
const allocLbl = T(cam, L, 120, 't-label', 'Your allocation · legacy platforms mix · NT$145.7bn');
const barG = el('g', {}, cam);
const segs = CATS.map(c => {
  const g = el('g', {}, barG);
  return { r: el('rect', { y: 150, height: 64, fill: c.col }, g), t: el('text', { y: 191, class: 'seg-t', 'text-anchor': 'middle' }, g) };
});

// "What it buys" table
const tbl = el('g', {}, cam);
const TY = 300, RH = 58, XA = 690, XU = 712, XW = 1110, YRPX = 42;
T(tbl, L, TY - 34, 'hd', 'Line');
T(tbl, XA, TY - 34, 'hd', 'Amount', { 'text-anchor': 'end' });
T(tbl, XU, TY - 34, 'hd', 'Pays for');
T(tbl, XW, TY - 34, 'hd', 'U.S. sale so far, years');
const WCOL = { done: 'var(--green)', first: 'var(--amber)', open: 'var(--red)' };
const rows = CATS.map((c, i) => {
  const y = TY + i * RH, g = el('g', {}, tbl);
  el('line', { x1: L, x2: R, y1: y - 22, y2: y - 22, stroke: 'var(--line)', 'stroke-width': 1.5 }, g);
  el('rect', { x: L, y: y - 6, width: 14, height: 14, fill: c.col }, g);
  T(g, L + 26, y + 7, 'row-t', c.t);
  const amt = T(g, XA, y + 7, 'row-v', '', { 'text-anchor': 'end' });
  const un = T(g, XU, y + 7, 'row-u', '');
  if (!c.src) T(g, XU, y + 27, 'tag', 'notional');
  const [yrs, kind] = c.wait, w = yrs * YRPX;
  const bar = el('rect', { x: XW, y: y - 6, height: 14, rx: 2, fill: WCOL[kind] }, g);
  const arrow = kind === 'open' ? el('path', { d: 'M0 -9l12 9l-12 9z', fill: WCOL.open }, g) : null;
  const wl = T(g, XW + w + (arrow ? 22 : 10), y + 8, 'row-w', `${yrs.toFixed(1)}`);
  return { c, g, y, amt, un, bar, arrow, wl, w };
});
const legend = el('g', {}, tbl);
[['done', 'complete'], ['first', 'first delivery'], ['open', 'none yet, still counting']].forEach(([k, s], i) => {
  const x = [760, 880, 1066][i];
  el('rect', { x, y: TY + 8 * RH - 14, width: 12, height: 12, fill: WCOL[k] }, legend);
  T(legend, x + 18, TY + 8 * RH - 3, 'small', s, { style: 'font-size:13px' });
});
T(legend, L, TY + 8 * RH - 3, 'small', 'Matching U.S. arms sales, to Aug. 2026:', { style: 'font-size:13px' });
const hiRow = el('rect', { x: L - 14, y: 0, width: BW + 28, height: RH - 6, rx: 4, fill: 'var(--amber)', opacity: 0 }, tbl);
tbl.insertBefore(hiRow, tbl.firstChild);

// Trade-off card
const trade = el('g', {}, cam);
const moveT = el('text', { x: 800, y: 330, class: 'tr-move', 'text-anchor': 'middle' }, trade);
moveT.innerHTML = 'Move <tspan class="hot">NT$14.6bn</tspan> from big-ticket platforms to coastal anti-ship missiles';
moveT.style.fontSize = '36px';
const cards = [['You give up', 'platforms', 'F-16 Block 70, program cost', ['U.S. sale notified Aug. 2019', 'No deliveries by Aug. 2026 (7.0 yrs)']],
  ['You get', 'ascm', 'Harpoon coastal launchers, with missiles and radars', ['U.S. sale notified Oct. 2020', 'First delivery Sept. 2024 (3.9 yrs)']]].map(([h, id, what, w], i) => {
  const g = el('g', {}, trade), x = i ? 820 : 180, c = CATS.find(d => d.id === id);
  el('rect', { x, y: 400, width: 600, height: 330, rx: 8, fill: '#0a1510', 'fill-opacity': .9, stroke: i ? 'var(--amber)' : 'var(--line)', 'stroke-width': 2 }, g);
  el('rect', { x: x + 32, y: 438, width: 14, height: 14, fill: c.col }, g);
  T(g, x + 56, 451, 'tr-h', h);
  const n = T(g, x + 32, 552, 'tr-big', '');
  T(g, x + 32, 610, 'tr-what', what, { style: 'font-size:25px' });
  T(g, x + 32, 652, 'small', w[0], { style: 'font-size:15px' });
  T(g, x + 32, 676, 'small', w[1], { style: 'font-size:15px;fill:var(--paper)' });
  T(g, x + 32, 708, 'tag', 'cited, est.', { style: 'font-size:13px' });
  return { g, n, id };
});
const tradeNote = T(trade, 800, 790, 'small', 'Unit costs are program costs, so counts give a sense of scale only.', { 'text-anchor': 'middle' });

// Cursor that drags the money across the bar
const cur = el('g', { opacity: 0 }, cam);
const ring = el('circle', { r: 22, fill: 'none', stroke: 'var(--amber)', 'stroke-width': 3, filter: 'url(#kit-glow)' }, cur);
el('path', { d: 'M0 0l0 30l8 -7l6 13l6 -3l-6 -12l11 0z', fill: 'var(--paper)', stroke: '#0b1712', 'stroke-width': 2 }, cur);
const chunk = el('rect', { y: 150, height: 64, rx: 3, fill: '#8d8373', stroke: 'var(--amber)', 'stroke-width': 3, opacity: 0 }, cam);

// Range model
const rng = el('g', { opacity: 0 }, svg);
el('rect', { width: 1600, height: 1000, fill: '#070f0b', opacity: .84 }, rng);
T(rng, 800, 150, 't-kicker', 'Range model · notional · 200 runs, six unknowns', { 'text-anchor': 'middle' });
const rgTitle = el('text', { x: 800, y: 228, class: 't-hook', 'text-anchor': 'middle', style: 'font-size:50px' }, rng);
rgTitle.innerHTML = 'Not an answer: <tspan class="hot">a range.</tspan>';
T(rng, 800, 282, 'small', 'Force engaged: share of the attacking force under effective attack', { 'text-anchor': 'middle' });
const AX0 = 520, AXW = 900, ax = v => AX0 + AXW * v / 100;
[0, 25, 50, 75, 100].forEach(v => {
  el('line', { x1: ax(v), x2: ax(v), y1: 330, y2: 540, stroke: 'var(--line)', 'stroke-width': 1.5 }, rng);
  T(rng, ax(v), 566, 'rg-tick', v + '%');
});
const bands = [['Legacy platforms', 'legacy', 'var(--muted)', 390], ['Porcupine', 'porcupine', 'var(--amber)', 480]].map(([n, k, col, y]) => {
  const g = el('g', {}, rng), [mn, lo, hi, mx] = RANGE[k];
  T(g, 180, y + 10, 'rg-n', n);
  const full = el('line', { x1: ax(mn), x2: ax(mx), y1: y, y2: y, stroke: col, 'stroke-width': 3, opacity: .7 }, g);
  const mid = el('rect', { y: y - 17, height: 34, rx: 4, fill: col }, g);
  const v = T(g, ax(mx) + 18, y + 9, 'rg-v', `${Math.round(lo)}–${Math.round(hi)}%`, { style: `font-size:24px;fill:${col}` });
  return { g, full, mid, v, lo, hi, mn, mx, y };
});
const ovl = el('rect', { y: 350, height: 160, fill: 'var(--paper)', opacity: 0 }, rng);
const ovlT = T(rng, 0, 534, 'small', 'overlap', { 'text-anchor': 'middle', style: 'font-size:13px;fill:var(--paper)' });
T(rng, 180, 630, 'tr-h', 'What moves it most (points of force engaged)');
const drv = [...DRIVERS.map(([s, v]) => [s, v, 'var(--paper)']), ['Switching porcupine ↔ legacy', MIX_SWING, 'var(--amber)']].map(([s, v, col], i) => {
  const g = el('g', {}, rng), y = 680 + i * 46;
  T(g, 180, y + 7, 'dv-t', s, { style: `fill:${col}` });
  el('rect', { x: 900, y: y - 7, width: 360, height: 12, rx: 3, fill: 'var(--line)' }, g);
  const b = el('rect', { x: 900, y: y - 7, height: 12, rx: 3, fill: col }, g);
  T(g, 1420, y + 9, 'dv-v', `${v} pts`, { 'text-anchor': 'end', style: `fill:${col}` });
  return { g, b, v };
});

const cap = captions(svg, [
  [0.3, 3.0, 'Taiwan’s NT$145.7bn defense line, proposed Sept. 3, 2026'],
  [3.4, 7.4, 'What each line buys, and how long the U.S. sale has taken'],
  [7.7, 11.0, 'Move money between lines: see what you give up and get'],
  [11.3, 14.6, 'A notional model run 200 times: ranges, never a verdict'],
]);
const end = endCard(svg, { kicker: 'Interactive Deterrence', title: 'Defense Budget Allocator', line: 'Split a real defense budget. See what it buys and what it trades away.', cta: 'Try it' });

// ---- Timeline -----------------------------------------------------------------------------------------------
const D = 17.5;
function frame(t) {
  // Hook
  const hk = 1 - ease.inOut(seg(t, 2.7, 3.2));
  op(kick, ease.out(seg(t, 0.2, 0.8)) * hk);
  const hn = ease.out(seg(t, 0.6, 1.3));
  op(hookNum, hn * hk);
  hookNum.setAttribute('transform', `translate(0,${(1 - hn) * 30 - (1 - hk) * 40})`);
  op(hookQ, ease.out(seg(t, 1.4, 2.0)) * hk);
  hookQ.setAttribute('transform', `translate(0,${(1 - ease.out(seg(t, 1.4, 2.0))) * 20})`);

  const sceneOut = 1 - seg(t, 15.0, 15.6);
  // Bar: legacy mix, then the trade moves 10% from platforms to ASCM
  const tu = ease.inOut(seg(t, 8.6, 9.6));
  const m = Object.fromEntries(CATS.map(c => [c.id, lerp(LEGACY[c.id], after[c.id], tu)]));
  op(allocLbl, seg(t, 3.0, 3.5) * sceneOut);
  let x = L;
  const xs = {};
  CATS.forEach((c, i) => {
    const gu = ease.out(seg(t, 3.0 + i * 0.06, 3.5 + i * 0.06)), w = BW * m[c.id] * gu, s = segs[i];
    xs[c.id] = [x, w];
    s.r.setAttribute('x', x); s.r.setAttribute('width', Math.max(0, w - 2));
    s.t.setAttribute('x', x + w / 2); s.t.textContent = m[c.id] > 0.045 ? Math.round(m[c.id] * 100) + '%' : '';
    op(s.t, gu);
    s.r.setAttribute('filter', (c.id === 'ascm' || c.id === 'platforms') && t > 8.5 && t < 10.2 ? 'url(#kit-glow)' : '');
    x += w;
  });
  op(barG, sceneOut);

  // Table
  const tblIn = 1 - ease.inOut(seg(t, 7.3, 7.9));
  op(tbl, seg(t, 3.3, 3.6) * tblIn);
  rows.forEach((r, i) => {
    const u = ease.out(seg(t, 3.5 + i * 0.12, 4.1 + i * 0.12));
    op(r.g, u);
    r.g.setAttribute('transform', `translate(${(1 - u) * -24},0)`);
    const bn = LEGACY[r.c.id] * TOTAL;
    r.amt.textContent = money(bn);
    r.un.textContent = `${fmtN(bn / r.c.cost)} × ${r.c.u}`;
    const wu = ease.out(seg(t, 4.6 + i * 0.12, 5.6 + i * 0.12));
    r.bar.setAttribute('width', Math.max(0, r.w * wu));
    op(r.wl, seg(t, 5.3 + i * 0.12, 5.7 + i * 0.12));
    if (r.arrow) {
      const pulse = t > 5.8 ? (Math.sin((t - 5.8) * 5) + 1) / 2 : 0;
      r.arrow.setAttribute('transform', `translate(${XW + r.w * wu + 2 + pulse * 4},${r.y + 1})`);
      op(r.arrow, wu);
    }
  });
  const hp = rows[7];
  hiRow.setAttribute('y', hp.y - 26);
  op(hiRow, 0.12 * fade(t, 6.2, 7.5, .3));

  // Trade-off
  const trIn = ease.out(seg(t, 7.8, 8.4)), trOut = 1 - seg(t, 10.9, 11.3);
  op(trade, trIn * trOut * sceneOut);
  trade.setAttribute('transform', `translate(0,${(1 - trIn) * 24})`);
  const gv = MOVE * TOTAL;
  cards.forEach((c, i) => {
    const u = ease.out(seg(t, 8.7 + i * .2, 9.8 + i * .2)), cat = CATS.find(d => d.id === c.id);
    c.n.textContent = fmtN(gv * u / cat.cost) + ' ×';
    c.g.setAttribute('transform', `translate(0,${(1 - ease.out(seg(t, 8.0 + i * .15, 8.6 + i * .15))) * 30})`);
  });
  op(tradeNote, seg(t, 9.8, 10.2));

  // Cursor picks NT$14.6bn off the platforms end of the bar and drops it on the anti-ship segment
  const [px, pw] = xs.platforms;
  const cw = BW * MOVE;
  const grab = { x: px + pw - cw / 2, y: 182 }, drop = { x: L + BW * LEGACY.ascm + cw / 2, y: 182 };
  const ap = ease.inOut(seg(t, 7.9, 8.5)), dr = ease.inOut(seg(t, 8.6, 9.6)), lv = ease.inOut(seg(t, 9.7, 10.3));
  let cx = lerp(grab.x + 140, grab.x, ap), cy = lerp(grab.y + 160, grab.y, ap);
  if (t > 8.5) { cx = lerp(grab.x, drop.x, dr); cy = grab.y - Math.sin(dr * Math.PI) * 40; }
  cx += lv * 100; cy += lv * 140;
  op(cur, seg(t, 7.9, 8.1) * (1 - lv) * sceneOut);
  cur.setAttribute('transform', `translate(${cx},${cy})`);
  const press = seg(t, 8.4, 8.6) * (1 - seg(t, 9.5, 9.7));
  ring.setAttribute('r', lerp(26, 16, press)); op(ring, press);
  op(chunk, press * .9);
  chunk.setAttribute('x', cx - cw / 2); chunk.setAttribute('width', cw);
  chunk.setAttribute('y', cy - 32);
  chunk.setAttribute('fill', dr > .5 ? '#4fb39c' : '#8d8373');

  // Range model overlay
  const ru = ease.out(seg(t, 11.2, 11.9)) * (1 - seg(t, 14.6, 15.0));
  op(rng, ru);
  const bl = Math.max(ru, seg(t, 14.6, 15.0) * (t < 15.6 ? 1 : 0));
  blurG.setAttribute('stdDeviation', (bl * 6).toFixed(2));
  cam.setAttribute('filter', bl > 0.01 ? 'url(#camblur)' : '');
  bands.forEach((b, i) => {
    const u = ease.out(seg(t, 11.6 + i * .35, 12.4 + i * .35));
    const c = (b.lo + b.hi) / 2, lo = lerp(c, b.lo, u), hi = lerp(c, b.hi, u);
    b.mid.setAttribute('x', ax(lo)); b.mid.setAttribute('width', Math.max(0, ax(hi) - ax(lo)));
    const fu = ease.out(seg(t, 12.0 + i * .35, 12.8 + i * .35));
    b.full.setAttribute('x1', ax(lerp(c, b.mn, fu))); b.full.setAttribute('x2', ax(lerp(c, b.mx, fu)));
    op(b.v, seg(t, 12.4 + i * .35, 12.8 + i * .35));
    op(b.g, seg(t, 11.5 + i * .35, 11.8 + i * .35));
  });
  const o0 = RANGE.porcupine[1], o1 = RANGE.legacy[2], ou = fade(t, 12.9, 14.6, .3);
  ovl.setAttribute('x', ax(o0)); ovl.setAttribute('width', ax(o1) - ax(o0)); op(ovl, .14 * ou);
  ovlT.setAttribute('x', ax((o0 + o1) / 2)); op(ovlT, ou);
  drv.forEach((d, i) => {
    const u = ease.out(seg(t, 12.9 + i * .18, 13.6 + i * .18));
    op(d.g, seg(t, 12.8 + i * .18, 13.1 + i * .18));
    d.b.setAttribute('width', 360 * d.v / 30 * u);
  });

  cap(t); end(t, 15.0, D);
}
run({ duration: D, poster: 6.8, frame });
</script>
</body></html>
