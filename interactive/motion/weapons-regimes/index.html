<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trailer: Conventional Weapons Regime Explorer</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
  .it-t { font: italic 500 50px var(--display); fill: var(--paper); }
  .src { font: 400 13px var(--mono); fill: var(--muted); letter-spacing: .04em; }
  .col-h { font: 600 13px var(--mono); fill: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
  .chip { font: 400 11.5px var(--mono); letter-spacing: 0; }
  .il { font: 400 14px var(--mono); }
  .rg { font: 400 12px var(--mono); fill: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .bd { font: 600 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; }
  .pv { font: 600 17px var(--mono); fill: var(--paper); }
  .co-h { font: 400 13px var(--mono); fill: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .co-t { font: italic 400 25px var(--display); fill: var(--paper); }
  .ax { font: 400 13px var(--mono); fill: var(--muted); font-variant-numeric: tabular-nums; }
  .ev-d { font: 600 15px var(--mono); fill: var(--amber); font-variant-numeric: tabular-nums; }
  .ev-t { font: 400 16px var(--mono); fill: var(--paper); }
</style>
</head><body>
<div class="stage"><svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Animated preview of the Conventional Weapons Regime Explorer: for a landmine, a long-range military drone and a technical manual in turn, the matching US, multilateral and EU regimes light up beside their controlling provisions, such as USML Cat. VIII(a) and the Ottawa Convention; then a timeline sweeps from the 1980 CCW to the 2026 CCW expert group report."><title>Conventional Weapons Regime Explorer</title></svg></div>
<script type="module">
import { run, seg, ease, lerp, el, bg, captions, endCard } from '../kit/kit.js';
const svg = document.querySelector('svg');
bg(svg);

// ---- Real data (tools/weapons-regimes/data, as of 2026-10-06) -------------------------------------------
// REG: every regime in regimes.json as [id, short, jurisdiction], in the file's order.
// ITEMS: three of the 16 entries in items.json as [id, label, group, applies], each apply copied unchanged as
// [regime, level, provision, plain]. A regime chip is "direct" if any apply for it is direct (the tool's map rule).
// FOCUS: the apply whose plain reading is shown in full. EV: seven events from timeline.json, text unchanged;
// ALL: the dates of all 32 timeline events (dots on the axis).
const REG = [["itar","ITAR / USML","US"],["aeca","AECA § 38","US"],["ear","EAR / CCL","US"],["nfa","NFA","US"],["gca","GCA / § 922(o)","US"],["atf_fr","ATF frame/receiver rule","US"],["dodd3000","DoDD 3000.09","US"],["faa_uas","FAA Part 107 / § 363","US"],["wassenaar","Wassenaar","Multilateral"],["mtcr","MTCR","Multilateral"],["att","ATT","Multilateral"],["un_salw","UN PoA / ITI","Multilateral"],["firearms_protocol","UN Firearms Protocol","Multilateral"],["ccw","CCW","Multilateral"],["unga_laws","UNGA LAWS resolutions","Multilateral"],["ottawa","Ottawa Convention","Multilateral"],["ccm","Cluster Munitions Convention","Multilateral"],["eu_cp","EU Common Position","EU"],["eu_dualuse","EU Dual-Use Reg.","EU"],["eu_firearms","EU Firearms Directive","EU"]];
const ITEMS = [["landmine","Landmine","Munitions",[["ottawa","direct","Convention as a whole","Anti-personnel mines banned for parties; five states left in 2025-26."],["ccw","direct","Amended Protocol II","Use restrictions on mines, booby-traps and other devices."],["itar","direct","USML Cat. IV(a)(9)","Anti-personnel, anti-vehicle and anti-armor land mines."],["wassenaar","direct","ML4","Explosive devices."],["eu_cp","direct","EU Common Military List","Military export assessment in EU states."]]],
  ["bigdrone","Military UAS, 300 km+ range","Unmanned systems",[["mtcr","direct","Category I or II","Category I if it can carry 500 kg to 300 km (strong presumption of denial); Category II for other 300 km systems."],["itar","direct","USML Cat. VIII(a)","Military UAVs; marked 'MT' where range is 300 km or more."],["aeca","direct","22 U.S.C. 2778","Export licensing authority."],["wassenaar","direct","ML10","Military aircraft and UAVs."],["att","conditional","Art. 2(1)(d), (g)","Combat aircraft or missile categories may cover armed UAS; scope depends on national definitions (analysis)."],["eu_cp","direct","EU Common Military List","EU states assess exports against the Common Position criteria."],["dodd3000","conditional","DoDD 3000.09","Applies to US DoD if the system is armed and has autonomous target selection functions."]]],
  ["manual","Technical manual or technical data","Information",[["itar","direct","22 CFR 120.33-120.34","Controlled if required to build, operate or repair a USML item, unless public domain or general principles taught in schools."],["itar","conditional","22 CFR 120.32","Helping a foreign person use or repair a defense article can be a 'defense service'."],["ear","conditional","0E501 etc.; 15 CFR 734.7","Technology for CCL items is controlled unless 'published' (with the firearm-file exception)."],["wassenaar","direct","ML22","Technology for ML items; public-domain technology excluded."],["mtcr","conditional","Annex technology","Technology for listed missile and UAV items."]]]];
const FOCUS = [0, 1, 0];
const EV = [["1980-10-10","ccw","CCW concluded in Geneva (in force 2 Dec 1983)."],
  ["1997-09-18","ottawa","Anti-Personnel Mine Ban Convention concluded in Oslo (in force 1 Mar 1999)."],
  ["2008-05-30","ccm","Convention on Cluster Munitions concluded in Dublin (in force 1 Aug 2010)."],
  ["2013-04-02","att","Arms Trade Treaty adopted in New York (in force 24 Dec 2014)."],
  ["2020-03-09","ear","USML Categories I-III transfer to the EAR takes effect, incl. 15 CFR 734.7(c)."],
  ["2025-12-27","ottawa","Estonia, Latvia and Lithuania leave the Ottawa Convention."],
  ["2026-09-05","ccw","CCW GGE on LAWS adopts its 2024-2026 report by consensus, with elements of an instrument."]];
const ALL = ["1980-10-10","1997-09-18","2001-05-31","2001-07","2008-05-30","2008-12-08","2013-04-02","2016-09-20","2018-10-05","2019-09-16","2019-11-12","2020-03-09","2021-04-27","2022-08-24","2022-09-06","2023-01-25","2023-12-22","2024-04-30","2024-12-02","2025-03-06","2025-03-26","2025-07-04","2025-09-15","2025-09-30","2025-12-01","2025-12-27","2026-01-10","2026-02-20","2026-06-05","2026-08-17","2026-09-05","2026-09-14"];
const SHORT = Object.fromEntries(REG.map(r => [r[0], r[1]]));
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmt = d => { const [y, m, dd] = d.split('-'); return `${+dd} ${MON[m - 1]} ${y}`; };
const decY = d => { const [y, m = 1, dd = 1] = d.split('-').map(Number); return y + (m - 1) / 12 + (dd - 1) / 365; };

// ---- Board ----------------------------------------------------------------------------------------------
const defs = el('defs', {}, svg);
defs.innerHTML = '<pattern id="wr-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#10231a"/><rect width="2.2" height="7" fill="#f0a93b" opacity=".28"/></pattern>';
const blurF = el('filter', { id: 'wr-blur', x: '-5%', y: '-5%', width: '110%', height: '110%' }, svg);
const blurG = el('feGaussianBlur', { stdDeviation: 0 }, blurF);
const cam = el('g', {}, svg);
const LX = 150, RX = 980, RW = 470;

const top = el('g', {}, cam);
el('text', { x: LX, y: 90, class: 't-label' }, top).textContent = 'Item finder · every rule that reaches it';
const itT = el('text', { x: LX, y: 168, class: 'it-t' }, top);
const itS = el('text', { x: LX, y: 208, class: 'src' }, top);
// legend
el('rect', { x: LX, y: 239, width: 14, height: 14, rx: 3, fill: 'var(--amber)' }, top);
el('text', { x: LX + 24, y: 251, class: 'src', style: 'fill:var(--paper)' }, top).textContent = 'Direct';
el('rect', { x: LX + 120, y: 239, width: 14, height: 14, rx: 3, fill: 'url(#wr-hatch)', stroke: 'var(--amber)', 'stroke-dasharray': '3 2' }, top);
el('text', { x: LX + 144, y: 251, class: 'src', style: 'fill:var(--paper)' }, top).textContent = 'Conditional';
// item list (right, top)
el('text', { x: RX, y: 90, class: 't-label' }, top).textContent = 'Item types · 3 of 16';
const itemRows = ITEMS.map(([, label], k) => {
  const g = el('g', {}, top), y = 108 + k * 44;
  const b = el('rect', { x: RX, y, width: RW, height: 36, rx: 6, fill: '#0e1f17', stroke: '#2c4a3b' }, g);
  const tx = el('text', { x: RX + 16, y: y + 24, class: 'il' }, g); tx.textContent = label;
  return { b, tx };
});

// regime chips, grouped by jurisdiction
const JUR = ['US', 'Multilateral', 'EU'], CW = 256, CH = 40, CG = 12, CY0 = 300, CRG = 8;
const heads = el('g', {}, cam);
JUR.forEach((j, c) => { el('text', { x: LX + c * (CW + CG), y: CY0 - 14, class: 'col-h' }, heads).textContent = j; });
const chips = {};
JUR.forEach((j, c) => REG.filter(r => r[2] === j).forEach(([id, short], i) => {
  const x = LX + c * (CW + CG), y = CY0 + i * (CH + CRG), g = el('g', {}, cam);
  el('rect', { x, y, width: CW, height: CH, rx: 6, fill: 'none', stroke: '#1f3a2d', 'stroke-width': 1.2 }, g);
  el('text', { x: x + 14, y: y + 25, class: 'chip', style: 'fill:var(--muted)', opacity: .6 }, g).textContent = short;
  const dir = el('g', { opacity: 0 }, g);
  el('rect', { x, y, width: CW, height: CH, rx: 6, fill: 'var(--amber)' }, dir);
  el('text', { x: x + 14, y: y + 25, class: 'chip', style: 'fill:#0b1712;font-weight:600' }, dir).textContent = short;
  const con = el('g', { opacity: 0 }, g);
  el('rect', { x, y, width: CW, height: CH, rx: 6, fill: 'url(#wr-hatch)', stroke: 'var(--amber)', 'stroke-width': 1.6, 'stroke-dasharray': '6 4' }, con);
  el('text', { x: x + 14, y: y + 25, class: 'chip', style: 'fill:var(--paper)' }, con).textContent = short;
  chips[id] = { g, dir, con, cx: x + CW / 2, cy: y + CH / 2 };
}));

// provision rows, one stack per item
el('text', { x: RX, y: CY0 - 14, class: 'col-h' }, heads).textContent = 'Controlling provision';
const stacks = ITEMS.map(([, , , ap]) => ap.map(([rg, lv, pv], i) => {
  const g = el('g', { opacity: 0 }, cam), y = CY0 + i * 62;
  const b = el('rect', { x: RX, y, width: RW, height: 54, rx: 6, fill: '#0e1f17', stroke: '#2c4a3b' }, g);
  el('text', { x: RX + 16, y: y + 21, class: 'rg' }, g).textContent = SHORT[rg];
  el('text', { x: RX + RW - 16, y: y + 21, class: 'bd', 'text-anchor': 'end', style: `fill:${lv === 'direct' ? 'var(--amber)' : '#d2b27a'}` }, g).textContent = lv;
  el('text', { x: RX + 16, y: y + 45, class: 'pv' }, g).textContent = pv;
  return { g, b, rg, lv };
}));

// callout: the plain reading of one entry, in full
const wrap = (s, n) => { const out = ['']; for (const w of s.split(' ')) { const c = out[out.length - 1]; if (c && (c + ' ' + w).length > n) out.push(w); else out[out.length - 1] = (c + ' ' + w).trim(); } return out; };
const call = el('g', { opacity: 0 }, cam);
el('rect', { x: LX, y: 760, width: 780, height: 112, rx: 10, fill: '#0e1f17', stroke: 'var(--amber)', 'stroke-width': 1.6 }, call);
const coH = el('text', { x: LX + 22, y: 790, class: 'co-h' }, call);
const coL = [0, 1].map(i => el('text', { x: LX + 22, y: 826 + i * 32, class: 'co-t' }, call));

// ---- Timeline overlay -----------------------------------------------------------------------------------
const pay = el('g', { opacity: 0 }, svg);
el('rect', { width: 1600, height: 1000, fill: '#070f0b', opacity: .84 }, pay);
el('text', { x: 800, y: 150, class: 't-kicker', 'text-anchor': 'middle' }, pay).textContent = 'Timeline · 32 dated changes, 1980–2026';
const pT = el('text', { x: 800, y: 225, class: 't-hook', 'text-anchor': 'middle', style: 'font-size:50px' }, pay);
pT.innerHTML = 'The rules <tspan class="hot">keep moving</tspan>.';
const AX0 = 150, AX1 = 1450, AY = 320, Y0 = 1980, Y1 = 2027;
const ax = y => AX0 + (y - Y0) / (Y1 - Y0) * (AX1 - AX0);
el('line', { x1: AX0, x2: AX1, y1: AY, y2: AY, stroke: 'var(--line)', 'stroke-width': 4, 'stroke-linecap': 'round' }, pay);
[1980, 1990, 2000, 2010, 2020].forEach(y => { el('text', { x: ax(y), y: AY + 36, class: 'ax', 'text-anchor': 'middle' }, pay).textContent = y; });
el('text', { x: ax(2026.7), y: AY + 36, class: 'ax', 'text-anchor': 'middle' }, pay).textContent = 2026;
const dots = ALL.map(d => ({ y: decY(d), c: el('circle', { cx: ax(decY(d)), cy: AY, r: 4.5, fill: 'var(--muted)', opacity: .35 }, pay) }));
const evEls = EV.map(([d, rg, tx], i) => {
  const yy = 420 + i * 52, g = el('g', { opacity: 0 }, pay);
  el('text', { x: AX0, y: yy, class: 'ev-d' }, g).textContent = fmt(d);
  el('text', { x: AX0 + 150, y: yy, class: 'ev-t' }, g).textContent = tx;
  const big = el('circle', { cx: ax(decY(d)), cy: AY, r: 8, fill: 'var(--amber)', filter: 'url(#kit-glow)', opacity: 0 }, pay);
  return { g, big, y: decY(d) };
});
const head = el('rect', { y: AY - 26, width: 3, height: 52, fill: 'var(--amber)', filter: 'url(#kit-glow)' }, pay);

// Hook
const hook = el('g', {}, svg);
const h1 = el('text', { x: 800, y: 430, class: 't-hook', 'text-anchor': 'middle', style: 'font-size:64px' }, hook);
h1.textContent = 'A landmine. A drone. A technical manual.';
const h2 = el('text', { x: 800, y: 560, class: 't-hook', 'text-anchor': 'middle', style: 'font-size:92px' }, hook);
h2.innerHTML = 'Which rules <tspan class="hot">govern it</tspan>?';

const cap = captions(svg, [
  [0.3, 3.2, 'US law, multilateral regimes and EU rules, side by side'],
  [3.5, 6.2, 'A landmine: the Ottawa Convention, the CCW, the arms lists'],
  [6.4, 8.6, 'A long-range military drone: ITAR, MTCR, Wassenaar, ATT'],
  [8.8, 11.0, 'Information counts too: technical data is controlled'],
  [11.3, 14.3, 'Every entry dated and linked to its primary text'],
]);
const end = endCard(svg, { kicker: 'Interactive Deterrence', title: 'Conventional Weapons Regime Explorer', line: 'Pick a weapon or a piece of technical data and see every rule that governs it.', cta: 'Explore' });
svg.querySelector('.t-title').style.fontSize = '76px';

// ---- Timeline -------------------------------------------------------------------------------------------
const D = 17.5, S = [3.9, 6.3, 8.7], L = 2.4;
let shown = -1;
function frame(t) {
  const hu = ease.out(seg(t, 0.2, 0.9)), h2u = ease.out(seg(t, 0.8, 1.5)), ho = 1 - seg(t, 2.9, 3.3);
  h1.setAttribute('opacity', hu * ho); h1.setAttribute('transform', `translate(0,${(1 - hu) * 20})`);
  h2.setAttribute('opacity', h2u * ho); h2.setAttribute('transform', `translate(0,${(1 - h2u) * 24})`);

  const inn = ease.out(seg(t, 3.2, 3.9)), out = 1 - seg(t, 14.3, 14.7);
  top.setAttribute('opacity', inn * out); heads.setAttribute('opacity', inn * out);
  Object.values(chips).forEach((c, i) => { const u = ease.out(seg(t, 3.3 + i * .025, 3.8 + i * .025)); c.g.setAttribute('opacity', u * out); });

  // current item: k, with u = its fade (in over the first .3 s, out over the last .25 s)
  let k = S.findLastIndex(s => t >= s - .05); if (k < 0) k = 0;
  const s = S[k], e = s + L, last = k === S.length - 1;
  const iu = ease.out(seg(t, s - .05, s + .3)) * (last ? 1 - seg(t, 11.0, 11.4) : 1 - seg(t, e - .25, e - .05));
  if (shown !== k) {
    shown = k; const [, label, group, ap] = ITEMS[k];
    itT.textContent = label;
    itS.textContent = `${group} · ${ap.length} entries, ${ap.filter(a => a[1] === 'direct').length} direct`;
    const f = ap[FOCUS[k]], ln = wrap(f[3], 74);
    if (ln.length > 2) console.warn('callout text needs more than two lines', f[3]);
    coH.textContent = `${SHORT[f[0]]} · ${f[2]}`;
    coL.forEach((n, i) => { n.textContent = ln[i] || ''; });
  }
  itT.setAttribute('opacity', iu); itS.setAttribute('opacity', iu);
  itT.setAttribute('transform', `translate(${(1 - ease.out(seg(t, s - .05, s + .4))) * -16},0)`);
  itemRows.forEach((r, j) => {
    const on = j === k && t >= S[0] - .05;
    r.b.setAttribute('fill', on ? 'var(--amber)' : '#0e1f17'); r.b.setAttribute('stroke', on ? 'var(--amber)' : '#2c4a3b');
    r.tx.style.fill = on ? '#0b1712' : 'var(--muted)'; r.tx.style.fontWeight = on ? 600 : 400;
  });
  // chips light in the order of the item's entries; a regime with any direct entry shows as direct
  const ap = ITEMS[k][3], seen = {};
  ap.forEach(([rg, lv], i) => { if (!(rg in seen)) seen[rg] = { i, lv }; else if (lv === 'direct') seen[rg].lv = 'direct'; });
  for (const [id, c] of Object.entries(chips)) {
    const h = seen[id], u = h ? ease.out(seg(t, s + .25 + h.i * .11, s + .5 + h.i * .11)) * iu : 0;
    c.dir.setAttribute('opacity', h && h.lv === 'direct' ? u : 0);
    c.con.setAttribute('opacity', h && h.lv !== 'direct' ? u : 0);
  }
  stacks.forEach((rows, j) => rows.forEach((r, i) => {
    const u = j === k ? ease.out(seg(t, s + .25 + i * .11, s + .6 + i * .11)) * iu : 0;
    r.g.setAttribute('opacity', u * out); r.g.setAttribute('transform', `translate(${(1 - u) * 30},0)`);
  }));
  // focus: callout, glowing chip and row
  const fu = ease.out(seg(t, s + 1.05, s + 1.4)) * iu, fr = stacks[k][FOCUS[k]];
  call.setAttribute('opacity', fu * out);
  call.setAttribute('transform', `translate(0,${(1 - fu) * 16})`);
  stacks.forEach(rows => rows.forEach(r => { r.b.setAttribute('stroke', r === fr && fu > .5 ? 'var(--amber)' : '#2c4a3b'); r.b.setAttribute('filter', r === fr && fu > .5 ? 'url(#kit-glow)' : ''); }));
  for (const [id, c] of Object.entries(chips)) c.g.setAttribute('filter', id === fr.rg && fu > .5 ? 'url(#kit-glow)' : '');

  const push = ease.inOut(seg(t, 3.3, 11.2));
  cam.setAttribute('transform', `translate(800,500) scale(${1 + 0.03 * push}) translate(-800,-500)`);

  // timeline sweep: the playhead steps from one key event to the next
  const pu = ease.out(seg(t, 11.2, 11.7)) * (1 - seg(t, 14.2, 14.6));
  pay.setAttribute('opacity', pu);
  const T0 = 11.7, ST = .34;
  const n = Math.max(0, Math.min(EV.length - 1, Math.floor((t - T0) / ST)));
  const yr = lerp(evEls[Math.max(0, n - 1)].y, evEls[n].y, ease.inOut(seg(t - n * ST, T0, T0 + .2)));
  head.setAttribute('x', ax(yr) - 1.5);
  dots.forEach(d => d.c.setAttribute('opacity', d.y <= yr + .01 ? .9 : .3));
  evEls.forEach((v, i) => {
    const u = ease.out(seg(t, T0 + i * ST + .12, T0 + i * ST + .4));
    v.g.setAttribute('opacity', u); v.g.setAttribute('transform', `translate(${(1 - u) * 20},0)`);
    v.big.setAttribute('opacity', u);
  });
  const bl = Math.max(pu, seg(t, 14.2, 14.6));
  blurG.setAttribute('stdDeviation', (bl * 6).toFixed(2));
  cam.setAttribute('filter', bl > 0.01 ? 'url(#wr-blur)' : '');

  cap(t); end(t, 14.5, D);
}
run({ duration: D, poster: 7.9, frame });
</script>
</body></html>
