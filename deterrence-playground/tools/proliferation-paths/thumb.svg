<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#f2f2ee"/>
  <rect x="24" y="24" width="592" height="352" rx="8" fill="#fbfbf8" stroke="#d3d6cd"/>
  <g stroke="#d3d6cd" stroke-width="1">
    <line x1="150" y1="60" x2="150" y2="330"/><line x1="270" y1="60" x2="270" y2="330"/><line x1="390" y1="60" x2="390" y2="330"/><line x1="510" y1="60" x2="510" y2="330"/>
  </g>
  <!-- row 1: explore, pursue, acquire -->
  <rect x="70" y="72" width="60" height="30" fill="#a88000"/><rect x="130" y="72" width="70" height="30" fill="#cf4d12"/><rect x="200" y="72" width="390" height="30" fill="#b3261e"/>
  <!-- row 2: explore, pursue, acquire, reversal -->
  <rect x="250" y="128" width="40" height="30" fill="#a88000"/><rect x="290" y="128" width="40" height="30" fill="#cf4d12"/><rect x="330" y="128" width="100" height="30" fill="#b3261e"/>
  <path d="M424 168 L448 168 L436 188 Z" fill="#14201a"/>
  <!-- row 3: explore, pursue, stop -->
  <rect x="200" y="194" width="50" height="30" fill="#a88000"/><rect x="250" y="194" width="130" height="30" fill="#cf4d12"/>
  <path d="M374 234 L398 234 L386 254 Z" fill="#14201a"/>
  <!-- row 4: explore only, twice -->
  <rect x="230" y="260" width="80" height="30" fill="#a88000"/><rect x="420" y="260" width="20" height="30" fill="#a88000"/>
  <line x1="350" y1="56" x2="350" y2="336" stroke="#14201a" stroke-width="3"/>
  <circle cx="350" cy="56" r="8" fill="#14201a"/>
  <g font-family="Georgia, serif" font-weight="700" font-size="24" fill="#033303">
    <text x="364" y="62">1975</text>
    <text x="70" y="356">Explore</text><text x="200" y="356" fill="#cf4d12">Pursue</text><text x="330" y="356" fill="#b3261e">Acquire</text><text x="470" y="356" fill="#14201a">Reverse</text>
  </g>
</svg>
