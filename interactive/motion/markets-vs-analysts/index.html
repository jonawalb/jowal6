  el('line', { x1: L, x2: L + 26, y1: 242, y2: 242, stroke: '#b9c4bd', 'stroke-width': 2 }, g);
  el('text', { x: L + 36, y: 247, class: 'mv-leg', style: 'fill:var(--muted)' }, g).textContent = 'PLA aircraft, 7-day mean (right axis)';
  el('rect', { x: 780, y: 234, width: 18, height: 16, class: 'mv-ex', style: 'fill-opacity:.25' }, g);
  el('text', { x: 808, y: 247, class: 'mv-leg', style: 'fill:var(--muted)' }, g).textContent = 'Major exercise';
  el('path', { d: 'M990 250v-14', class: 'mv-jcrp' }, g);
  el('text', { x: 1004, y: 247, class: 'mv-leg', style: 'fill:var(--muted)' }, g).textContent = 'Joint combat readiness patrol';
}
const head = el('text', { x: L, y: 156, class: 't-kicker' }, chart); head.textContent = 'Price of a $1 “Yes” share, daily · Polymarket';

// Crosshair and tooltip (the player's hover)
const hov = el('g', { opacity: 0 }, scene);
const cross = el('line', { y1: PT - 6, y2: VB, stroke: 'var(--amber)', 'stroke-width': 2, filter: 'url(#kit-glow)' }, hov);
const dotP = el('circle', { r: 7, fill: 'var(--red)', stroke: '#fff3dc', 'stroke-width': 2.5 }, hov);
const dotA = el('circle', { r: 6, fill: '#b9c4bd', stroke: '#0b1712', 'stroke-width': 2 }, hov);
const ring = el('circle', { r: 20, fill: 'none', stroke: 'var(--amber)', 'stroke-width': 2.5 }, hov);
const tip = el('g', {}, hov);
el('rect', { x: 0, y: 0, width: 470, height: 236, rx: 6, class: 'mv-tip' }, tip);
const tipD = el('text', { x: 20, y: 40, class: 'mv-tipd' }, tip);
const tipRows = MK.map((m, i) => {
  const y = 76 + i * 26;
  el('rect', { x: 20, y: y - 11, width: 10, height: 10, fill: m.col }, tip);
  el('text', { x: 40, y, class: 'mv-tipr', style: i ? 'fill:var(--muted)' : '' }, tip).textContent = m.label;
  return el('text', { x: 450, y, 'text-anchor': 'end', class: i ? 'mv-tipm' : 'mv-tipv' }, tip);
});
el('line', { x1: 20, x2: 450, y1: 180 - 2, y2: 180 - 2, class: 'mv-grid' }, tip);
const tipA = el('text', { x: 20, y: 200, class: 'mv-tipr' }, tip);
const tipX = el('text', { x: 20, y: 224, class: 'mv-tipr', style: 'fill:var(--amber)' }, tip);

// ---- Hook ------------------------------------------------------------------------------------------
const hook = el('g', {}, svg);
const h1 = el('text', { x: 800, y: 330, 'text-anchor': 'middle', class: 't-hook' }, hook); h1.textContent = 'A $1 bet on a Chinese invasion';
const h2 = el('text', { x: 800, y: 402, 'text-anchor': 'middle', class: 't-hook' }, hook); h2.textContent = 'of Taiwan by the end of 2026 cost';
const hBig = el('text', { x: 800, y: 590, 'text-anchor': 'middle', class: 'mv-big', filter: 'url(#kit-glow)' }, hook); hBig.textContent = '3.5¢';
const hSub = el('text', { x: 800, y: 650, 'text-anchor': 'middle', class: 'mv-sub' }, hook); hSub.textContent = 'Last Polymarket trade, Sept. 29, 2026';

// ---- Payoff: the lead/lag test ------------------------------------------------------------------------
const pay = el('g', { opacity: 0 }, svg);
el('rect', { width: 1600, height: 1000, fill: '#070f0b', opacity: .86 }, pay);
el('text', { x: 800, y: 150, 'text-anchor': 'middle', class: 't-kicker' }, pay).textContent = 'Lead or lag? · PLA aircraft vs. invasion price';
const XL = 360, XR = 1240, XY0 = 530, XH = 190;
let YMAX = 0.8;                                       // the tool's auto scale: 0.8 for levels, 0.2 for changes
const XS = r => XY0 - r / YMAX * XH;
const bandR = el('rect', { x: XL - 10, width: XR - XL + 20, fill: 'var(--paper)', 'fill-opacity': .09 }, pay);
el('line', { x1: XL - 10, x2: XR + 10, y1: XY0, y2: XY0, class: 'mv-base' }, pay);
const yl = [1, 0.5, -0.5, -1].map(f => ({ f, t: el('text', { x: XL - 22, y: XY0 - f * XH + 5, 'text-anchor': 'end', class: 'mv-axis' }, pay), l: el('line', { x1: XL - 10, x2: XR + 10, y1: XY0 - f * XH, y2: XY0 - f * XH, class: 'mv-grid', 'stroke-dasharray': '2 6' }, pay) }));
el('text', { x: XL - 22, y: XY0 + 5, 'text-anchor': 'end', class: 'mv-axis' }, pay).textContent = '0';
const NB = XC.changes.length, bwid = (XR - XL) / NB;
const bars = XC.changes.map((_, i) => el('rect', { x: XL + i * bwid + 3, width: bwid - 6, rx: 1.5 }, pay));
el('text', { x: XL, y: 758, class: 'mv-small' }, pay).textContent = '← market moves first';
el('text', { x: XR, y: 758, 'text-anchor': 'end', class: 'mv-small' }, pay).textContent = 'aircraft move first →';
el('text', { x: 800, y: 758, 'text-anchor': 'middle', class: 'mv-small' }, pay).textContent = `lag, ±21 days · ${XC.n} matched days`;
// toggle, as in the tool: "Use day-over-day changes"
const tg = el('g', {}, pay);
const tgBox = el('rect', { x: 1060, y: 222, width: 58, height: 30, rx: 15, fill: 'var(--line)' }, tg);
const tgKnob = el('circle', { cy: 237, r: 11, fill: 'var(--paper)' }, tg);
const tgT = el('text', { x: 1046, y: 243, 'text-anchor': 'end', class: 'mv-tg' }, tg);
const cnt = el('text', { x: XL, y: 250, class: 'mv-cnt' }, pay);
const cntT = el('text', { x: XL, y: 282, class: 'mv-small' }, pay);
const verdict = el('text', { x: 800, y: 860, 'text-anchor': 'middle', class: 'mv-hl' }, pay);
verdict.innerHTML = '<tspan>No clear </tspan><tspan style="fill:var(--amber)">lead or lag</tspan><tspan>.</tspan>';
const outL = XC.levels.filter(r => Math.abs(r) > XC.bandL).length, outC = XC.changes.filter(r => Math.abs(r) > XC.bandC).length;

const cap = captions(svg, [
  [3.5, 6.6, 'Open contracts on invasion, clash and blockade'],
  [6.8, 10.3, 'Set against the PLA record: 130 aircraft, one day'],
  [10.6, 12.7, 'Price levels drift together, so everything looks linked'],
  [12.8, 14.7, 'Test daily changes instead: no clear pattern'],
]);
const end = endCard(svg, { kicker: 'Interactive Deterrence', title: 'Markets vs. Analysts', line: 'What traders paid for war over Taiwan, against the PLA record.' });

// ---- Frame -----------------------------------------------------------------------------------------
const HK0 = Math.round((Date.parse('2025-11-10T00:00:00Z') - D0) / DAY);
function frame(t) {
  // Hook
  const hi = k => ease.out(seg(t, 0.2 + k * 0.3, 0.9 + k * 0.3));
  const ho = 1 - seg(t, 2.8, 3.4);
  [h1, h2].forEach((n, k) => { n.setAttribute('opacity', hi(k) * ho); n.setAttribute('transform', `translate(0,${(1 - hi(k)) * 22 - seg(t, 2.8, 3.4) * 20})`); });
  const bu = ease.back(seg(t, 0.95, 1.6));
  hBig.setAttribute('opacity', seg(t, 0.95, 1.25) * ho);
  hBig.setAttribute('transform', `translate(800,540) scale(${(0.7 + 0.3 * bu) * (1 - 0.15 * seg(t, 2.8, 3.4))}) translate(-800,-540)`);
  hSub.setAttribute('opacity', ease.out(seg(t, 1.6, 2.1)) * ho);

  // Scene visibility
  const vis = lerp(0.14 * seg(t, 0, 1), 1, ease.inOut(seg(t, 2.9, 3.7)));
  const dim = lerp(1, 0.18, ease.inOut(seg(t, 10.3, 11.0)));
  scene.setAttribute('opacity', (vis * dim * (1 - seg(t, 14.8, 15.4))).toFixed(3));

  // Wipe the record in, then overlays
  clipR.setAttribute('width', ((R - L + 70) * ease.inOut(seg(t, 3.4, 6.0))).toFixed(1));
  airG.setAttribute('opacity', ease.out(seg(t, 5.2, 6.4)).toFixed(3));
  exG.setAttribute('opacity', ease.out(seg(t, 6.2, 6.8)).toFixed(3));
  tags.forEach((g, i) => g.setAttribute('opacity', ease.out(seg(t, 5.8 + i * 0.12, 6.3 + i * 0.12)).toFixed(3)));
  leg.setAttribute('opacity', ease.out(seg(t, 3.3, 4.0)).toFixed(3));
  head.setAttribute('opacity', ease.out(seg(t, 3.2, 3.8)).toFixed(3));
  [volLab, volPk].forEach(n => n.setAttribute('opacity', ease.out(seg(t, 4.6, 5.2)).toFixed(3)));

  // Hover: glide from Nov 10, 2025 to Dec 29, 2025 (Justice Mission day 1), hold
  const hv = ease.inOut(seg(t, 7.0, 8.7));
  const k = Math.round(lerp(HK0, JM.a, hv));
  const x = X(k);
  hov.setAttribute('opacity', (ease.out(seg(t, 6.8, 7.2)) * (1 - seg(t, 10.2, 10.6))).toFixed(3));
  cross.setAttribute('x1', x); cross.setAttribute('x2', x);
  const p = byDay['567621'].get(k);
  dotP.setAttribute('opacity', p != null ? 1 : 0); if (p != null) { dotP.setAttribute('cx', x); dotP.setAttribute('cy', Y(p)); }
  const a7 = AIR7[k]; dotA.setAttribute('opacity', a7 != null ? 1 : 0); if (a7 != null) { dotA.setAttribute('cx', x); dotA.setAttribute('cy', YA(a7)); }
  const land = seg(t, 8.7, 9.3);
  ring.setAttribute('cx', x); ring.setAttribute('cy', p != null ? Y(p) : PB);
  ring.setAttribute('r', lerp(34, 18, ease.out(land))); ring.setAttribute('opacity', land > 0 ? 1 - land * 0.4 : 0);
  tipD.textContent = nice(k);
  MK.forEach((m, i) => { const c = byDay[m.id].get(k); tipRows[i].textContent = c != null ? c.toFixed(1) + '¢' : 'not yet traded'; });
  tipA.textContent = `PLA aircraft: ${AIR[k] ?? 'no report'}${a7 != null ? ` · 7-day mean ${a7.toFixed(1)}` : ''}`;
  tipX.textContent = k >= JM.a && k <= JM.b ? 'Justice Mission-2025' : '';
  tipA.style.fill = k === JM.a ? 'var(--amber)' : '';
  tipA.style.fontWeight = k === JM.a ? '600' : '';
  tip.setAttribute('transform', `translate(${(x + 26).toFixed(1)},${PT - 20})`);

  // Camera: slow push, leaning toward the December cursor
  const push = ease.inOut(seg(t, 3.2, 10.4));
  const lean = ease.inOut(seg(t, 7.0, 9.6));
  cam.setAttribute('transform', `translate(${(-lean * 40).toFixed(1)},${(-push * 8).toFixed(1)}) translate(800,470) scale(${(1 + push * 0.04 + lean * 0.03).toFixed(4)}) translate(-800,-470)`);

  // Payoff: levels first (everything "significant"), then the toggle flips to day-over-day changes
  const pu = ease.out(seg(t, 10.4, 11.0)) * (1 - seg(t, 14.8, 15.3));
  pay.setAttribute('opacity', pu.toFixed(3));
  const grow = ease.out(seg(t, 10.6, 11.4)), flip = ease.inOut(seg(t, 12.6, 13.3));
  const band = lerp(XC.bandL, XC.bandC, flip);
  YMAX = lerp(0.8, 0.2, flip);
  yl.forEach(({ f, t: tx }) => { const v = f * YMAX; tx.textContent = (v > 0 ? '+' : '−') + Math.abs(v).toFixed(1); });
  bandR.setAttribute('y', XS(band)); bandR.setAttribute('height', XS(-band) - XS(band));
  bars.forEach((b, i) => {
    const g = ease.out(clamp((grow * 1.6) - i / NB * 0.6));
    const r = lerp(XC.levels[i], XC.changes[i], ease.inOut(clamp(flip * 1.4 - (i / NB) * 0.4))) * g;
    b.setAttribute('y', Math.min(XS(r), XY0)); b.setAttribute('height', Math.max(1, Math.abs(XS(r) - XY0)));
    const out = Math.abs(r) > band + 1e-6 && g > 0.9;
    b.setAttribute('fill', out ? 'var(--red)' : 'var(--muted)');
    b.setAttribute('fill-opacity', out ? 0.9 : 0.7);
  });
  const on = flip > 0.5;
  tgBox.setAttribute('fill', on ? 'var(--amber)' : 'var(--line)');
  tgKnob.setAttribute('cx', lerp(1075, 1103, flip));
  tgT.textContent = on ? 'Day-over-day changes' : 'Price levels';
  tgT.style.fill = on ? 'var(--amber)' : 'var(--paper)';
  tg.setAttribute('filter', seg(t, 12.5, 12.7) * (1 - seg(t, 13.3, 13.8)) > 0.2 ? 'url(#kit-glow)' : '');
  cnt.textContent = `${on ? outC : outL} of ${NB}`;
  cnt.style.fill = on ? 'var(--paper)' : 'var(--red)';
  cntT.textContent = 'lags outside the noise band (±' + (on ? XC.bandC : XC.bandL).toFixed(2) + ')';
  const vv = ease.out(seg(t, 13.2, 13.8));
  verdict.setAttribute('opacity', vv); verdict.setAttribute('transform', `translate(0,${(1 - vv) * 18})`);

  cap(t); end(t, 14.9, 17.5);
}
run({ duration: 17.5, poster: 9.4, frame });
</script>
