el('path', { d: 'M0 0l0 30l8 -7l6 13l6 -3l-6 -12l11 0z', fill: 'var(--paper)', stroke: '#0b1712', 'stroke-width': 2 }, cur);

// Hook.
const hook = el('g', {}, svg);
const h1 = el('text', { x: 800, y: 450, class: 't-hook', 'text-anchor': 'middle', style: 'font-size:62px' }, hook);
h1.textContent = 'What happens to shipping';
const h2 = el('text', { x: 800, y: 535, class: 't-hook', 'text-anchor': 'middle', style: 'font-size:62px' }, hook);
h2.innerHTML = 'when a strait <tspan class="hot">turns hostile</tspan>?';

// Payoff.
const pay = el('g', { opacity: 0 }, svg);
el('rect', { width: 1600, height: 1000, fill: '#070f0b', opacity: .82 }, pay);
const p1 = el('text', { x: 800, y: 262, class: 't-hook', 'text-anchor': 'middle' }, pay);
p1.innerHTML = 'Hormuz, after the lanes were <tspan class="hot">declared clear</tspan>';
el('text', { x: 800, y: 318, class: 't-label', 'text-anchor': 'middle' }, pay).textContent = 'CENTCOM, 27 Aug 2026 · PortWatch counts to 27 Sep 2026';
const payN = el('text', { x: 690, y: 500, class: 'big', 'text-anchor': 'end' }, pay);
el('text', { x: 716, y: 452, class: 'mid' }, pay).textContent = 'ships a day';
el('text', { x: 716, y: 498, class: 'src', style: 'font-size:17px' }, pay).textContent = 'vs 85 in the 12 months to Feb. 2026';
const payP = el('text', { x: 800, y: 620, class: 'mid', 'text-anchor': 'middle', style: 'fill:var(--red);font-size:72px' }, pay);
el('text', { x: 800, y: 720, class: 'note', 'text-anchor': 'middle' }, pay).textContent = 'Ships that switch off their transponders are missed, so counts can understate traffic.';

const cap = captions(svg, [
  [0.3, 3.2, 'Daily ship counts at Bab el-Mandeb, Suez and Hormuz'],
  [3.5, 7.9, 'Nov. 2023: Houthi attacks begin. Bab el-Mandeb drains'],
  [8.1, 11.8, '2026: war with Iran, and Hormuz traffic collapses'],
  [12.0, 14.8, 'A month on, Hormuz traffic still has not come back'],
]);
const end = endCard(svg, { kicker: 'Interactive Deterrence', title: 'Red Sea & Hormuz Pulse', line: 'Daily ship traffic set against every attack, strike and pause.' });

// ---- Timeline ------------------------------------------------------------------------------------
const D = 18;
const dateAt = t => {
  const A0 = Date.parse('2023-10-01'), A1 = Date.parse('2024-06-01'), B0 = Date.parse('2026-02-14'), B1 = Date.parse('2026-03-15');
  if (t < 9.0) return A0 + ease.inOut(seg(t, 4.0, 7.6)) * (A1 - A0);
  return B0 + ease.inOut(seg(t, 9.4, 11.0)) * (B1 - B0);
};
function frame(t) {
  // hook
  const hu = ease.out(seg(t, 0.2, 0.9)), hOut = 1 - seg(t, 2.8, 3.3);
  h1.setAttribute('opacity', hu * hOut); h1.setAttribute('transform', `translate(0,${(1 - hu) * 18})`);
  const h2u = ease.out(seg(t, 0.8, 1.5));
  h2.setAttribute('opacity', h2u * hOut); h2.setAttribute('transform', `translate(0,${(1 - h2u) * 18})`);

  // map in
  const mi = ease.out(seg(t, 2.9, 3.9)), out = 1 - seg(t, 15.2, 15.6);
  cam.setAttribute('opacity', mi);
  laneEls.forEach(l => { l.setAttribute('stroke-dashoffset', (-t * 14).toFixed(1)); });

  const preset = t < 9.0 ? 'redsea' : 'hormuz26';
  const d = iso(Math.round(dateAt(t) / DAY) * DAY);
  dateT.textContent = nice(d);
  thumb.setAttribute('cx', sx(d));
  const B = BEFORE[preset];
  const pulseAt = [5.3, 10.7];
  for (const [key, m] of Object.entries(marks)) {
    const v = val(key, d), b = B[key], p = pct(b, v), c = tone(p);
    m.dot.setAttribute('r', R(v).toFixed(1)); m.ghost.setAttribute('r', R(b).toFixed(1));
    m.dot.setAttribute('fill', c); m.dot.setAttribute('fill-opacity', .22); m.dot.setAttribute('stroke', c);
    m.t2.textContent = `${fmtVal(v)} ships/day · ${fmtPct(p)}`; m.t2.style.fill = p <= -15 ? c : '';
    const hot = (key === 'bab' && t > 4.5 && t < 8.6) || (key === 'hormuz' && t > 10.0 && t < 12.6);
    m.dot.setAttribute('filter', hot && p <= -40 ? 'url(#kit-glow)' : '');
    const pk = pulseAt[key === 'bab' ? 0 : key === 'hormuz' ? 1 : 9] ?? 99, pu = seg(t, pk, pk + 1.2);
    m.pulse.setAttribute('r', (R(v) + 60 * ease.out(pu)).toFixed(1)); m.pulse.setAttribute('stroke', c);
    m.pulse.setAttribute('opacity', pu > 0 && pu < 1 ? (1 - pu) * 0.8 : 0);
  }
  ROWS.forEach(r => {
    const v = val(r.key, d), p = pct(B[r.key], v);
    r.v.textContent = fmtVal(v);
    r.d.textContent = fmtPct(p);
    r.d.style.fill = p <= -40 ? 'var(--red)' : p <= -15 ? 'var(--amber)' : p >= 15 ? 'var(--green)' : 'var(--muted)';
  });
  const on = preset === 'redsea' ? 0 : 2;
  chips.forEach((c, i) => {
    const lit = i === on && t > 3.3;
    c.r.style.stroke = lit ? 'var(--amber)' : ''; c.r.style.fill = lit ? '#2a2412' : '';
    c.t.style.fill = lit ? 'var(--amber)' : '';
  });
  ticks.forEach((tk, i) => { const hl = (EVD[i] === '2023-11-19' && t > 5.3 && t < 8.6) || (EVD[i] === '2026-02-28' && t > 10.2 && t < 12.6); tk.setAttribute('fill', hl ? 'var(--amber)' : 'var(--muted)'); tk.setAttribute('r', hl ? 5 : 2.6); });

  // event cards
  const ea = ease.out(seg(t, 5.3, 5.8)) * (1 - seg(t, 8.4, 8.8)), eb = ease.out(seg(t, 10.3, 10.8)) * (1 - seg(t, 12.6, 13.0));
  evA.setAttribute('opacity', ea); evA.setAttribute('transform', `translate(0,${(1 - ea) * 12})`); leadA.setAttribute('opacity', ea);
  evB.setAttribute('opacity', eb); evB.setAttribute('transform', `translate(0,${(1 - eb) * 12})`); leadB.setAttribute('opacity', eb);

  // cursor: grab the slider thumb and drag, then pick the Hormuz 2026 preset
  const th = [sx(d), SY];
  const P0 = [1300, 900], P1 = [sx('2023-10-01'), SY], P2 = [chips[2].cx, chips[2].cy];
  let cx = lerp(P0[0], P1[0], ease.inOut(seg(t, 3.2, 3.9))), cy = lerp(P0[1], P1[1], ease.inOut(seg(t, 3.2, 3.9)));
  if (t >= 3.9 && t < 8.0) { cx = th[0]; cy = th[1]; }
  if (t >= 8.0) { const u = ease.inOut(seg(t, 8.0, 8.8)); cx = lerp(sx('2024-06-01'), P2[0], u); cy = lerp(SY, P2[1], u); }
  if (t >= 9.1) { const u = ease.inOut(seg(t, 9.1, 9.4)); cx = lerp(P2[0], sx('2026-02-14'), u); cy = lerp(P2[1], SY, u); }
  if (t >= 9.4) { cx = th[0]; cy = th[1]; }
  if (t >= 11.2) { const u = ease.inOut(seg(t, 11.2, 11.8)); cx += u * 60; cy += u * 140; }
  cur.setAttribute('opacity', seg(t, 3.2, 3.5) * (1 - seg(t, 11.4, 11.8)));
  cur.setAttribute('transform', `translate(${(cx + 4).toFixed(1)},${(cy + 4).toFixed(1)})`);
  const press = Math.max(seg(t, 3.8, 3.95) * (1 - seg(t, 7.6, 7.9)), seg(t, 8.75, 8.9) * (1 - seg(t, 9.0, 9.2)), seg(t, 9.35, 9.5) * (1 - seg(t, 11.0, 11.3)));
  ring.setAttribute('r', lerp(28, 14, press)); ring.setAttribute('opacity', press);

  // camera: push toward Bab el-Mandeb, then drift to Hormuz
  const pa = ease.inOut(seg(t, 3.5, 7.8)) * (1 - ease.inOut(seg(t, 8.2, 9.6)));
  const pb = ease.inOut(seg(t, 9.0, 12.2));
  const s = 1 + 0.06 * pa + 0.06 * pb + 0.02 * ease.inOut(seg(t, 3, 15));
  const fx = 800 + (marks.bab.x - 800) * 0.25 * pa + (marks.hormuz.x - 800) * 0.2 * pb, fy = 500 + (marks.bab.y - 500) * 0.25 * pa + (marks.hormuz.y - 500) * 0.2 * pb;
  cam.setAttribute('transform', `translate(800,500) scale(${s.toFixed(4)}) translate(${-fx},${-fy})`);

  // payoff
  const po = ease.out(seg(t, 12.4, 13.0)) * (1 - seg(t, 15.2, 15.6));
  pay.setAttribute('opacity', po);
  const bl = Math.max(po, seg(t, 15.2, 15.6));
  blurG.setAttribute('stdDeviation', (bl * 6).toFixed(2));
  cam.setAttribute('filter', bl > 0.01 ? 'url(#rsh-blur)' : '');
  payN.textContent = fmtVal(lerp(84.84, 3.78, ease.out(seg(t, 12.7, 13.8))));
  const pp = ease.out(seg(t, 13.5, 14.0));
  payP.textContent = fmtPct(pct(84.84, 3.78));
  payP.setAttribute('opacity', pp); payP.setAttribute('transform', `translate(0,${(1 - pp) * 16})`);
  payN.setAttribute('filter', t > 13.8 && t < 15.2 ? 'url(#kit-glow)' : '');

  cap(t); end(t, 15.3, D);
}
run({ duration: D, poster: 11.3, frame });
</script>
