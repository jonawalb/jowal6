const slFill = el('line', { x1: xb(0) + BW / 2, y1: SLY, y2: SLY, stroke: 'var(--amber)', 'stroke-width': 4, 'stroke-linecap': 'round' }, col);
const thumb = el('circle', { cy: SLY, r: 11, fill: 'var(--amber)', stroke: '#0b1712', 'stroke-width': 3, filter: 'url(#kit-glow)' }, col);
txt(1010, 632, 't-label', 'Statements that day', { style: 'font-size:12px' }, col);
const feed = el('g', {}, col);
const wrap = (s, n) => { const a = []; let c = ''; for (const w of s.split(' ')) { if ((c + ' ' + w).trim().length > n) { a.push(c); c = w; } else c = (c + ' ' + w).trim(); } a.push(c); return a; };
const items = TL.map(([k, who, s, src]) => {
  const g = el('g', { opacity: 0 }, feed);
  el('rect', { x: 1010, y: -16, width: 4, height: 64, fill: 'var(--amber)' }, g);
  txt(1026, 0, 'js-who', who, {}, g);
  wrap(s, 50).forEach((ln, j) => txt(1026, 22 + j * 20, 'js-st', ln, {}, g));
  txt(1026, 44 + (wrap(s, 50).length - 1) * 20, 'js-src', src, {}, g);
  return { g, k, h: 76 + (wrap(s, 50).length - 1) * 20 };
});

// ---- Hook and payoff -----------------------------------------------------------------------------------------
const hook = el('g', {}, svg);
const h1 = txt(800, 440, 't-hook', 'Seven zones around Taiwan,', { 'text-anchor': 'middle', style: 'font-size:66px' }, hook);
const h2 = el('text', { x: 800, y: 530, class: 't-hook', 'text-anchor': 'middle', style: 'font-size:66px' }, hook);
h2.innerHTML = 'published the <tspan class="hot">morning before.</tspan>';

const pay = el('g', { opacity: 0 }, svg);
el('rect', { width: 1600, height: 1000, fill: '#070f0b', opacity: .9 }, pay);
const pH = el('text', { x: 800, y: 178, class: 't-hook', 'text-anchor': 'middle', style: 'font-size:52px' }, pay);
pH.innerHTML = 'Six exercises. Each spike <tspan class="hot">falls back.</tspan>';
const pS = txt(800, 220, 'js-fine', 'PLA aircraft as a multiple of the prior 30-day mean, aligned on day 0', { 'text-anchor': 'middle' }, pay);
const GX0 = 330, GX1 = 1270, GY0 = 720, GKY = 36;
const gx = k => GX0 + (k + 7) / 15 * (GX1 - GX0), gy = v => GY0 - v * GKY;
const pAx = el('g', {}, pay);
[0, 4, 8, 12].forEach(v => { el('line', { x1: GX0, x2: GX1, y1: gy(v), y2: gy(v), stroke: v ? '#27493a' : 'var(--muted)', 'stroke-dasharray': v ? '2 6' : '' }, pAx); txt(GX0 - 12, gy(v) + 5, 'js-ax', v + '×', { 'text-anchor': 'end', style: 'font-size:15px' }, pAx); });
el('line', { x1: GX0, x2: GX1, y1: gy(1), y2: gy(1), stroke: 'var(--paper)', 'stroke-width': 1.5, 'stroke-dasharray': '8 6', opacity: .6 }, pAx);
txt(GX1, gy(1) - 8, 'js-ax', '1× = usual level', { 'text-anchor': 'end', style: 'font-size:14px;fill:var(--paper)' }, pAx);
[-7, 0, 8].forEach(k => txt(gx(k), GY0 + 28, 'js-ax', k === 0 ? 'day 0' : (k > 0 ? '+' : '−') + Math.abs(k), { 'text-anchor': 'middle', style: 'font-size:15px' }, pAx));
const lines = CMP.map(([name, v], i) => {
  const jm = i === 5, pts = v.map((y, j) => (y == null ? null : [gx(j - 7), gy(y)])).filter(Boolean);
  const p = el('path', { d: 'M' + pts.map(q => q.map(n => n.toFixed(1)).join(' ')).join('L'), fill: 'none', stroke: jm ? 'var(--red)' : i === 3 ? 'var(--amber)' : 'var(--muted)', 'stroke-width': jm || i === 3 ? 3.2 : 1.8, 'stroke-linejoin': 'round', pathLength: 1, opacity: jm || i === 3 ? 1 : .75 }, pay);
  if (jm || i === 3) p.setAttribute('filter', 'url(#kit-glow)');
  return p;
});
const pk1 = el('g', {}, pay); txt(gx(0) + 14, gy(11.504) + 6, 'js-pk', 'Joint Sword-2024B 11.5×', { style: 'fill:var(--amber)' }, pk1);
const pk2 = el('g', {}, pay); txt(gx(0) - 14, gy(9.873) + 6, 'js-pk', 'Justice Mission-2025 9.9×', { 'text-anchor': 'end', style: 'fill:var(--red)' }, pk2);
const pN = txt(800, 808, 'js-fine', 'Also shown: Dec. 2022 drills, Joint Sword, Joint Sword-2024A, Strait Thunder-2025A', { 'text-anchor': 'middle' }, pay);

const cap = captions(svg, [
  [3.3, 5.6, 'Replay a PLA exercise day by day'],
  [5.7, 8.3, 'Published zones, daily counts and statements, dated'],
  [8.4, 10.0, 'Then it ends, and the count drops'],
  [10.4, 13.0, 'Overlay any exercises on day 0 and compare'],
]);
const end = endCard(svg, { kicker: 'Interactive Deterrence', title: 'Anatomy of an Exercise', line: 'Major PLA exercises around Taiwan, replayed day by day.' });

// ---- Timeline --------------------------------------------------------------------------------------------------
const D = 16.5;
// Slider keyframes [time, day offset]: glide from day -4 into the exercise, hold on the key days.
const KF = [[3.2, -4], [5.0, -1], [5.5, 0], [7.2, 0], [7.5, 1], [8.9, 1], [9.2, 2], [10.2, 2]];
function dayAt(t) {
  if (t <= KF[0][0]) return KF[0][1];
  for (let i = 1; i < KF.length; i++) if (t <= KF[i][0]) return lerp(KF[i - 1][1], KF[i][1], ease.inOut(seg(t, KF[i - 1][0], KF[i][0])));
  return KF[KF.length - 1][1];
}
const kStart = k => KF.find(([, v], i) => v >= k && (i === 0 || KF[i - 1][1] < k))?.[0] ?? 0;

function frame(t) {
  const out = 1 - seg(t, 13.3, 13.9);
  [h1, h2].forEach((h, i) => {
    const u = ease.out(seg(t, 0.25 + i * 0.4, 1.0 + i * 0.4)), o = 1 - seg(t, 2.6 + i * 0.1, 3.1 + i * 0.1);
    op(h, u * o); h.setAttribute('transform', `translate(0,${((1 - u) * 24 - seg(t, 2.6, 3.2) * 18).toFixed(1)})`);
  });
  const push = ease.inOut(seg(t, 3.0, 13.5));
  cam.setAttribute('transform', `translate(760,500) scale(${(1 + 0.035 * push).toFixed(4)}) translate(-760,-500)`);
  op(map, lerp(0.3 * ease.out(seg(t, 0, 1)), 1, ease.inOut(seg(t, 2.6, 3.4))) * lerp(1, 0.2, ease.inOut(seg(t, 10.2, 10.8))) * out);
  op(col, ease.out(seg(t, 3.0, 3.6)) * lerp(1, 0.15, ease.inOut(seg(t, 10.2, 10.8))) * out);
  col.setAttribute('transform', `translate(${((1 - ease.out(seg(t, 3.0, 3.8))) * 40).toFixed(1)},0)`);

  // Day, slider, cursor.
  const kf = dayAt(t), k = Math.round(kf), i = k + 7;
  dateT.textContent = dateOf(k); kT.textContent = '· ' + dayLabel(k);
  const cx = xb(kf + 7) + BW / 2;
  thumb.setAttribute('cx', cx.toFixed(1)); slFill.setAttribute('x2', cx.toFixed(1));
  cur.setAttribute('x1', cx.toFixed(1)); cur.setAttribute('x2', cx.toFixed(1));
  bars.forEach((b, j) => {
    const isCur = j === i, during = b.k === 0 || b.k === 1;
    const ks = kStart(b.k), pop = isCur && b.k >= 0 ? ease.back(seg(t, ks, ks + 0.35)) : 1;
    const h = Math.max(1, b.v * KY) * (isCur ? pop : 1);
    b.r.setAttribute('y', (BY0 - h).toFixed(1)); b.r.setAttribute('height', h.toFixed(1));
    b.r.setAttribute('fill', isCur ? 'var(--amber)' : during ? 'var(--red)' : '#5f7d6d');
    b.r.setAttribute('filter', isCur && during ? 'url(#kit-glow)' : '');
    op(b.t, isCur ? 1 : 0); b.t.setAttribute('y', (BY0 - h - 8).toFixed(1)); b.t.style.fill = isCur ? 'var(--amber)' : '';
  });

  // Zones: hidden before Dec. 29, announced (dashed outline) on Dec. 29, in force Dec. 30, done after.
  const tA = kStart(0), tOn = kStart(1), tDone = kStart(2);
  zones.forEach((z, j) => {
    const a = tA + 0.15 + j * 0.12, u = ease.inOut(seg(t, a, a + 0.7));
    const on = ease.out(seg(t, tOn + 0.1 + j * 0.06, tOn + 0.5 + j * 0.06)), done = ease.out(seg(t, tDone, tDone + 0.5));
    z.path.setAttribute('stroke-dasharray', on > 0 ? '' : `${(u * 0.012).toFixed(4)} 0.012`);
    if (on === 0 && u < 1) z.path.setAttribute('stroke-dasharray', `${u.toFixed(4)} 1`);
    else if (on === 0) z.path.setAttribute('stroke-dasharray', '0.012 0.01');
    z.path.setAttribute('fill-opacity', (0.32 * on * (1 - 0.6 * done)).toFixed(3));
    z.path.setAttribute('stroke-width', (2 + on * (1 - done) * (1 + Math.sin(t * 6 + j)) * 0.8).toFixed(2));
    z.path.setAttribute('filter', on > 0.5 && done < 0.5 ? 'url(#kit-glow)' : '');
    op(z.g, (t < a ? 0 : 1) * (1 - 0.55 * done));
    op(z.l, seg(t, a + 0.4, a + 0.7));
  });
  const st = t < tA ? 0 : t < tOn ? 1 : t < tDone ? 2 : 3;
  tagA.textContent = ['No zones announced yet', '7 zones announced (dashed)', '7 zones in force, 08:00–18:00', 'Zones expired'][st];
  tagB.textContent = ['Official notices drawn, vertex by vertex', 'ETC notice: 5 · China MSA warning: 7', 'Beijing time, per the notices', 'Drills declared complete Dec. 31'][st];
  tagA.style.fill = st === 2 ? 'var(--red)' : 'var(--paper)';
  op(mapTag, ease.out(seg(t, 3.3, 3.8)));

  // Statements for the current day, stacked.
  let y = 668;
  items.forEach(it => {
    const show = it.k === k && t >= kStart(it.k);
    const idx = TL.filter(x => x[0] === it.k).findIndex(x => x[2] === TL[items.indexOf(it)][2]);
    const u = show ? ease.out(seg(t, kStart(it.k) + 0.2 + idx * 0.35, kStart(it.k) + 0.6 + idx * 0.35)) : 0;
    op(it.g, u);
    if (show) { it.g.setAttribute('transform', `translate(${((1 - u) * 24).toFixed(1)},${y})`); y += it.h; }
  });

  // Payoff: the compare overlay.
  const pu = ease.out(seg(t, 10.3, 10.9)) * (1 - seg(t, 13.3, 13.8));
  op(pay, pu);
  op(pH, ease.out(seg(t, 10.4, 11.0))); op(pS, ease.out(seg(t, 10.6, 11.1))); op(pAx, ease.out(seg(t, 10.5, 11.0)));
  lines.forEach((p, j) => { const a = 10.8 + j * 0.12, u = ease.inOut(seg(t, a, a + 1.3)); p.setAttribute('stroke-dasharray', `${u.toFixed(4)} 1`); });
  op(pk1, ease.out(seg(t, 11.8, 12.2))); op(pk2, ease.out(seg(t, 12.0, 12.4))); op(pN, ease.out(seg(t, 12.1, 12.5)));

  cap(t); end(t, 13.5, D);
}
run({ duration: D, poster: 8.2, frame });
</script>
